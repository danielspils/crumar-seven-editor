# One tag, one release, both platforms.
#
# THE RULE THIS WORKFLOW EXISTS TO ENFORCE: a version's Mac and Windows assets
# land on the SAME GitHub release, and nothing is visible to users until both
# are there. JP Patches published them as two releases per version, so the
# Windows updater looked for latest.yml on a release that carried only Mac
# assets and 404'd in silence for months.
#
# NEITHER PLATFORM JOB PUBLISHES. They build with `--publish never` and hand
# their artifacts to a final job, which creates ONE release from both.
#
# The first attempt had them both publish into a draft, and that raced: two
# concurrent electron-builder publishers each created their own draft, and
# GitHub happily holds several drafts on one tag. v1.0.0's first run produced
# FOUR, between them holding a single asset anybody could see. Uploading
# artifacts and creating the release once, from one job, cannot race.
#
# Secrets are not exposed to fork pull requests, and this only ever runs on a
# tag pushed to this repository, so an unsigned build cannot reach a release.

name: Release

on:
  push:
    tags: ['v*']
  # Available by hand for a dry run: builds and signs, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Tests and version guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test "test/*.test.js"` needs Node's own glob
          # expansion, which arrived in 21. Under 20 the quoted pattern reaches
          # node literally and it reports "Could not find test/*.test.js" — the
          # first release tag died on exactly that. 22 also matches the Node
          # inside Electron 43.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      # A tag that disagrees with package.json produces a release whose
      # updater metadata points at a version the app will never match. Catch
      # it here, where the cost is one red X instead of a bad release.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG"

  mac:
    name: macOS (universal, signed + notarized)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test "test/*.test.js"` needs Node's own glob
          # expansion, which arrived in 21. Under 20 the quoted pattern reaches
          # node literally and it reports "Could not find test/*.test.js" — the
          # first release tag died on exactly that. 22 also matches the Node
          # inside Electron 43.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # @julusian/midi is native: without this the packaged app opens and then
      # cannot see a single MIDI port.
      - run: npm run rebuild
      - name: Build, sign, notarize, publish to the draft release
        env:
          # Developer ID Application certificate, exported as .p12 and
          # base64-encoded, plus its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization. An app-specific password, never the Apple ID's own.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --universal --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  win:
    name: Windows (NSIS x64, Azure-signed)
    needs: verify
    runs-on: windows-latest
    # Azure signing is a network round trip per binary — the app exe, the
    # uninstaller pieces and the installer itself.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test "test/*.test.js"` needs Node's own glob
          # expansion, which arrived in 21. Under 20 the quoted pattern reaches
          # node literally and it reports "Could not find test/*.test.js" — the
          # first release tag died on exactly that. 22 also matches the Node
          # inside Electron 43.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run rebuild
      # Installed here rather than by electron-builder: its own Azure path
      # runs Install-Module inside a captured pipe and hangs (see
      # scripts/win-sign.js). Pre-installing is fast and visible.
      - name: Install the TrustedSigning module
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name TrustedSigning -Force -Scope CurrentUser -AllowClobber
      - name: Build, sign, publish to the draft release
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [mac, win]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # NOT "assets": that is a real directory in this repo (fonts, instrument
      # art, the panel SVG). Downloading into it merged the two, and the upload
      # step then shipped all of it — v1.0.0 went public carrying 24 stray
      # files that had to be deleted by hand.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Everything an updater needs, before anything is public
        run: |
          find release-assets -type f | sort
          have() { find release-assets -type f -name "$1" | grep -q . || { echo "missing: $1"; exit 1; }; }
          # Both metadata files: without one, that platform's installed copies
          # would never see this version.
          have 'latest.yml'
          have 'latest-mac.yml'
          have '*.exe'
          have '*.dmg'
          have '*-mac.zip'    # the mac updater reads the zip, not the dmg
      # docs/release-notes/<tag>.md is the BODY when it exists. v1.1.0 shipped
      # with commit-generated notes and Daniel's own words had to be pasted in
      # by hand afterwards — the notes are written and approved before the tag,
      # so they should travel with it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "using $NOTES"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES" \
              $(find release-assets -type f | sort)
          else
            echo "no $NOTES — falling back to generated notes"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $(find release-assets -type f | sort)
          fi
