<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" style="--k-glow-fill: hsla(120, 90%, 55%, 0.3); --k-bore-fill: hsla(120, 90%, 72%, 1); --k-bore-stroke: hsla(120, 90%, 55%, 1); --k-top-stroke: hsla(120, 90%, 70%, 0.65); --k-mid-stroke: hsla(120, 90%, 65%, 0.35); --k-skirt-stroke: hsla(120, 90%, 65%, 0.55); --k-rib-stroke: hsla(120, 90%, 70%, 0.4); --k-shadow: hsla(120, 90%, 55%, 0.45);">
  <title>This Seven Goes to Eleven</title>
  <defs>
    <radialGradient id="kg-body" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#e8e8ee" stop-opacity="0.16"/>
      <stop offset="0.85" stop-color="#cfcfd8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9a9aa4" stop-opacity="0.24"/>
    </radialGradient>
    <radialGradient id="kg-top" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#e6e6ec" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#b9b9c2" stop-opacity="0.32"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="hsl(120, 90%, 55%)" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="hsl(120, 90%, 50%)" stop-opacity="0.14"/>
      <stop offset="1" stop-color="hsl(120, 90%, 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343437"/>
      <stop offset="1" stop-color="#232326"/>
    </linearGradient>
    <!-- The app's own lit-knob shadow, at 6px against a 72px knob, kept in
         proportion here. NO DOUBLE HYPHENS IN THIS COMMENT, and none in any
         other: the custom property it refers to cannot be named here, because
         a double hyphen inside an XML comment is illegal and the whole file
         is then rejected by anything parsing it strictly. Rendering the SVG
         inside a page hid it (HTML parsing is lenient); drawing it through an
         Image, which is how the icons are rasterised, failed with nothing but
         "svg failed to decode". -->
    <filter id="litglow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="7.4"
                    flood-color="hsl(120, 90%, 55%)" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body"><rect width="1024" height="1024" rx="180"/></clipPath>
  </defs>
  <g clip-path="url(#body)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="472" cy="520" r="450" fill="url(#lamp)"/>
    <circle cx="472" cy="520" r="268" fill="#2b2b2d"/>
    <g transform="translate(472.0 520.0) scale(7.3611)" filter="url(#litglow)">
      <g id="knob-glass">
      <circle class="k-glow" r="34.71" style="fill: var(--k-glow-fill, transparent)"/>
      <circle class="k-skirt" r="36.0" style="fill: url(#kg-body); stroke: var(--k-skirt-stroke, rgba(255,255,255,0.28)); stroke-width: 1.4"/>
