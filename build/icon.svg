      <circle class="k-mid" r="27.0" style="fill: none; stroke: var(--k-mid-stroke, rgba(255,255,255,0.16)); stroke-width: 1.2"/>
      <circle class="k-top" r="17.36" style="fill: url(#kg-top); stroke: var(--k-top-stroke, rgba(255,255,255,0.32)); stroke-width: 1.3"/>
      <circle class="k-bore" r="8.36" style="fill: var(--k-bore-fill, rgba(228,228,236,0.30)); stroke: var(--k-bore-stroke, rgba(255,255,255,0.14)); stroke-width: 1.2"/>
    </g>
    </g>
