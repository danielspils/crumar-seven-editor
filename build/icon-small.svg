<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" style="--k-glow-fill: hsla(120, 90%, 55%, 0.3); --k-bore-fill: hsla(120, 90%, 72%, 1); --k-bore-stroke: hsla(120, 90%, 55%, 1); --k-top-stroke: hsla(120, 90%, 70%, 0.65); --k-mid-stroke: hsla(120, 90%, 65%, 0.35); --k-skirt-stroke: hsla(120, 90%, 65%, 0.55); --k-rib-stroke: hsla(120, 90%, 70%, 0.4); --k-shadow: hsla(120, 90%, 55%, 0.45);">
  <title>This Seven Goes to Eleven</title>
  <defs>
    <radialGradient id="kg-body" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#e8e8ee" stop-opacity="0.16"/>
      <stop offset="0.85" stop-color="#cfcfd8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9a9aa4" stop-opacity="0.24"/>
    </radialGradient>
    <radialGradient id="kg-top" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#e6e6ec" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#b9b9c2" stop-opacity="0.32"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="hsl(120, 90%, 55%)" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="hsl(120, 90%, 50%)" stop-opacity="0.14"/>
      <stop offset="1" stop-color="hsl(120, 90%, 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343437"/>
      <stop offset="1" stop-color="#232326"/>
    </linearGradient>
    <!-- The app's own lit-knob shadow, at 6px against a 72px knob, kept in
         proportion here. NO DOUBLE HYPHENS IN THIS COMMENT, and none in any
         other: the custom property it refers to cannot be named here, because
         a double hyphen inside an XML comment is illegal and the whole file
         is then rejected by anything parsing it strictly. Rendering the SVG
         inside a page hid it (HTML parsing is lenient); drawing it through an
         Image, which is how the icons are rasterised, failed with nothing but
         "svg failed to decode". -->
    <filter id="litglow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="11.1"
                    flood-color="hsl(120, 90%, 55%)" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body"><rect width="1024" height="1024" rx="180"/></clipPath>
  </defs>
  <g clip-path="url(#body)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="512" r="680" fill="url(#lamp)"/>
    <circle cx="512" cy="512" r="404" fill="#2b2b2d"/>
    <g transform="translate(512.0 512.0) scale(11.1111)" filter="url(#litglow)">
      <g id="knob-glass">
      <circle class="k-glow" r="34.71" style="fill: var(--k-glow-fill, transparent)"/>
      <circle class="k-skirt" r="36.0" style="fill: url(#kg-body); stroke: var(--k-skirt-stroke, rgba(255,255,255,0.28)); stroke-width: 1.4"/>
      <g class="k-ribs" style="stroke: var(--k-rib-stroke, rgba(255,255,255,0.20)); stroke-width: 1.9; stroke-linecap: round"><line x1="0.00" y1="-29.31" x2="0.00" y2="-35.10"/><line x1="6.09" y1="-28.67" x2="7.30" y2="-34.33"/><line x1="11.92" y1="-26.78" x2="14.28" y2="-32.07"/><line x1="17.23" y1="-23.71" x2="20.63" y2="-28.40"/><line x1="21.78" y1="-19.61" x2="26.08" y2="-23.49"/><line x1="25.38" y1="-14.66" x2="30.40" y2="-17.55"/><line x1="27.88" y1="-9.06" x2="33.38" y2="-10.85"/><line x1="29.15" y1="-3.06" x2="34.91" y2="-3.67"/><line x1="29.15" y1="3.06" x2="34.91" y2="3.67"/><line x1="27.88" y1="9.06" x2="33.38" y2="10.85"/><line x1="25.38" y1="14.65" x2="30.40" y2="17.55"/><line x1="21.78" y1="19.61" x2="26.08" y2="23.49"/><line x1="17.23" y1="23.71" x2="20.63" y2="28.40"/><line x1="11.92" y1="26.78" x2="14.28" y2="32.07"/><line x1="6.09" y1="28.67" x2="7.30" y2="34.33"/><line x1="0.00" y1="29.31" x2="0.00" y2="35.10"/><line x1="-6.09" y1="28.67" x2="-7.30" y2="34.33"/><line x1="-11.92" y1="26.78" x2="-14.28" y2="32.07"/><line x1="-17.23" y1="23.71" x2="-20.63" y2="28.40"/><line x1="-21.78" y1="19.61" x2="-26.08" y2="23.49"/><line x1="-25.38" y1="14.66" x2="-30.40" y2="17.55"/><line x1="-27.88" y1="9.06" x2="-33.38" y2="10.85"/><line x1="-29.15" y1="3.06" x2="-34.91" y2="3.67"/><line x1="-29.15" y1="-3.06" x2="-34.91" y2="-3.67"/><line x1="-27.88" y1="-9.06" x2="-33.38" y2="-10.85"/><line x1="-25.38" y1="-14.66" x2="-30.40" y2="-17.55"/><line x1="-21.78" y1="-19.61" x2="-26.08" y2="-23.49"/><line x1="-17.23" y1="-23.71" x2="-20.63" y2="-28.40"/><line x1="-11.92" y1="-26.78" x2="-14.28" y2="-32.07"/><line x1="-6.09" y1="-28.67" x2="-7.30" y2="-34.33"/></g>
      <circle class="k-mid" r="27.0" style="fill: none; stroke: var(--k-mid-stroke, rgba(255,255,255,0.16)); stroke-width: 1.2"/>
      <circle class="k-top" r="17.36" style="fill: url(#kg-top); stroke: var(--k-top-stroke, rgba(255,255,255,0.32)); stroke-width: 1.3"/>
      <circle class="k-bore" r="8.36" style="fill: var(--k-bore-fill, rgba(228,228,236,0.30)); stroke: var(--k-bore-stroke, rgba(255,255,255,0.14)); stroke-width: 1.2"/>
    </g>
    </g>
  </g>
</svg>
