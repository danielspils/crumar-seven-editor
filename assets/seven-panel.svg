<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2160 210" width="2160" height="210" role="img" aria-label="Crumar Seven front panel" class="seven-panel readonly">
  <title>Crumar Seven front panel</title>

  <style>
    /* Self-hosted panel font (no CDN; the app works offline). Path is relative
       to this file so the SVG renders correctly opened standalone in a browser.
       When inlined into the app DOM, preload.js strips this block and the app
       supplies the same face via a data: URI instead (the relative path would
       resolve against src/ there). */
    @font-face {
      font-family: 'Archivo';
      src: url('fonts/Archivo-Variable.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Archivo Narrow';
      src: url('fonts/ArchivoNarrow-Italic-Variable.woff2') format('woff2');
      font-weight: 400 700;
      font-style: italic;
      font-display: swap;
    }
    .panel-bg  { fill: #2b2b2d; }
    .knob-face { fill: #ececee; stroke: #a8a8ad; stroke-width: 2; }
    /* Ring circles are geometry only — unstroked at rest. The app strokes them
       for hover/focus states. Deliberate departure from the instrument, which
       rings every knob (docs/DESIGN.md: fidelity traded for a legible focus
       state). */
    .knob-ring { fill: none; stroke: none; stroke-width: 3; }
    .knob-ptr  { stroke: #232325; stroke-width: 2.5; stroke-linecap: round; }
    /* Shared button component: FX1/FX2 SELECT, transpose, CLAVI TABS all use
       .btn so they stay consistent (presets add .btn-face on top). */
    .btn       { fill: #232325; stroke: #6d6d72; stroke-width: 1.5; rx: 3; }
    .btn.on    { fill: #7d1418; }
    /* Preset/bank button layers: recessed bezel, narrow raised face (lighter
       stroke on lower/outer edges only), inset LED panel in the top third.
       Decorative layers pass clicks through to the .btn face beneath. */
    .btn-face  { stroke: none; }
    .btn-bezel { fill: #1a1a1c; pointer-events: none; }
    .btn-edge  { fill: none; stroke: #5a5a5f; stroke-width: 1; pointer-events: none; }
    .btn-inset { fill: #141416; pointer-events: none; }
    /* Silkscreen legends: heavier, narrower, all caps, italic — bundled
       Archivo Narrow (true italic). Tracking slightly reduced from the plain
       face so condensed+bold doesn't crowd. Panel strip only. */
    .lbl       { fill: #e8e8ea; font-family: 'Archivo Narrow', 'Archivo', Helvetica, Arial, sans-serif; font-weight: bold; font-style: italic; font-size: 13px; letter-spacing: .05em; text-anchor: middle; }
    .lbl-sm    { fill: #c8c8cc; font-family: 'Archivo Narrow', 'Archivo', Helvetica, Arial, sans-serif; font-weight: bold; font-style: italic; font-size: 10px; letter-spacing: .04em; text-anchor: middle; }
    .lbl-fx    { fill: #e8e8ea; font-family: 'Archivo', Helvetica, Arial, sans-serif; font-size: 19px; font-style: italic; letter-spacing: .08em; text-anchor: middle; }
    .lbl-alt   { fill: #d9c24a; font-family: 'Archivo Narrow', 'Archivo', Helvetica, Arial, sans-serif; font-weight: bold; font-style: italic; font-size: 14px; letter-spacing: .03em; text-anchor: middle; }
    .lbl-alt-lg { font-size: 16px; }
    .transpose-sym { font-size: 17px; }
    .lbl-fxled { font-size: 8.5px; }
    /* Size overrides, matched against the reference photo: BANK is one of the
       largest legends on the instrument; preset numbers/labels sit between it
       and the small captions. */
    .lbl-lg     { font-size: 18px; }
    .lbl-preset { font-size: 15px; }
    .lbl-num    { font-size: 12px; }
    .clavi-line { stroke: #d9c24a; stroke-width: 1; fill: none; }
    /* Clavi tabs only act on the modeled Clavi engine (pno_zd6); the app dims
       the whole group when any other sound is selected. */
    #clavi-group { transition: opacity .2s; }
    #clavi-group.inactive { opacity: .55; }
    .lbl-cyan  { fill: #4fc3d9; }
    .lbl-red   { fill: #d9534f; }
    .lbl-blue  { fill: #5b8fd9; }
    .led       { fill: #4a1416; stroke: #1a1a1c; stroke-width: .5; }
    .led.on    { fill: #ff3b30; }
    .led.amber { fill: #4a3a14; }
    .led.amber.on { fill: #ffb020; }
    .transpose-border { fill: none; stroke: #6d6d72; stroke-width: 1; }
    .kbd-icon  { fill: none; stroke: #6d6d72; stroke-width: 1; }
    .kbd-white { fill: #c8c8cc; }
    .kbd-black { fill: #141416; }
    /* Transparent full-button hit targets (preset/bank), drawn last and sized
       to the bezel. Cursor set here; the app re-enables pointer events. */
    .btn-hit   { fill: transparent; cursor: pointer; }
    /* CSS text-anchor overrides presentation attributes; honor authored
       text-anchor="start" (LED labels, bank numerals) over class defaults. */
    text[text-anchor="start"] { text-anchor: start; }
    .divider   { stroke: #46464a; stroke-width: 1; }
    .readonly .btn, .readonly .knob-face { cursor: default; pointer-events: none; }
  </style>

  <rect class="panel-bg" x="0" y="0" width="2160" height="210" rx="6"/>

  <g id="sec-volume">
    <text class="lbl" x="72" y="30">VOLUME</text>
    <g id="knob-volume">
      <circle class="knob-face" cx="72" cy="105" r="28"/>
      <circle class="knob-ring" cx="72" cy="105" r="35"/>
      <line class="knob-ptr" x1="72" y1="105" x2="72" y2="82"/>
      <circle class="knob-hit" cx="72" cy="105" r="35" fill="transparent" role="button" aria-label="Toggle Master Volume / EQ section"/>
    </g>
    <!-- Silkscreened legend, not an indicator light. Local Off state is shown
         by the volume knob turning BLUE (slow push ≥100ms toggles it); that cue
         belongs on the knob when device wiring lands — SysEx visibility of
         Local Off is unknown (docs/PROJECT-SCOPE.md). -->
    <rect x="38" y="168" width="68" height="17" rx="2" fill="#8e2f8e"/>
    <text class="lbl-sm" x="72" y="181" fill="#ffffff">LOCAL OFF</text>
  </g>

  <g id="sec-reverb">
    <text class="lbl" x="196" y="30">REVERB</text>
    <g id="knob-reverb">
      <circle class="knob-face" cx="196" cy="105" r="28"/>
      <circle class="knob-ring" cx="196" cy="105" r="35"/>
      <line class="knob-ptr" x1="196" y1="105" x2="196" y2="82"/>
      <circle class="knob-hit" cx="196" cy="105" r="35" fill="transparent" role="button" aria-label="Toggle Reverb section"/>
    </g>
    <circle class="led on" id="led-rev-level" cx="252" cy="46" r="5"/>
    <text class="lbl-sm" x="292" y="50" text-anchor="start">LEVEL</text>
    <circle class="led" id="led-rev-decay" cx="252" cy="70" r="5"/>
    <text class="lbl-sm" x="292" y="74" text-anchor="start">DECAY</text>
  </g>

  <g id="sec-eq">
    <g id="knob-bass-mid">
      <circle class="knob-face" cx="380" cy="105" r="28"/>
      <circle class="knob-ring" cx="380" cy="105" r="35"/>
      <line class="knob-ptr" x1="380" y1="105" x2="380" y2="82"/>
      <circle class="knob-hit" cx="380" cy="105" r="35" fill="transparent" role="button" aria-label="Toggle Master Volume / EQ section"/>
    </g>
    <text class="lbl-sm" x="380" y="30">BASS</text>
    <text class="lbl-sm" x="380" y="46">MIDDLE</text>

    <g id="knob-treble-midf">
      <circle class="knob-face" cx="500" cy="105" r="28"/>
      <circle class="knob-ring" cx="500" cy="105" r="35"/>
      <line class="knob-ptr" x1="500" y1="105" x2="500" y2="82"/>
      <circle class="knob-hit" cx="500" cy="105" r="35" fill="transparent" role="button" aria-label="Toggle Master Volume / EQ section"/>
    </g>
    <text class="lbl-sm" x="500" y="30">TREBLE</text>
    <text class="lbl-sm" x="500" y="46">MID FREQ</text>
  </g>

  <line class="divider" x1="562" y1="26" x2="562" y2="184"/>

  <g id="sec-clavi-tabs">
    <!-- Transpose: flat/sharp flank the switch; a single U-shaped line (open at
         the top) runs from below the flat, under the button with a small gap,
         up to below the sharp. Separate from the amber Clavi grouping line.
         LED lights while transposition is active; transposition resets to zero
         at power-on, so it renders unlit. -->
    <path class="transpose-border" d="M580 79 V99 H611 M627 99 H658 V79"/>
    <rect class="kbd-white" x="607.5" y="30.5" width="7" height="14"/>
    <rect class="kbd-white" x="615.5" y="30.5" width="7" height="14"/>
    <rect class="kbd-white" x="623.5" y="30.5" width="7" height="14"/>
    <rect class="kbd-black" x="613" y="30.5" width="4" height="9"/>
    <rect class="kbd-black" x="621" y="30.5" width="4" height="9"/>
    <rect class="kbd-icon" x="606.5" y="30" width="25" height="15"/>
    <text class="lbl-sm transpose-sym" x="580" y="76">♭</text>
    <text class="lbl-sm transpose-sym" x="658" y="76">♯</text>
    <rect class="btn" id="btn-transpose" x="596" y="52" width="46" height="34"/>
    <circle class="led" id="led-transpose" cx="619" cy="99" r="4"/>
  </g>

  <g id="sec-bank">
    <text class="lbl lbl-lg" x="700" y="30">BANK</text>
    <rect class="btn-bezel" x="676" y="48" width="48" height="68" rx="3"/>
    <rect class="btn btn-face on" id="btn-bank" x="680" y="52" width="40" height="60"/>
    <path class="btn-edge" d="M680 112 L720 112 L720 52"/>
    <rect class="btn-inset" x="683" y="55" width="34" height="17" rx="1"/>
    <rect class="btn-hit" data-hit="bank" x="676" y="48" width="48" height="68" role="button" aria-label="Cycle preset bank"/>
    <circle class="led amber on" id="led-bank-1" cx="748" cy="48"  r="5"/>
    <text class="lbl-sm" x="766" y="52" text-anchor="start">1</text>
    <circle class="led amber"    id="led-bank-2" cx="748" cy="70"  r="5"/>
    <text class="lbl-sm" x="766" y="74" text-anchor="start">2</text>
    <circle class="led amber"    id="led-bank-3" cx="748" cy="92"  r="5"/>
    <text class="lbl-sm" x="766" y="96" text-anchor="start">3</text>
    <circle class="led amber"    id="led-bank-4" cx="748" cy="114" r="5"/>
    <text class="lbl-sm" x="766" y="118" text-anchor="start">4</text>
  </g>

  <g id="sec-presets">
    <g id="preset-1">
      <text class="lbl-sm lbl-num" x="836" y="30">1</text>
      <text class="lbl lbl-preset" x="836" y="48">TINES</text>
      <rect class="btn-bezel" x="806" y="56" width="60" height="70" rx="3"/>
      <rect class="btn btn-face on" x="810" y="60" width="52" height="62"/>
      <path class="btn-edge" d="M810 122 L862 122 L862 60"/>
      <rect class="btn-inset" x="813" y="63" width="46" height="17" rx="1"/>
      <circle class="led on" id="led-preset-1" cx="836" cy="71" r="5"/>
      <rect class="btn-hit" x="806" y="56" width="60" height="70" role="button" aria-label="Select preset 1 (Tines)"/>
    </g>
    <g id="preset-2">
      <text class="lbl-sm lbl-num" x="920" y="30">2</text>
      <text class="lbl lbl-preset" x="920" y="48">REEDS</text>
      <rect class="btn-bezel" x="890" y="56" width="60" height="70" rx="3"/>
      <rect class="btn btn-face" x="894" y="60" width="52" height="62"/>
      <path class="btn-edge" d="M894 122 L946 122 L946 60"/>
      <rect class="btn-inset" x="897" y="63" width="46" height="17" rx="1"/>
      <circle class="led" id="led-preset-2" cx="920" cy="71" r="5"/>
      <rect class="btn-hit" x="890" y="56" width="60" height="70" role="button" aria-label="Select preset 2 (Reeds)"/>
    </g>
    <g id="preset-3">
      <text class="lbl-sm lbl-num" x="1004" y="30">3</text>
      <text class="lbl lbl-preset" x="1004" y="48">EGRAND</text>
      <rect class="btn-bezel" x="974" y="56" width="60" height="70" rx="3"/>
      <rect class="btn btn-face" x="978" y="60" width="52" height="62"/>
      <path class="btn-edge" d="M978 122 L1030 122 L1030 60"/>
      <rect class="btn-inset" x="981" y="63" width="46" height="17" rx="1"/>
      <circle class="led" id="led-preset-3" cx="1004" cy="71" r="5"/>
      <rect class="btn-hit" x="974" y="56" width="60" height="70" role="button" aria-label="Select preset 3 (EGrand)"/>
    </g>
    <g id="preset-4">
      <text class="lbl-sm lbl-num" x="1088" y="30">4</text>
      <text class="lbl lbl-preset" x="1088" y="48">CLAVI</text>
      <rect class="btn-bezel" x="1058" y="56" width="60" height="70" rx="3"/>
      <rect class="btn btn-face" x="1062" y="60" width="52" height="62"/>
      <path class="btn-edge" d="M1062 122 L1114 122 L1114 60"/>
      <rect class="btn-inset" x="1065" y="63" width="46" height="17" rx="1"/>
      <circle class="led" id="led-preset-4" cx="1088" cy="71" r="5"/>
      <rect class="btn-hit" x="1058" y="56" width="60" height="70" role="button" aria-label="Select preset 4 (Clavi)"/>
    </g>
    <g id="preset-5">
      <text class="lbl-sm lbl-num" x="1172" y="30">5</text>
      <text class="lbl lbl-preset" x="1172" y="48">DX EP</text>
      <rect class="btn-bezel" x="1142" y="56" width="60" height="70" rx="3"/>
      <rect class="btn btn-face" x="1146" y="60" width="52" height="62"/>
      <path class="btn-edge" d="M1146 122 L1198 122 L1198 60"/>
      <rect class="btn-inset" x="1149" y="63" width="46" height="17" rx="1"/>
      <circle class="led" id="led-preset-5" cx="1172" cy="71" r="5"/>
      <rect class="btn-hit" x="1142" y="56" width="60" height="70" role="button" aria-label="Select preset 5 (DX EP)"/>
    </g>
    <g id="preset-6">
      <text class="lbl-sm lbl-num" x="1256" y="30">6</text>
      <text class="lbl lbl-preset" x="1256" y="48">MKS EP</text>
      <rect class="btn-bezel" x="1226" y="56" width="60" height="70" rx="3"/>
      <rect class="btn btn-face" x="1230" y="60" width="52" height="62"/>
      <path class="btn-edge" d="M1230 122 L1282 122 L1282 60"/>
      <rect class="btn-inset" x="1233" y="63" width="46" height="17" rx="1"/>
      <circle class="led" id="led-preset-6" cx="1256" cy="71" r="5"/>
      <rect class="btn-hit" x="1226" y="56" width="60" height="70" role="button" aria-label="Select preset 6 (MKS EP)"/>
    </g>
    <g id="preset-7">
      <text class="lbl-sm lbl-num" x="1340" y="30">7</text>
      <text class="lbl lbl-preset" x="1340" y="48">VIBES</text>
      <rect class="btn-bezel" x="1310" y="56" width="60" height="70" rx="3"/>
      <rect class="btn btn-face" x="1314" y="60" width="52" height="62"/>
      <path class="btn-edge" d="M1314 122 L1366 122 L1366 60"/>
      <rect class="btn-inset" x="1317" y="63" width="46" height="17" rx="1"/>
      <circle class="led" id="led-preset-7" cx="1340" cy="71" r="5"/>
      <rect class="btn-hit" x="1310" y="56" width="60" height="70" role="button" aria-label="Select preset 7 (Vibes)"/>
    </g>
    <g id="preset-8">
      <text class="lbl-sm lbl-num" x="1424" y="30">8</text>
      <text class="lbl lbl-preset" x="1424" y="48">GRAND</text>
      <rect class="btn-bezel" x="1394" y="56" width="60" height="70" rx="3"/>
      <rect class="btn btn-face" x="1398" y="60" width="52" height="62"/>
      <path class="btn-edge" d="M1398 122 L1450 122 L1450 60"/>
      <rect class="btn-inset" x="1401" y="63" width="46" height="17" rx="1"/>
      <circle class="led" id="led-preset-8" cx="1424" cy="71" r="5"/>
      <rect class="btn-hit" x="1394" y="56" width="60" height="70" role="button" aria-label="Select preset 8 (Grand)"/>
    </g>
  </g>

  <g id="clavi-group">
    <rect class="btn" x="596" y="108" width="46" height="34"/>
    <text class="lbl-alt lbl-alt-lg" x="673" y="164">CLAVI TABS</text>
    <path id="clavi-group-line" class="clavi-line" d="M619 142 V158 Q619 161 622 161 H628 M718 161 H1272"/>
    <text class="lbl-alt" x="836" y="157">BRILLIANT</text>
    <text class="lbl-alt" x="920" y="157">TREBLE</text>
    <text class="lbl-alt" x="1004" y="157">MEDIUM</text>
    <text class="lbl-alt" x="1088" y="157">SOFT</text>
    <text class="lbl-alt" x="1172" y="157">C / D</text>
    <text class="lbl-alt" x="1256" y="157">A / B</text>
  </g>

  <line class="divider" x1="1486" y1="26" x2="1486" y2="184"/>

  <g id="sec-fx1">
    <rect x="1502" y="40" width="196" height="140" rx="6" fill="none" stroke="#46464a" stroke-width="1"/>
    <text class="lbl-sm" x="1536" y="62">SELECT</text>
    <rect class="btn" id="btn-fx1-select" x="1512" y="72" width="46" height="34"/>
    <circle class="led on" id="led-fx1-0" cx="1577" cy="72"  r="4.5"/>
    <text class="lbl-sm" x="1596" y="76" text-anchor="start">TREM</text>
    <circle class="led"    id="led-fx1-1" cx="1577" cy="94"  r="4.5"/>
    <text class="lbl-sm" x="1596" y="98" text-anchor="start">PAN</text>
    <circle class="led"    id="led-fx1-2" cx="1577" cy="116" r="4.5"/>
    <text class="lbl-sm" x="1596" y="120" text-anchor="start">A-WHA</text>
    <circle class="led"    id="led-fx1-3" cx="1577" cy="138" r="4.5"/>
    <text class="lbl-sm" x="1596" y="142" text-anchor="start">P-WHA</text>
    <text class="lbl-fx" x="1535" y="152">FX1</text>
    <g id="knob-fx1">
      <circle class="knob-face" cx="1664" cy="110" r="28"/>
      <circle class="knob-ring" cx="1664" cy="110" r="32"/>
      <line class="knob-ptr" x1="1664" y1="110" x2="1664" y2="87"/>
      <circle class="knob-hit" cx="1664" cy="110" r="35" fill="transparent" role="button" aria-label="Toggle FX1 section"/>
    </g>
    <text class="lbl-sm" x="1664" y="54">DEPTH</text>
    <text class="lbl-sm lbl-cyan" x="1664" y="68">RATE</text>
  </g>

  <g id="sec-amp">
    <text class="lbl" x="1758" y="34">AMP / DRIVE</text>
    <g id="knob-amp-drive">
      <circle class="knob-face" cx="1758" cy="110" r="28"/>
      <circle class="knob-ring" cx="1758" cy="110" r="35"/>
      <line class="knob-ptr" x1="1758" y1="110" x2="1758" y2="87"/>
      <circle class="knob-hit" cx="1758" cy="110" r="35" fill="transparent" role="button" aria-label="Toggle Amp Simulator section"/>
    </g>
  </g>

  <g id="sec-fx2">
    <rect x="1826" y="40" width="196" height="140" rx="6" fill="none" stroke="#46464a" stroke-width="1"/>
    <text class="lbl-sm" x="1860" y="62">SELECT</text>
    <rect class="btn" id="btn-fx2-select" x="1836" y="72" width="46" height="34"/>
    <circle class="led on" id="led-fx2-0" cx="1900" cy="72"  r="4.5"/>
    <text class="lbl-sm lbl-fxled" x="1918" y="76" text-anchor="start">CHORUS</text>
    <circle class="led"    id="led-fx2-1" cx="1900" cy="94"  r="4.5"/>
    <text class="lbl-sm lbl-fxled" x="1918" y="98" text-anchor="start">PHASER</text>
    <circle class="led"    id="led-fx2-2" cx="1900" cy="116" r="4.5"/>
    <text class="lbl-sm lbl-fxled" x="1918" y="120" text-anchor="start">FLANGER</text>
    <circle class="led"    id="led-fx2-3" cx="1900" cy="138" r="4.5"/>
    <text class="lbl-sm lbl-fxled" x="1918" y="142" text-anchor="start">DELAY</text>
    <text class="lbl-fx" x="1859" y="152">FX2</text>
    <g id="knob-fx2">
      <circle class="knob-face" cx="1988" cy="110" r="28"/>
      <circle class="knob-ring" cx="1988" cy="110" r="32"/>
      <line class="knob-ptr" x1="1988" y1="110" x2="1988" y2="87"/>
      <circle class="knob-hit" cx="1988" cy="110" r="35" fill="transparent" role="button" aria-label="Toggle FX2 section"/>
    </g>
    <text class="lbl-sm" x="1988" y="54">DEPTH</text>
    <text class="lbl-sm lbl-cyan" x="1988" y="68">RATE</text>
  </g>

  <g id="sec-pad">
    <text class="lbl lbl-red" x="2080" y="34">PAD LEVEL</text>
    <g id="knob-pad">
      <circle class="knob-face" cx="2080" cy="110" r="28"/>
      <circle class="knob-ring" cx="2080" cy="110" r="35"/>
      <line class="knob-ptr" x1="2080" y1="110" x2="2080" y2="87"/>
      <circle class="knob-hit" cx="2080" cy="110" r="35" fill="transparent" role="button" aria-label="Toggle Synth Pad section"/>
    </g>
    <circle class="led" id="led-pad-sw" cx="2080" cy="166" r="5"/>
    <text class="lbl-sm lbl-blue" x="2080" y="186">BLEND</text>
  </g>
</svg>
