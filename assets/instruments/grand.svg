<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <!-- Legs & Lyre -->
  <rect x="40" y="105" width="8" height="40" fill="var(--inst-chassis, #1e293b)" stroke="var(--inst-outline, #0f172a)" stroke-width="1" />
  <rect x="192" y="105" width="8" height="40" fill="var(--inst-chassis, #1e293b)" stroke="var(--inst-outline, #0f172a)" stroke-width="1" />
  <!-- Pedal Lyre -->
  <path d="M 112,105 L 112,138 L 128,138 L 128,105" fill="none" stroke="var(--inst-hardware, #a0a0a0)" stroke-width="2" />
  <!-- Open Lid Stick -->
  <line x1="80" y1="50" x2="135" y2="20" stroke="var(--inst-outline, #0f172a)" stroke-width="2" />
  <!-- Open Lid Silhouette -->
  <path d="M 30,52 L 170,12 Q 220,40 210,52 Z" fill="var(--inst-chassis, #1e293b)" stroke="var(--inst-outline, #0f172a)" stroke-width="1.5" />
  <!-- Rim / Body Curved Profile -->
  <path d="M 30,52 L 210,52 Q 220,80 180,95 L 30,95 Z" fill="var(--inst-chassis, #1e293b)" stroke="var(--inst-outline, #0f172a)" stroke-width="2" />
  <!-- Interior Harp Accent -->
  <path d="M 50,56 Q 160,56 170,80 L 50,80 Z" fill="var(--inst-chassis-accent, #cbd5e1)" stroke="var(--inst-outline, #0f172a)" stroke-width="1" />
  <!-- Front Keybed -->
  <rect x="30" y="90" width="150" height="15" fill="var(--inst-key-white, #ffffff)" stroke="var(--inst-outline, #0f172a)" stroke-width="1" />
  <!-- Black Keys -->
  <g fill="var(--inst-key-black, #0f172a)">
    <rect x="38" y="90" width="4" height="8" /><rect x="46" y="90" width="4" height="8" />
    <rect x="62" y="90" width="4" height="8" /><rect x="70" y="90" width="4" height="8" /><rect x="78" y="90" width="4" height="8" />
    <rect x="94" y="90" width="4" height="8" /><rect x="102" y="90" width="4" height="8" />
    <rect x="118" y="90" width="4" height="8" /><rect x="126" y="90" width="4" height="8" /><rect x="134" y="90" width="4" height="8" />
    <rect x="150" y="90" width="4" height="8" /><rect x="158" y="90" width="4" height="8" />
  </g>
</svg>
