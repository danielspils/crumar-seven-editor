<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <!-- Stand Legs -->
  <g stroke="var(--inst-hardware, #a0a0a0)" stroke-width="2">
    <line x1="32" y1="106" x2="20" y2="150" />
    <line x1="208" y1="106" x2="220" y2="150" />
  </g>
  <!-- Wood Side End Cheeks -->
  <rect x="20" y="60" width="14" height="46" rx="2" fill="var(--inst-wood, #8b4513)" stroke="var(--inst-outline, #0f172a)" stroke-width="1.5" />
  <rect x="206" y="60" width="14" height="46" rx="2" fill="var(--inst-wood, #8b4513)" stroke="var(--inst-outline, #0f172a)" stroke-width="1.5" />
  <!-- Main Rectangular Body -->
  <rect x="34" y="60" width="172" height="46" fill="var(--inst-chassis, #1e293b)" stroke="var(--inst-outline, #0f172a)" stroke-width="1.5" />
  <!-- Left Switch Panel Block -->
  <rect x="38" y="66" width="22" height="34" fill="var(--inst-chassis-accent, #334155)" stroke="var(--inst-outline, #0f172a)" stroke-width="1" />
  <!-- Rocker Switches -->
  <rect x="42" y="70" width="14" height="3" fill="var(--inst-wurlitzer-red, #d62828)" />
  <rect x="42" y="76" width="14" height="3" fill="var(--inst-dx7-turquoise, #00a896)" />
  <rect x="42" y="82" width="14" height="3" fill="var(--inst-wurlitzer-red, #d62828)" />
  <rect x="42" y="88" width="14" height="3" fill="var(--inst-dx7-turquoise, #00a896)" />
  <!-- Keybed -->
  <rect x="64" y="82" width="138" height="18" fill="var(--inst-key-white, #ffffff)" stroke="var(--inst-outline, #0f172a)" stroke-width="1" />
  <!-- Black Keys -->
  <g fill="var(--inst-key-black, #0f172a)">
    <rect x="70" y="82" width="4" height="10" /><rect x="78" y="82" width="4" height="10" />
    <rect x="94" y="82" width="4" height="10" /><rect x="102" y="82" width="4" height="10" /><rect x="110" y="82" width="4" height="10" />
    <rect x="126" y="82" width="4" height="10" /><rect x="134" y="82" width="4" height="10" />
    <rect x="150" y="82" width="4" height="10" /><rect x="158" y="82" width="4" height="10" /><rect x="166" y="82" width="4" height="10" />
    <rect x="182" y="82" width="4" height="10" />
  </g>
</svg>
