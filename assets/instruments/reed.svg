<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <!-- Angled Legs -->
  <g stroke="var(--inst-hardware, #a0a0a0)" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="102" x2="18" y2="150" />
    <line x1="200" y1="102" x2="222" y2="150" />
  </g>
  <!-- Rounded Molded Body -->
  <rect x="28" y="52" width="184" height="52" rx="10" fill="var(--inst-wurlitzer-red, #d62828)" stroke="var(--inst-outline, #0f172a)" stroke-width="2" />
  <!-- Oval Speaker Grilles -->
  <ellipse cx="48" cy="72" rx="10" ry="14" fill="var(--inst-chassis-accent, #f8fafc)" stroke="var(--inst-outline, #0f172a)" stroke-width="1.5" />
  <ellipse cx="192" cy="72" rx="10" ry="14" fill="var(--inst-chassis-accent, #f8fafc)" stroke="var(--inst-outline, #0f172a)" stroke-width="1.5" />
  <!-- Keybed Base -->
  <rect x="64" y="88" width="112" height="14" fill="var(--inst-key-white, #ffffff)" stroke="var(--inst-outline, #0f172a)" stroke-width="1" />
  <!-- Black Keys -->
  <g fill="var(--inst-key-black, #0f172a)">
    <rect x="70" y="88" width="3.5" height="8" /><rect x="77" y="88" width="3.5" height="8" />
    <rect x="91" y="88" width="3.5" height="8" /><rect x="98" y="88" width="3.5" height="8" /><rect x="105" y="88" width="3.5" height="8" />
    <rect x="119" y="88" width="3.5" height="8" /><rect x="126" y="88" width="3.5" height="8" />
    <rect x="140" y="88" width="3.5" height="8" /><rect x="147" y="88" width="3.5" height="8" /><rect x="154" y="88" width="3.5" height="8" />
    <rect x="168" y="88" width="3.5" height="8" />
  </g>
</svg>
