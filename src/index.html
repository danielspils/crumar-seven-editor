<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
  <title>Crumar Seven Editor</title>
  <style>
    /* Two themes, one variable set. Everything below the aluminium divider
       reads from these; the panel strip is artwork and stays as it is in
       both — the instrument should be the darkest thing on screen. */
    :root {
      --bg: #141416;
      --bg-raised: #1c1c1f;
      --bg-panel: #232326;
      --line: #2e2e33;
      --text: #e8e8ea;
      --select-chevron: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 9" width="14" height="9"><path d="M2 2 L7 7 L12 2" fill="none" stroke="%23e8e8ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      --text-muted: #8b8b93;
      --text-dim: #5e5e66;
      --accent: #ff3b30;      /* panel LED red */
      --amber: #ffb020;
      /* Action green: the panel's own DEPTH/RATE legend (#4fb96a in
         assets/seven-panel.svg). Filled buttons that DO something wear it. */
      --action: #4fb96a;
      --action-ink: #08150d;

      /* Instrument illustrations (assets/instruments/*.svg, inlined so these
         reach them — an SVG loaded through <img> is its own document and
         inherits nothing). Flat-design colours, tuned per theme: the drawings
         sit on the panel surface in dark mode and on the antiqued paper in
         light, and the same greys read differently against each. */
      --inst-chassis: #33333a;
      --inst-chassis-accent: #565663;
      --inst-outline: #0b0b0d;
      --inst-hardware: #9a9aa4;
      --inst-key-white: #efece4;
      --inst-key-black: #17171a;
      --inst-wood: #7a4a24;
      --inst-wurlitzer-red: #c0392b;
      --inst-dx7-turquoise: #29a396;
      --inst-lcd: #3fbf6a;
      --inst-grille: #9d968a;
      --inst-rail: #cfc9ba;
      --inst-stripe: #c0392b;
      --inst-knob: #d98324;
      --warn: #d9a13b;
      --sampled: #4caf6d;
      --modeled: #5b8fd9;
      --bar: #3a3a3f;
      --bar-fill: #8e8e96;
      --bar-fill-changed: #d9d9de;
      --ok: #3fb950;
      --shade: rgba(255, 255, 255, .05);   /* hover */
      --shade-hard: rgba(255, 255, 255, .08);
      --card-border: transparent;
      --d6-frame-bg: #101012;
      --d6-frame-border: #000;
    }
    /* Antiqued white: warm paper, not grey. Accents darken rather than
       change hue, so the two themes stay recognisably the same UI. */
    :root[data-theme="light"] {
      --bg: #f0ebe0;
      --bg-raised: #f8f5ed;
      --bg-panel: #e4ddcd;
      --line: #d2c9b6;
      --text: #26231f;
      --select-chevron: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 9" width="14" height="9"><path d="M2 2 L7 7 L12 2" fill="none" stroke="%2326231f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      --text-muted: #6a6355;
      --text-dim: #8a8375;
      --accent: #b8362b;
      --amber: #8a5d00;
      --action: #2c8b4f;
      --action-ink: #f4f7f5;

      --inst-chassis: #3f3f47;
      --inst-chassis-accent: #6b6b78;
      --inst-outline: #23232a;
      --inst-hardware: #8d8d97;
      --inst-key-white: #fbf8f1;
      --inst-key-black: #23232a;
      --inst-wood: #8b5424;
      --inst-wurlitzer-red: #b7382c;
      --inst-dx7-turquoise: #1f8d82;
      --inst-lcd: #35a85c;
      --inst-grille: #b3ab9b;
      --inst-rail: #ddd7c8;
      --inst-stripe: #b7382c;
      --inst-knob: #c9761f;
      --warn: #7d5a10;
      --sampled: #1c7a45;
      --modeled: #2a5fae;
      --bar: #d8d0be;
      --bar-fill: #6a6355;
      --bar-fill-changed: #26231f;
      --ok: #2c7139;
      --shade: rgba(0, 0, 0, .045);
      --shade-hard: rgba(0, 0, 0, .075);
      --card-border: #ddd5c4;
      --d6-frame-bg: transparent;
      --d6-frame-border: transparent;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* The window itself never scrolls: the panel strip is a fixed reference at
       the top, and only the two columns below scroll, independently. A root
       scrollbar could otherwise shift the whole UI when sections expand. */
    html, body { height: 100%; overflow: hidden; }
    /* Light and dark cross-fade rather than cut. The rule is scoped to a class
       that exists only for the ~1s of a switch (src/app.js), so no ordinary
       hover, drag or re-render pays for it — and the switch is the one moment
       where every surface in the window changes at once, which is exactly when
       a cut is most jarring. Only the properties that carry the palette. */
    html.theme-fading, html.theme-fading *, html.theme-fading *::before,
    html.theme-fading *::after {
      transition: background-color 1s ease, color 1s ease, border-color 1s ease,
                  fill 1s ease, stroke 1s ease, box-shadow 1s ease, opacity 1s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      html.theme-fading, html.theme-fading *, html.theme-fading *::before,
      html.theme-fading *::after { transition: none; }
    }
    body {
      background: var(--bg);
      color: var(--text);
      /* Inter is self-hosted (registered by app.js via data: URI); the panel
         strip alone uses Archivo inside the SVG. */
      font: 13px/1.45 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column;
      user-select: none;
    }

    /* 1. Panel strip */
    #panel-strip { background: #202022; border-bottom: 1px solid #2e2e33; }
    #panel-strip svg { display: block; width: 100%; height: auto; max-height: 150px; }
    /* The SVG's readonly class disables all controls; selectively re-enable the
       bank button and preset buttons — they drive the same state as the tabs. */
    /* Full-button hit targets: the transparent .btn-hit rect (drawn last,
       sized to the bezel) is the only element that takes clicks — the readonly
       rule keeps suppressing the faces beneath. Hover brightens the face via
       :has() since the overlay sits above it. */
    #panel-strip .btn-hit { pointer-events: auto; cursor: pointer; }
    /* Child combinators, both sides: `g:has(.btn-hit:hover)` alone matches
       every ANCESTOR group, so the shared `sec-presets` parent matched and
       hovering one preset lit all eight. The hovered hit rect must be a
       direct child, and only that group's own face/bezel respond. */
    #panel-strip .btn-face:not(.on):has(~ .btn-hit:hover) { fill: #2b2b2e; }
    #panel-strip .btn-bezel:has(~ .btn-hit:hover) { fill: #1e1e20; }
    /* Momentary press state — BANK only (presets have a persistent selected
       state instead). app.js drives .bank-pressed with a ~150ms minimum hold
       so a quick click still reads as intentional, then keeps it while held.
       Press-down is instant (transition: none while pressed); release settles
       via a 120ms fade. */
    #panel-strip g:has([data-hit="bank"]) #btn-bank,
    #panel-strip g:has([data-hit="bank"]) .btn-inset { transition: fill 120ms; }
    #panel-strip g.bank-pressed #btn-bank { fill: #141416; transition: none; }
    #panel-strip g.bank-pressed .btn-inset { fill: #232325; transition: none; }
    /* Mapped knobs are click targets for navigation only (strip stays readonly;
       knobs are clickable, never draggable). The transparent .knob-hit circle —
       drawn last, radius of the outer ring — is the ONLY element that takes
       pointer events, so the readonly rule keeps suppressing the face/pointer.
       Unmapped elements get no cursor or hover. app.js tags mapped knob groups
       with .nav-knob. */
    #panel-strip .knob-hit { pointer-events: none; }
    #panel-strip .nav-knob .knob-hit { pointer-events: auto; cursor: pointer; }
    #panel-strip .nav-knob .knob-ring { transition: stroke .3s; }
    #panel-strip .nav-knob .knob-glass { transition: filter .3s; }
    /* One treatment per annulus: the outer ring belongs to the FOCUSED knob
       only (its section expanded). At rest there is no ring at all; hover
       shows the same ring dimmed so clickability stays discoverable. The lit
       cue lives on the face (amber fill+outline) and never uses the annulus. */
    #panel-strip .nav-knob:not(.nav-ring):hover .knob-ring { stroke: rgba(255, 59, 48, .35); }
    /* Two distinct, stackable knob cues (docs/DESIGN.md):
       LIT (effect on, patch data)  = amber cap fill + amber outline + dark
                                      pointer. ID-prefixed so the SVG's own
                                      .knob-face rule can't override the fill.
       EXPANDED (view state)        = accent OUTER RING only — never the face,
                                      so it can't be mistaken for amber. */
    /* Lit = the LED under the clear plastic is on: the whole knob glows from
       the center out, brightest in the bore. The COLOR is the hardware's
       value-encoding (manual; confirmed live on Volume): green at low values
       sweeping to red at high. updateKnobLit() computes the hue and sets the
       material custom properties inline — they inherit through the use-element
       boundary, which class selectors cannot cross. */
    #panel-strip .knob-lit .knob-glass { filter: drop-shadow(0 0 6px var(--k-shadow, rgba(255, 157, 46, 0.45))); }
    #panel-strip .nav-ring .knob-ring { stroke: #ff3b30; stroke-width: 3; }

    /* 2. Connection row — styled after the hardware's brushed-aluminum
       divider strip, with the red-felt keybed line as its bottom edge. */
    #connection-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background:
        repeating-linear-gradient(90deg,
          rgba(255, 255, 255, 0.05) 0 1px, rgba(0, 0, 0, 0.035) 1px 3px),
        linear-gradient(180deg,
          #c9c9ce 0%, #ababb1 42%, #bcbcc2 55%, #8b8b92 100%);
      border-bottom: 4px solid #8f2420; /* the felt */
      color: #26262a; font-size: 12px;
    }
    #connection-row #connection-text { text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35); }
    #connection-row .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #66666d;
    }
    #connection-row.connected .conn-dot { background: #2e7d43; }
    .conn-name { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
    .conn-fw { color: var(--text-dim); margin-left: 8px; }
    #connection-row.connecting .conn-dot { background: var(--accent); }
    #connection-row.failed .conn-dot { background: #a8221c; }
    #conn-button {
      margin-left: auto;
      background: none; border: 1px solid rgba(0, 0, 0, 0.35); border-radius: 5px;
      color: #26262a; font: inherit; font-size: 12px;
      padding: 2px 10px; cursor: pointer;
    }
    #conn-button:hover { color: #000; border-color: rgba(0, 0, 0, 0.6); }
    #conn-button:disabled { opacity: 0.5; cursor: default; }
    /* Backup: the row's one call to action wears the felt red. */
    #backup-button {
      margin-left: auto;
      background: none; border: 1px solid #8f2420; border-radius: 4px;
      color: #8f2420; font: inherit; font-size: 12px; font-weight: 600;
      padding: 2px 10px; cursor: pointer;
    }
    #backup-button:hover { color: #6e1a17; border-color: #6e1a17; }
    #backup-button + #conn-button { margin-left: 0; }
    #sounds-button {
      margin-left: auto;
      background: none; border: 1px solid rgba(0, 0, 0, 0.35); border-radius: 10px;
      color: #26262a; font: inherit; font-size: 12px;
      padding: 1px 9px; cursor: pointer;
    }
    #sounds-button:hover, #sounds-button.open { color: #000; border-color: rgba(0, 0, 0, 0.6); }
    #sounds-button + #backup-button, #sounds-button + #conn-button { margin-left: 0; }
    #connection-row { position: relative; }
    /* Three columns, not two things and a floating third. The toggle used to be
       absolutely centred, which put it out of flow — so a long status line ran
       underneath it and the buttons collided with it on a narrow window. Equal
       flex on the two side groups centres it exactly, and now everything in the
       row can see everything else. */
    .conn-status, .conn-actions { display: flex; align-items: center; flex: 1 1 0; min-width: 0; }
    .conn-status { gap: 8px; }
    .conn-actions { gap: 8px; justify-content: flex-end; }
    /* The failure messages are sentences, and a sentence must not push the
       controls off the strip. It gets the room it has and says the rest in its
       tooltip. */
    #connection-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #theme-toggle {
      flex: none;
      display: flex; border: 1px solid rgba(0, 0, 0, .3); border-radius: 5px;
      overflow: hidden; background: rgba(0, 0, 0, .06);
    }
    #theme-toggle button {
      font: inherit; font-size: 12px; padding: 2px 14px;
      background: none; border: none; color: #4a4a50; cursor: pointer;
    }
    #theme-toggle button + button { border-left: 1px solid rgba(0, 0, 0, .22); }
    #theme-toggle button:hover { color: #000; }
    /* Selected reads as the raised half of a two-way switch. */
    #theme-toggle button[aria-pressed="true"] {
      background: linear-gradient(180deg, #fbfaf7, #e4e2dd);
      color: #16161a; font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9);
    }
    /* [hidden] is a UA rule (display:none) and ANY author display wins over
       it — so a bare `display: inline-flex` here made the gear render while
       hidden, which is how it turned up in the connection row with no
       instrument attached. Scope the display to the not-hidden case. */
    #settings-button {
      font: inherit; font-size: 12px; padding: 2px 10px;
      color: #26262a; background: none;
      border: 1px solid rgba(0, 0, 0, 0.35); border-radius: 4px; cursor: pointer;
    }
    #settings-button:hover, #settings-button.open { color: #000; border-color: rgba(0, 0, 0, 0.6); }
    #settings-panel {
      position: absolute; top: 100%; right: 12px; z-index: 30;
      /* Nine short rows of label + dropdown. It was sized like the sounds
         table beside it, which is a 24-row grid and needs the room; this is a
         list of switches and was mostly air (Daniel, 2026-08-12). */
      min-width: 280px; max-width: 320px; max-height: 70vh; overflow-y: auto;
      background: var(--bg-raised); border: 1px solid var(--line);
      border-top: none; border-radius: 0 0 6px 6px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
      padding: 10px 12px 8px;
      /* The tray hangs inside #connection-row, which hard-codes near-black text
         for the brushed-metal strip — the metal is the same in both themes, so
         its ink cannot follow one. A panel is not the metal, and inheriting
         that ink painted the labels near-black on the dark panel
         (Daniel, 2026-08-12). */
      color: var(--text);
    }
    .settings-head {
      font-size: 11px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
    }
    .set-row {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; border-top: 1px solid var(--line);
    }
    .set-row:first-child { border-top: none; }
    .set-name { flex: 1 1 auto; min-width: 0; font-size: 12px; }
    /* A name we have not pinned against the device is shown, because the raw
       value is still worth seeing — but it is marked, and it cannot be
       written. */
    .set-row.is-unverified .set-name { color: var(--text-muted); }
    .set-guess {
      margin-left: 6px; font-size: 10px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-dim);
    }
    .set-value { flex: none; font-size: 12px; color: var(--text-dim); min-width: 26px; text-align: right; }
    .set-toggle {
      flex: none; font: inherit; font-size: 11px; font-weight: 700;
      letter-spacing: .05em; text-transform: uppercase;
      min-width: 52px; text-align: center;
      padding: 2px 10px; border-radius: 10px; cursor: pointer;
      color: var(--text-muted); background: none; border: 1px solid var(--line);
    }
    .set-toggle[aria-pressed="true"] {
      color: var(--action-ink); background: var(--action); border-color: var(--action);
    }
    .set-toggle:disabled { opacity: .5; cursor: default; }
    /* Every global is a named list on the instrument, so it is a named list
       here. A switch reading On/Off would have been our word for it; these are
       the device's own — "N.O.", "From Preset", "TX OFF". */
    /* The app's dropdown (src/picker.js). A native select can be styled shut
       and not styled open — the list belongs to the OS — so a tray in the
       app's colours dropped a grey macOS menu out of itself. */
    .picker {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      font: inherit; font-size: 11px; line-height: 1.6;
      padding: 1px 6px; border-radius: 5px; cursor: pointer;
      color: var(--text); background: var(--bg); border: 1px solid var(--line);
    }
    .picker:hover:not(:disabled) { border-color: var(--text-dim); }
    .picker:focus-visible { outline: 2px solid var(--action); outline-offset: 1px; }
    .picker:disabled { opacity: .5; cursor: default; }
    .picker-text { white-space: nowrap; }
    .picker-caret { color: var(--text-dim); font-size: 13px; line-height: 0; }
    /* Fixed, not absolute: the trays this opens in scroll and clip, and a
       dropdown's whole job is to leave its container. */
    .picker-list {
      position: fixed; z-index: 100; overflow-y: auto;
      padding: 4px; border-radius: 6px;
      background: var(--bg-raised); border: 1px solid var(--line);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .5);
    }
    .picker-option {
      padding: 3px 8px; border-radius: 4px; cursor: pointer;
      font-size: 11px; color: var(--text); white-space: nowrap;
    }
    .picker-option.is-active { background: var(--action); color: var(--action-ink); }
    /* The current value stays marked even while the pointer is elsewhere in
       the list — otherwise moving the mouse loses your place. */
    .picker-option[aria-selected="true"] { font-weight: 700; }
    .picker-option[aria-selected="true"]::after {
      content: ' ✓'; color: var(--text-dim);
    }
    .picker-option.is-active[aria-selected="true"]::after { color: var(--action-ink); }
    /* Which keys a sound answers to. Drawn only where a limit has been HEARD
       on the instrument — see schema/key-ranges-1.37.json. */
    /* A parameter row in everything but kind: same grid, same label column, so
       it lines up with the controls above it instead of floating under them. */
    /* Its own copy of the parameter grid. The row is a SIBLING of .params,
       not a child, so it never inherited those columns and the keyboard sat
       ~40px right of the bars (Daniel, 2026-08-13). Same 116px label column,
       so it lines up with every slider above it. */
    .engine-keyrange {
      display: grid; grid-template-columns: 116px 1fr minmax(40px, max-content);
      gap: 10px; align-items: center; margin-top: 10px;
    }
    .keyrange-label { color: var(--text-muted); }
    .keyrange-keys { grid-column: 2; display: block; min-width: 0; }
    /* Sized by HEIGHT, letting the viewBox set the width — 61 keys at their
       drawn size ran past the panel and over the section list beside it. Its
       own width/height attributes are a starting size, not a claim on the
       layout. */
    .key-range {
      display: block; height: 22px; width: auto; max-width: 100%;
      border: 1px solid var(--line); border-radius: 2px;
    }
    .kr-white { fill: var(--bg-raised); stroke: var(--line); stroke-width: .4; }
    .kr-black { fill: var(--text); }
    /* Outside the range the keyboard INVERTS: white keys go dark, black keys
       go light. The keys stay drawn — the point is WHICH part of the board is
       dead, which you cannot see if the dead part is missing — but a fade left
       the two halves too close to tell apart at 22px tall. A negative reads at
       a glance (Daniel, 2026-08-12). */
    .kr-white.is-mute { fill: var(--text); stroke: var(--text); }
    .kr-black.is-mute { fill: var(--bg-raised); stroke: var(--text); stroke-width: .4; }
    .keyrange-note {
      font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums;
    }
    /* The dressed select stays in the DOM — hidden, not removed — because
       every listener and every UI scenario still talks to it. */
    .select-wrap.is-dressed { display: none; }
    .picker-param { font-size: 12px; padding: 2px 8px; }
    .param.is-inert .picker-param { opacity: .55; }
    .settings-foot {
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
      font-size: 12px; color: var(--text-dim); line-height: 1.5;
    }
    #sounds-panel {
      position: absolute; top: 100%; right: 12px; z-index: 30;
      min-width: 460px; max-height: 60vh; overflow-y: auto;
      background: var(--bg-raised); border: 1px solid var(--line);
      border-top: none; border-radius: 0 0 6px 6px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
      padding: 12px 16px 10px;
      color: var(--text); /* same inherited-metal-ink trap as #settings-panel */
    }
    #sounds-panel .sounds-cols { display: flex; gap: 28px; }
    #sounds-panel .sounds-group { flex: 1; min-width: 0; }
    #sounds-panel h4 {
      margin: 0 0 6px; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim); font-weight: 600;
    }
    #sounds-panel .sound-row {
      display: flex; gap: 10px; padding: 2px 0; font-size: 12px;
      color: var(--text); white-space: nowrap;
    }
    #sounds-panel .sound-id {
      width: 20px; text-align: right; color: var(--text-dim);
      font-variant-numeric: tabular-nums; flex: none;
    }
    #sounds-panel .sounds-foot {
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
      font-size: 12px; color: var(--text-dim);
    }

    /* Main area: library left, detail right */
    #main { flex: 1; display: flex; min-height: 0; }

    /* 3. Library */
    #library {
      width: 480px; min-width: 400px;
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0;
    }
    #bank-tabs { display: flex; border-bottom: 1px solid var(--line); }
    /* Subtle tabs: selection is carried by the same raised background as a
       selected patch row — no tab outline, no radius. The amber underline is
       text-width (on the label span), so it doesn't stack with the patch row's
       full-width red edge marker. All four tabs are identical when unselected. */
    .bank-tab {
      flex: 1; padding: 9px 0 7px; text-align: center;
      background: transparent; border: none;
      color: var(--text-muted); font: inherit; font-weight: 600; letter-spacing: .08em;
      cursor: pointer;
    }
    .bank-tab:hover { color: var(--text); }
    .bank-tab-label { display: inline-block; padding-bottom: 3px; border-bottom: 2px solid transparent; }
    .bank-tab.active { background: var(--bg-panel); color: var(--amber); }
    .bank-tab.active .bank-tab-label { border-bottom-color: var(--amber); }
    /* The eight bank rows are always fully visible — they never scroll out of
       view when the Library opens; the Library body scrolls internally. */
    #patch-list { flex: none; }
    /* One line: number, name, then the sound and its badge together on the
       right — the same right-hand pairing the library rows use. */
    .patch-row {
      display: grid; grid-template-columns: 28px 1fr auto auto auto;
      gap: 10px; align-items: center;
      width: 100%; padding: 9px 14px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    /* --shade-hard, not --bg-raised: a translucent overlay lifts a row on
       WHATEVER it sits on. The library's rows are already the raised colour,
       so hovering them to that same colour did nothing at all, and the two
       lists answered a pointer differently (Daniel, 2026-08-13). */
    .patch-row:hover { background: var(--shade-hard); }
    .patch-row.selected { background: var(--bg-panel); box-shadow: inset 3px 0 0 var(--accent); }
    .patch-num { color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .patch-row .patch-sound { text-align: right; }
    .patch-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .patch-sound { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge {
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      padding: 1px 6px; border-radius: 7px; white-space: nowrap;
    }
    /* One pill, two labels: the kind at rest, the instrument on hover. */
    .lib-row-wrap { position: relative; display: block; }
    .patch-delete {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0; cursor: pointer;
      color: var(--text-dim); background: none; border: none; border-radius: 4px;
      opacity: 0; transition: opacity .12s;
    }
    .lib-row-wrap:hover .patch-delete, .patch-delete:focus-visible { opacity: 1; }
    .patch-delete:hover { color: var(--warn-text, #c0392b); background: var(--shade-hard); }
    /* The swap happens on the PILL itself, not on the row. Row-wide hover
       flipped every badge you passed over on the way somewhere else, which
       made the list twitch (Daniel, 2026-08-13). */
    .badge-sound { display: none; white-space: nowrap; }
    .badge:hover .badge-kind { display: none; }
    .badge:hover .badge-sound { display: inline; }
    .badge-modeled { color: var(--modeled); border: 1px solid var(--modeled); }
    .badge-sampled { color: var(--sampled); border: 1px solid var(--sampled); }
    .badge-warn { color: #16130b; background: var(--warn); }
    .badge-gap { width: 0; }

    /* TYPE SCALE below the panel — four tiers, nothing else:
         hero      17px/700  --text          detail sound name
         primary   13px/600  --text          item names, param rows
         metadata  12px/400  --text-muted    origin, sound, position, counts,
                                             summaries — every secondary fact
         header    12px/700  .12em caps      region/section/FX titles
         pill      10px/700                  badges and state chips
       Add a role to a tier rather than inventing a new size. */

    /* 3a. Two-region model: "On the Seven" (banks) above, "On this computer"
       (Library) below. The regions expand mutually exclusively — app.js
       toggles .lib-open on #library — but the bank region is NEVER fully
       hidden: it collapses to a one-line summary strip (current bank +
       selected preset) so the instrument↔computer relationship stays on
       screen, and transfer always has a visible target. */
    .region-head {
      font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-muted); padding: 8px 14px 4px;
    }
    .region-head .asof {
      font-weight: 400; letter-spacing: normal; text-transform: none;
      color: var(--text-dim); margin-left: 6px;
    }
    .patch-row.empty-slot .patch-name { color: var(--text-dim); font-style: italic; font-weight: 400; }
    #bank-strip {
      display: none; /* visible only while the Library is expanded */
      width: 100%; align-items: center; gap: 8px;
      padding: 8px 14px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    #bank-strip:hover { background: var(--bg-raised); }
    #bank-strip .strip-chevron { transform: rotate(-90deg); }
    #bank-strip .fx-title { flex: none; }
    #bank-strip-label { flex: 1; }
    .strip-asof { font-size: 12px; color: var(--text-dim); flex: none; }
    /* One title line only: while the strip is showing, it IS the header. */
    #library.lib-open #seven-head { display: none; }
    #library.lib-open #bank-tabs, #library.lib-open #patch-list { display: none; }
    #library.lib-open #bank-strip { display: flex; }
    /* Drag handle between the regions. Only meaningful while the Library is
       open; the chosen split persists across launches (app.js). */
    #split-divider { display: none; height: 5px; cursor: row-resize; flex: none; position: relative; }
    #split-divider::after {
      content: ''; position: absolute; left: 50%; top: 2px; width: 44px; height: 3px;
      transform: translateX(-50%); border-radius: 2px; background: var(--line);
    }
    #split-divider:hover::after { background: var(--text-muted); }
    #library.lib-open #split-divider { display: block; }

    /* 3b. Library section — reuses the fx-section disclosure (chevron,
       header hover, grid-rows collapse animation) but sits full-width in the
       library column: no side borders, no radius, visually distinct from the
       indented bank rows above. The dimming rule is NOT reused. */
    #library-section {
      margin: 0; border-left: none; border-right: none; border-radius: 0;
      border-top: 1px solid var(--line);
      padding: 8px 10px;
      min-height: 0; overflow: hidden;
    }
    /* Expanded, the section flexes into the REMAINING column space and the
       list scrolls inside whatever fits — the section must never run past
       the window edge (that clipped the slot view to two visible rows).
       Scoped to expanded so a collapsed section still shrinks to its header.
       Tradeoff: the height half of the open animation is skipped for this
       section (the body snaps to the flexed size; the opacity fade
       remains). */
    #library-section:not(.collapsed) { display: flex; flex-direction: column; flex: 0 1 auto; }
    #library-section:not(.collapsed) .fx-head { flex: none; }
    #library-section:not(.collapsed) .fx-body { flex: 0 1 auto; min-height: 0; }
    /* The list scrolls inside a fixed height, so a cut-off row can look like
       the end of the list. A fade over the bottom edge says otherwise; the
       .at-end class removes it once there is nothing left to scroll to. */
    #library-body { display: flex; flex-direction: column; min-height: 0; height: 100%; position: relative; }
    #library-body::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 28px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none; opacity: 1; transition: opacity .15s ease;
    }
    #library-body.at-end::after { opacity: 0; }
    /* Every other long scroller fades its own bottom edge with a mask — no
       wrapper needed, and it blends to whatever is behind it. The library list
       can't use this: a masked element becomes the containing block for its
       position:fixed children, which would trap the patch picker inside the
       list (src/scroll-fade.js). */
    #detail, .pick-body, #sounds-panel {
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
    }
    #detail.at-end, .pick-body.at-end, #sounds-panel.at-end {
      -webkit-mask-image: none; mask-image: none;
    }
    #library-body .lib-bar { flex: none; }
    #library-body .lib-list { flex: 0 1 auto; min-height: 0; }
    .lib-count { flex: 1; color: var(--text-muted); font-size: 12px; }
    .lib-reveal {
      font: inherit; font-size: 12px; color: var(--text-muted);
      background: transparent; border: 1px solid var(--line); border-radius: 4px;
      padding: 2px 8px; cursor: pointer; flex: none;
    }
    .lib-reveal:hover { color: var(--text); border-color: var(--text-muted); }
    .lib-bar {
      display: flex; gap: 8px; align-items: center; padding: 8px 2px 8px;
      border-bottom: 1px solid var(--line);
    }
    /* TABS, like the bank tabs above — one navigation metaphor in the app
       rather than tabs in one region and a segmented button in the other
       (Daniel, 2026-08-13). Same amber underline, same active panel colour. */
    /* The SAME tabs as #bank-tabs: same padding, same weight and tracking,
       same underline, and the row carries the same bottom rule. The library's
       were smaller and tighter, which read as a different control doing the
       same job (Daniel, 2026-08-13). They share the row with the search, so
       they size to their labels rather than splitting the width. */
    .lib-seg { display: inline-flex; flex: none; gap: 0; }
    .seg-btn {
      background: transparent; border: none; padding: 9px 16px 7px;
      color: var(--text-muted); font: inherit; font-weight: 600; letter-spacing: .08em;
      cursor: pointer;
    }
    .seg-btn.active { background: var(--bg-panel); color: var(--amber); }
    .seg-btn.active .seg-label { border-bottom-color: var(--amber); }
    .seg-label { display: inline-block; padding-bottom: 3px; border-bottom: 2px solid transparent; }
    .seg-btn:hover:not(.active) { color: var(--text); }
    /* Search is a magnifier until it is wanted. */
    /* Right-hand end of the bar, away from the tabs it is not part of. */
    .lib-search-open { margin-left: auto; }
    .lib-bar > .lib-search { margin-left: auto; }
    .lib-search-open {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 24px; padding: 0; cursor: pointer;
      color: var(--text-muted); background: none;
      border: 1px solid transparent; border-radius: 5px;
    }
    .lib-search-open:hover { color: var(--text); border-color: var(--line); }
    .lib-search {
      flex: 1; min-width: 0; font: inherit; font-size: 12px;
      background: var(--bg-panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px;
    }
    .lib-search:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
    /* The list is the internal scroller — fixed max height so the bank rows
       above never leave the viewport. The scrollbar is ALWAYS visible
       (custom-drawn, so macOS overlay hiding doesn't apply): without it, a
       320px viewport over 32 rows silently reads as "11 patches, the end". */
    .lib-list { max-height: 320px; overflow-y: auto; scrollbar-gutter: stable; }
    .lib-list::-webkit-scrollbar { width: 10px; }
    .lib-list::-webkit-scrollbar-track { background: transparent; }
    .lib-list::-webkit-scrollbar-thumb {
      background: var(--bar); border-radius: 5px;
      border: 2px solid var(--bg); background-clip: padding-box;
    }
    .lib-list::-webkit-scrollbar-thumb:hover { background: var(--bar-fill); }
    .lib-row {
      display: grid; grid-template-columns: 1fr 1fr auto auto;
      gap: 10px; align-items: center;
      width: 100%; padding: 7px 6px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    /* The same hover the BANK rows use — a lit row under the pointer, in the
       raised panel colour, so every list in the app answers a hover the same
       way (Daniel, 2026-08-13). The library's rows are buttons and wrappers
       both, so the setlist and backup rows need it named explicitly: their
       clickable part is a child, and hovering the row never reached it. */
    .lib-row:hover,
    .lib-setlist-row:hover,
    .lib-setlist-row:hover .lib-setlist { background: var(--shade-hard); }
    .lib-setlist-row { cursor: pointer; }
    /* Selected library patch wears the same red edge marker as a selected
       bank row — one vocabulary for "selected patch" (docs/DESIGN.md). */
    .lib-row.selected, .lib-slot-patch.selected { background: var(--bg-panel); box-shadow: inset 3px 0 0 var(--accent); }
    .lib-row-invalid { opacity: .55; cursor: default; }
    .lib-rename-input {
      font: inherit; font-weight: 600; color: var(--text);
      background: var(--bg); border: 1px solid var(--amber); border-radius: 3px;
      padding: 1px 5px; min-width: 0;
    }
    .lib-empty { color: var(--text-dim); padding: 18px 8px; text-align: center; }
    /* Stacked name + origin line in library rows. */
    /* Patch rows read as two lines: the name and its badge on top, then the
       provenance and the sound it uses beneath — related facts paired, and
       the name free to run the width of the row (sound names reach 22 chars,
       e.g. "Venice Upright U1 Felt", which crowded a side-by-side layout). */
    /* One line per patch, grouped by bank: slot number, name, then the sound
       and its badge on the right — the same right-hand pairing the bank rows
       use. Bank and capture date sit in the group header, not on every row. */
    .lib-row.lib-patch {
      grid-template-columns: 22px 1fr auto auto auto;
      row-gap: 0; align-items: center;
    }
    .lib-row.lib-patch .patch-num {
      color: var(--text-dim); font-size: 12px; font-variant-numeric: tabular-nums;
    }
    .lib-group + .lib-group { margin-top: 4px; }
    /* A group heading that carries an action sits on one line with it. */
    .lib-group-title-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .lib-group-title {
      position: sticky; top: 0; z-index: 1;
      background: var(--bg); padding: 7px 6px 5px;
      font-size: 12px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text-muted);
      border-bottom: 1px solid var(--line);
    }
    /* Slot rows stack name over provenance in one cell (they keep the
       single-line grid the slot controls need). */
    .name-cell { display: flex; flex-direction: column; min-width: 0; }
    .name-cell .patch-name { min-width: 0; }
    .lib-row.lib-patch .patch-sound,
    .lib-row.lib-patch .lib-origin,
    .lib-row.lib-patch .lib-badges { text-align: right; }
    .lib-origin {
      font-size: 12px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* By DEFAULT the list fills whatever height the window leaves — a fixed
       320px left dead space below it on a tall screen and clipped it on a
       short one. Once the user drags the divider, app.js sets --lib-split (px)
       on #library and that becomes a cap; the list is still free to be
       shorter when the window is. */
    #library.lib-open .lib-list { flex: 1 1 auto; max-height: var(--lib-split, none); }
    /* A setlist row is a button plus its own delete control, so the row is a
       container rather than one button. */
    .lib-setlist-row { display: flex; align-items: center; gap: 6px; padding: 0; }
    /* Three columns where a row is numbered — the number, the name, the
       count. Two columns wrapped the count onto its own line as soon as the
       number arrived (Daniel, 2026-08-13). */
    .lib-setlist-row .lib-setlist {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
      flex: 1; min-width: 0; padding: 7px 6px;
      background: none; border: none; color: var(--text); font: inherit;
      text-align: left; cursor: pointer;
    }
    .lib-setlist-row .lib-setlist:has(.patch-num) {
      grid-template-columns: 1.9rem 1fr auto;
    }
    .setlist-send {
      font: inherit; font-size: 12px; font-weight: 600; color: var(--text-muted);
      background: none; border: 1px solid var(--line); border-radius: 4px;
      padding: 3px 9px; cursor: pointer; flex: none;
      opacity: 0; transition: opacity .12s;
    }
    .lib-setlist-row:hover .setlist-send { opacity: 1; }
    .setlist-send:hover { color: var(--action); border-color: var(--action); }
    .setlist-send:focus-visible { opacity: 1; }
    .setlist-delete {
      display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; flex: none;
      background: none; border: none; border-radius: 4px;
      color: var(--text-dim); cursor: pointer; opacity: 0; transition: opacity .12s;
    }
    .lib-setlist-row:hover .setlist-delete { opacity: 1; }
    .setlist-delete:hover { color: var(--warn-text, #c0392b); background: var(--shade-hard); }
    .setlist-delete:focus-visible { opacity: 1; }
    .lib-setlist-chev { color: var(--text-dim); font-size: 15px; padding-right: 6px; }
    .lib-setlist-head {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 2px 8px; color: var(--text-muted);
    }
    /* In the header it is a permanent control, not a hover affordance: the
       rule above hides .setlist-send until its ROW is hovered, and there is no
       row here to hover — so it was present and invisible. */
    .lib-setlist-head .setlist-send { margin-left: auto; opacity: 1; }
    /* Same reason inside a backup: a bank heading is not a hoverable row, so
       its Send would have stayed invisible (Daniel, 2026-08-13). */
    .lib-group-title-row .setlist-send { opacity: 1; }
    .lib-back {
      font: inherit; font-size: 12px; color: var(--text-muted);
      background: transparent; border: 1px solid var(--line); border-radius: 4px;
      padding: 2px 8px; cursor: pointer;
    }
    .lib-back:hover { color: var(--text); border-color: var(--text-muted); }
    .lib-setlist-name { font-weight: 600; color: var(--text); }
    /* Same hierarchy as a library row — name + badge, then provenance +
       sound — with the slot controls in their own column so both text rows
       stop short of the ✕. */
    /* Feedback, centred in the window rather than parked at the bottom edge.
       Down there it was missed: the eye is on the library or the panel, and a
       message that appears outside where you are looking may as well not have
       appeared (Daniel, 2026-08-12 — "I'm still seeing a modal in the lower
       portion flash by"). Everything the app says now arrives in the same
       place the modals do. */
    #undo-toast {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, calc(-50% + 8px));
      z-index: 80; pointer-events: none;
      background: var(--bg-panel); color: var(--text);
      border: 1px solid var(--line); border-left: 3px solid var(--action);
      border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600;
      box-shadow: 0 10px 26px rgba(0, 0, 0, .4);
      opacity: 0; transition: opacity .15s ease, transform .15s ease;
    }
    #undo-toast.shown { opacity: 1; transform: translate(-50%, -50%); }
    /* Work in progress rather than a result: the action colour on both edges
       and a quiet pulse, so it reads as "hold on" instead of "done". Same
       position as any other message — only the treatment differs. */
    #undo-toast.is-busy {
      padding: 14px 24px; font-size: 13px;
      border-left-color: var(--action); border-right: 3px solid var(--action);
    }
    #undo-toast.is-busy.shown { transform: translate(-50%, -50%); }
    #undo-toast.is-busy::after {
      content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 8px;
      border-radius: 50%; background: var(--action); vertical-align: middle;
      animation: toast-pulse 1s ease-in-out infinite;
    }
    @keyframes toast-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

    /* In-app modal (src/modal.js): the app's own voice for moments that are
       about how the instrument behaves, rather than the OS asking a question. */
    .seven-modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(0, 0, 0, .5);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .seven-modal {
      position: relative;
      width: min(440px, 92vw);
      background: var(--bg-panel); color: var(--text);
      border: 1px solid var(--line); border-top: 4px solid var(--action);
      border-radius: 8px; padding: 20px 22px 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
    }
    .seven-modal.is-warning { border-top-color: var(--accent); }
    .seven-modal-title { font-size: 15px; font-weight: 700; line-height: 1.35; }
    .seven-modal-body { margin-top: 10px; color: var(--text-muted); font-size: 13px; line-height: 1.5; }
    .seven-modal-body p { margin: 0 0 9px; }
    .seven-modal-body p:last-child { margin-bottom: 0; }
    .seven-modal-actions { display: flex; justify-content: center; margin-top: 18px; }
    .seven-modal-ok {
      font: inherit; font-size: 12px; font-weight: 600;
      border-radius: 5px; padding: 6px 14px; cursor: pointer;
    }
    /* Dismiss lives in the corner so the action below stands alone. */
    .seven-modal-cancel {
      position: absolute; top: 10px; right: 10px;
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0;
      color: var(--text-dim); background: none; border: none; border-radius: 4px;
    }
    .seven-modal-cancel:hover { color: var(--text); background: var(--shade-hard); }
    .seven-modal-title { padding-right: 28px; }
    .seven-modal-ok {
      color: var(--action-ink); background: var(--action); border: 1px solid var(--action);
    }
    .seven-modal-second {
      font: inherit; font-size: 12px; font-weight: 600;
      color: var(--text-muted); background: none;
      border: 1px solid var(--line); border-radius: 5px;
      padding: 7px 14px; cursor: pointer;
    }
    .seven-modal-second:hover { color: var(--text); border-color: var(--text-muted); }
    /* Declining, when it deserves a button rather than the corner X. Same
       outlined weight as the secondary — the filled one is the action. */
    .seven-modal-deny {
      font: inherit; font-size: 12px; font-weight: 600;
      color: var(--text-muted); background: none;
      border: 1px solid var(--line); border-radius: 5px;
      padding: 7px 14px; cursor: pointer;
    }
    .seven-modal-deny:hover { color: var(--text); border-color: var(--text-muted); }
    .seven-modal-deny:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .seven-modal-actions { gap: 8px; }

    /* The transfer confirm reads as a movement — this, into that — so it is
       centred and stacked rather than set as prose. TRANSFER is a region
       header in the app's own vocabulary (uppercase, letterspaced, dim), not a
       heading competing with the two names it introduces: what is moving and
       where it lands are the largest things here, at the same size the engine
       gives a sound's name. */
    .seven-modal.is-transfer .seven-modal-title {
      text-align: center; padding: 0 28px;
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-dim);
    }
    .seven-modal.is-transfer .seven-modal-body { text-align: center; margin-top: 18px; }
    /* The same treatment for an announcement — the backup asking, and the
       backup reporting. DESIGN.md: a header never competes with what it
       introduces. Left at 15/700 over a centred body, the title WAS the focal
       point and the copy underneath had nothing to anchor it
       (Daniel, 2026-08-13). */
    .seven-modal.is-announce .seven-modal-title {
      text-align: center; padding: 0 28px;
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-dim);
    }
    .seven-modal.is-announce .seven-modal-body { text-align: center; margin-top: 18px; }
    .seven-modal-body .tx-from, .seven-modal-body .tx-to {
      margin: 0; font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.3;
    }
    .seven-modal-body .tx-from { font-style: italic; }
    .seven-modal-body .tx-count {
      margin: 4px 0 0; font-size: 10px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim);
    }
    .seven-modal-body .tx-arrow { margin: 8px 0; font-size: 17px; line-height: 1; color: var(--text-dim); }
    /* One sentence per paragraph: a forced break inside centred prose lands
       wherever the modal happens to be wide, which reads as ragged. `balance`
       does the rest — centred text with an orphan on the last line is the
       whole reason this block looked untidy.

       Every rule here is scoped under .seven-modal-body on purpose: the
       modal's own `.seven-modal-body p { margin: 0 0 9px }` is MORE specific
       than a bare .tx-class, so an unscoped `margin: … auto` silently lost and
       the measured block sat left-aligned with its text centred inside it. */
    .seven-modal-body .tx-note {
      margin: 18px auto 0; max-width: 26em;
      font-size: 13px; line-height: 1.45; text-wrap: balance;
    }
    /* The aside sits under its sentence, not as a second statement. */
    .seven-modal-body .tx-note + .tx-note { margin-top: 5px; }
    .seven-modal-body .tx-aside { color: var(--text-dim); }
    /* What the instrument never told us, said quietly rather than dropped. */
    .seven-modal-body .tx-fine { font-size: 12px; color: var(--text-dim); }
    .seven-modal-body .tx-alarm { margin-top: 0; color: var(--accent); }
    /* The backup summary reads as a little diagram — the count, an arrow, the
       destination — so it is centred and the arrow stands alone. */
    /* "32 presets → computer" is a from/to, exactly as a transfer is, so it
       carries the same weight: the two ends large, the arrow between them
       quiet, and the supporting lines small. */
    .seven-modal-body .bk-sum {
      text-align: center; margin: 0;
      font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.3;
    }
    .seven-modal-body .bk-arrow {
      text-align: center; margin: 2px 0; font-size: 16px; line-height: 1;
      color: var(--text-dim);
    }
    .seven-modal-body .bk-time {
      text-align: center; margin: 16px 0 0; font-size: 12px; color: var(--text-muted);
    }
    .seven-modal-body .bk-time + .bk-time { margin-top: 4px; }
    /* The walk's step: which patch, then where it goes, then the panel. */
    .seven-modal-body .tx-step-name { margin: 0; font-size: 17px; font-weight: 700; color: var(--text); }
    /* Sits ON the name, not under the block: the patch is already playing, and
       that is the one thing about this step you can check by ear. */
    .seven-modal-body .tx-step-hear { margin: 1px 0 0; font-size: 13px; }
    .seven-modal-body .tx-step-where {
      margin: 4px 0 14px; font-size: 10px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim);
    }
    /* Mid-step the app is writing to the instrument. The actions go inert
       rather than disappear, so the dialog keeps its shape under the hands. */
    .seven-modal.is-busy .seven-modal-actions,
    .seven-modal.is-busy .seven-modal-cancel { opacity: .4; pointer-events: none; }
    /* Becoming the next thing: the old content fades out, the card resizes,
       the new content fades in. One dialog, several states — never a dialog
       that vanishes so another can take its place. */
    .seven-modal-body, .seven-modal-actions { transition: opacity .17s ease; }
    .seven-modal.is-swapping .seven-modal-body,
    .seven-modal.is-swapping .seven-modal-actions { opacity: 0; }
    .seven-modal.is-resizing { overflow: hidden; transition: height .34s cubic-bezier(.4, 0, .2, 1); }
    @media (prefers-reduced-motion: reduce) {
      .seven-modal-body, .seven-modal-actions, .seven-modal.is-resizing { transition: none; }
    }
    .seven-modal.is-warning .seven-modal-ok { background: var(--accent); border-color: var(--accent); }
    .seven-modal-ok:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

    /* The transfer's panel picture. Literal panel colours in both themes — it
       is a photograph of a machine, not part of the interface's palette. */
    .panel-mini { display: block; margin: 2px 0 4px; }
    .panel-mini .pm-bg { fill: #141416; }
    .panel-mini .pm-bezel { fill: #1a1a1c; }
    .panel-mini .pm-face { fill: #232327; stroke: #4a4a52; stroke-width: 1; }
    .panel-mini .pm-cap { fill: rgba(255, 255, 255, .045); }
    .panel-mini .pm-led { fill: #5a2320; }
    /* Which button to press is carried by the GROUP's class, so stepping to
       the next one is a toggle on living nodes and every one of these can
       cross-fade rather than cut. */
    /* The button to press is visibly LIGHTER, not just outlined — against
       seven identical dark caps a faint lift did not register as selected
       (Daniel, 2026-08-13). The cap catches more light with it, the way a
       pressed key does. */
    .panel-mini .pm-active .pm-face { fill: #4e4e57; stroke: #b6b6c0; stroke-width: 1.4; }
    .panel-mini .pm-active .pm-cap { fill: rgba(255, 255, 255, .12); }
    /* The one lit LED blinks, the way a preset waiting to be stored asks for
       attention on the instrument itself. */
    .panel-mini .pm-active .pm-led { fill: #ff3b30; animation: pm-blink 1.05s steps(1, end) infinite; }
    @keyframes pm-blink { 0%, 55% { fill: #ff3b30; } 56%, 100% { fill: #6d2a25; } }
    /* Seven identical caps and one to press: the rest step back — but stay
       readable. Too dim and you cannot see where the walk is heading, only
       where it is. */
    .panel-mini .pm-dim { opacity: .5; }
    .panel-mini .pm-active { opacity: 1; }
    /* The confirmation run: after the hold, the Seven's lights travel down the
       row. ONLY the LEDs move — the buttons themselves stay exactly as they
       are, because on the instrument nothing but the lights is doing anything
       (Daniel, 2026-08-13). Lighting the whole group made the caps flicker as
       though eight buttons were being pressed. Not the blinking .pm-active
       LED either — this is the instrument answering, not asking. */
    /* The run is as bright as the held light. It was not, and the reason was
       not its colour: those buttons carry .pm-dim, whose opacity halves
       EVERYTHING inside the group — a child cannot out-shine its parent's
       opacity (Daniel, 2026-08-13).
       So the group goes to full opacity for the run, and the face, cap and
       number are held at the values they rendered at while dimmed. The button
       looks untouched; only the light changes. */
    .panel-mini .pm-run { opacity: 1; }
    .panel-mini .pm-run .pm-face { fill: #1d1d21; stroke: #313136; }
    .panel-mini .pm-run .pm-cap { fill: rgba(255, 255, 255, .022); }
    .panel-mini .pm-run .pm-idx { fill: #494950; }
    .panel-mini .pm-run .pm-led {
      fill: #ffe9e6;
      filter: drop-shadow(0 0 3px #ff3b30) drop-shadow(0 0 7px #ff3b30);
    }
    /* In the demonstration the held button's light is SOLID. The blink belongs
       to the transfer walk, where the panel is asking for a press. */
    .panel-mini.pm-demo .pm-active .pm-led { animation: none; fill: #ff3b30; }
    .panel-mini .pm-btn .pm-led { transition: fill .12s ease; }
    .panel-mini .pm-btn { transition: opacity .26s ease; }
    .panel-mini .pm-btn .pm-face { transition: fill .26s ease, stroke .26s ease; }
    /* The legend travels the row rather than being redrawn over the next
       button — the same move the player's hand is about to make. */
    .panel-mini .pm-hold-g { transition: transform .3s cubic-bezier(.4, 0, .2, 1); }
    .panel-mini .pm-num, .panel-mini .pm-idx {
      fill: #7a7a84; font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif;
      font-size: 12px; font-weight: 700; font-style: italic;
      transition: fill .26s ease;
    }
    .panel-mini .pm-idx { text-anchor: middle; }
    .panel-mini .pm-on, .panel-mini .pm-active .pm-idx { fill: #f0efe8; }
    @media (prefers-reduced-motion: reduce) {
      .panel-mini .pm-btn, .panel-mini .pm-btn .pm-face,
      .panel-mini .pm-hold-g, .panel-mini .pm-idx { transition: none; }
      .panel-mini .pm-active .pm-led { animation: none; }
    }
    /* HOLD wears the panel's CLAVI TABS yellow, bracketed the same way. */
    .panel-mini .pm-hold {
      fill: #d9c24a; font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif;
      font-size: 14px; font-weight: 700; font-style: italic;
      letter-spacing: .06em; text-anchor: middle;
    }
    .panel-mini .pm-bracket { stroke: #d9c24a; stroke-width: 1; fill: none; }

    /* Patch picker: a modal over the setlist, so the slots you're filling stay
       visible behind it. Tiles rather than rows — the point is seeing many
       options at once, and a row wastes the width. */
    .pick-overlay {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(0, 0, 0, .55);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .pick-modal {
      display: flex; flex-direction: column;
      width: min(860px, 92vw); max-height: 82vh;
      background: var(--bg-panel); border: 1px solid var(--line); border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }
    .pick-modal-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--line);
    }
    .pick-title { font-weight: 600; flex: none; }
    .pick-modal-head .lib-search { flex: 1; }
    .pick-cancel {
      font: inherit; font-size: 12px; color: var(--text-muted);
      background: none; border: 1px solid var(--line); border-radius: 4px;
      padding: 3px 10px; cursor: pointer;
    }
    .pick-cancel:hover { color: var(--text); border-color: var(--text-muted); }
    .pick-body { overflow-y: auto; padding: 12px 14px 16px; }
    .pick-group + .pick-group { margin-top: 16px; }
    .pick-group-title {
      position: sticky; top: -12px; z-index: 1;
      background: var(--bg-panel); padding: 4px 0 6px;
      font-size: 12px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-muted);
    }
    /* The instrument grid's two halves are named in their own colour, at a
       size that reads as a heading rather than a caption. */
    .pick-group-title.is-modeled, .pick-group-title.is-sampled {
      font-size: 15px; letter-spacing: .08em; padding-bottom: 8px;
    }
    .pick-group-title.is-modeled { color: var(--modeled); }
    .pick-group-title.is-sampled { color: var(--sampled); }
    .pick-grid {
      display: grid; gap: 8px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    /* Each tile carries its engine's colour as a top edge — family is legible
       even when the name truncates. */
    .pick-tile {
      display: flex; flex-direction: column; gap: 2px; text-align: left;
      padding: 8px 10px; border: 1px solid var(--line); border-top: 3px solid var(--tile);
      border-radius: 5px; background: var(--bg-raised); color: var(--text);
      font: inherit; cursor: pointer; min-width: 0;
    }
    /* One line, clipped. A long name wrapped to two and made its tile taller
       than the row around it (Daniel, 2026-08-13); the full name is in the
       tile's tooltip. */
    .pick-tile .tile-name {
      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pick-tile .tile-sound, .pick-tile .tile-when {
      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pick-tile .tile-when { color: var(--text-dim); font-size: 11px; }
    .pick-tile:hover { background: var(--shade-hard); border-color: var(--text-dim); }
    .pick-modes { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
    .pick-mode {
      font: inherit; font-size: 12px; font-weight: 600; color: var(--text-muted);
      background: none; border: 0; padding: 4px 12px; cursor: pointer;
    }
    .pick-mode + .pick-mode { border-left: 1px solid var(--line); }
    .pick-mode.on { background: var(--shade-hard); color: var(--text); }
    /* Illustrated tiles are roomier than patch tiles — 24 instruments fit on a
       screen at this size, so the art can be legible without costing overview. */
    .pick-grid-art { grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); }
    /* The same grid, hosted inside a plain dialog rather than the library's
       own picker shell (one preset on the instrument, not a setlist slot). */
    .pick-inline { max-height: 54vh; overflow-y: auto; margin-top: 12px; text-align: left; }
    .pick-tile-art {
      align-items: center; text-align: center; gap: 4px; padding: 8px 8px 8px;
      /* A wash of the family colour behind the picture. Sounds that share an
         instrument — every Venice Grand is an acoustic grand sample — share a
         drawing, so the tile's colour and its name are what tell them apart. */
      background: color-mix(in srgb, var(--tile) 14%, var(--bg-raised));
    }
    .pick-tile-art:hover { background: color-mix(in srgb, var(--tile) 26%, var(--bg-raised)); }
    /* A FIXED picture area, with the instrument centred in it. The art was
       sized by its own aspect, so a short wide one (the MKS rack) floated
       against the top of a tall box and every label sat at a different height
       down the row (Daniel, 2026-08-13). One box, one baseline for the names. */
    .tile-art {
      color: var(--tile); display: flex; align-items: center; justify-content: center;
      width: 100%; height: 92px; line-height: 0;
    }
    /* A drawn instrument brings its own colours; only the fallback line art is
       tinted with the family colour. */
    .tile-art .sound-art.is-drawing {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
    }
    .tile-art .sound-art.is-drawing svg,
    .tile-art .sound-art.is-drawing img {
      display: block; width: 100%; height: 100%;
      object-fit: contain; object-position: center;
    }
    /* A photograph with a transparent background reads as a cut-out pasted on
       — hardest on the dark theme, where the silhouette meets near-black with
       nothing between them. drop-shadow follows the ALPHA rather than the box,
       so a pale halo traces the instrument itself and lifts it off the panel.
       Light theme gets the opposite: a soft dark shadow, so it sits on the
       surface rather than floating above it. */
    .sound-art.is-drawing img {
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .28));
    }
    :root[data-theme="dark"] .sound-art.is-drawing img {
      filter: drop-shadow(0 0 9px rgba(255, 255, 255, .16))
              drop-shadow(0 0 26px rgba(255, 255, 255, .07))
              drop-shadow(0 2px 4px rgba(0, 0, 0, .55));
    }
    /* How a SAMPLED instrument arrives: a line crosses it, and the instrument
       exists behind the line. Nothing is there before the line reaches it.

       The line follows the CONTOURS of the instrument rather than running the
       full width of the box (Daniel, 2026-08-13), and the way it does that is
       a mask: app.js hands the instrument's own image over as --art-src, the
       line is painted across the whole drawn rect, and the mask means it only
       shows where that image is opaque. So on a grand piano the line is short
       over the legs and long across the lid, for free — no per-instrument work
       and no silhouette data to maintain.

       Everything is measured, not assumed. The art is object-fit: contain, so
       a wide flat instrument leaves empty bands above and below; app.js
       measures the drawn rect and hands over --scan-top/-left/-span/-w, and
       every rule here is expressed in those. Animating over the BOX instead
       meant the pass spent most of its travel crossing nothing.

       Landing only, so nothing animates at rest. */
    .car-face.is-landing .sound-art.is-drawing.is-sampled {
      position: relative;
      /* A proportion of the instrument, not a fixed height: wide flat art
         renders short — the Combo Piano is 48px tall in a 128px box — and a
         fixed lamp covered half of it at every moment, which reads as a blob
         arriving rather than a pass across something. */
      --lamp-h: max(4px, calc(var(--scan-span, 128px) * 0.14));
    }
    /* The reveal, over the drawn rect rather than the box. */
    @keyframes sampled-reveal {
      0%   { clip-path: inset(0 0 calc(100% - var(--scan-top)) 0); }
      100% { clip-path: inset(0 0 calc(100% - var(--scan-top) - var(--scan-span)) 0); }
    }
    /* A band of constant height travelling top to bottom. Both insets
       interpolate, which is what keeps the height fixed while it moves. */
    @keyframes sampled-line {
      0%   { clip-path: inset(0 0 calc(100% - var(--lamp-h)) 0); opacity: 0; }
      10%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { clip-path: inset(calc(100% - var(--lamp-h)) 0 0 0); opacity: 0; }
    }
    .is-landing.is-scan .sound-art.is-drawing.is-sampled img {
      animation: sampled-reveal 550ms linear var(--scan-delay, 0ms) 1;
    }
    .is-landing.is-scan .sound-art.is-drawing.is-sampled::before {
      content: '';
      position: absolute;
      left: var(--scan-left); top: var(--scan-top);
      width: var(--scan-w); height: var(--scan-span);
      /* Hard stops, not a falloff. A smooth gradient reads as something out of
         focus; a digital readout has EDGES — a bright core with a defined
         band either side of it, and a 1px scanline texture across the whole
         thing so it looks generated rather than lit (Daniel, 2026-08-13). */
      background-image:
        repeating-linear-gradient(to bottom,
          rgba(255, 255, 255, .55) 0 1px,
          transparent 1px 2px),
        linear-gradient(to bottom,
          transparent 0 14%,
          color-mix(in srgb, var(--sampled) 55%, transparent) 14% 34%,
          #fff 34% 66%,
          color-mix(in srgb, var(--sampled) 55%, transparent) 66% 86%,
          transparent 86% 100%);
      /* The silhouette. Prefixed too — this has to hold on whatever Chromium
         the packaged app ships with. */
      -webkit-mask-image: var(--art-src); mask-image: var(--art-src);
      -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      /* INVISIBLE unless the animation is driving it. The keyframes clip it to
         a band, but the moment the animation ends the clip reverts to none and
         it paints unclipped — a white silhouette of the instrument sitting on
         top of the instrument (Daniel, 2026-08-13). The base state has to be
         "nothing", so that whenever the animation is not running there is
         nothing to see. */
      opacity: 0; clip-path: inset(100% 0 0 0);
      pointer-events: none; z-index: 2;
      animation: sampled-line 550ms linear var(--scan-delay, 0ms) 1;
    }
    @media (prefers-reduced-motion: reduce) {
      .is-landing .sound-art.is-drawing.is-sampled img { animation: none; }
      .is-landing .sound-art.is-drawing.is-sampled::before { display: none; }
    }
    .pick-tile-art .tile-name { -webkit-line-clamp: 2; }
    .pick-note {
      margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line);
      font-size: 12px; color: var(--text-muted); max-width: 62ch;
    }
    /* A sound-only slot: no patch behind it, so its name reads as the sound. */
    .lib-slot-sound .patch-name { font-style: italic; }

    .tile-name {
      font-weight: 600; font-size: 12px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile-sound {
      font-size: 12px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .lib-slot {
      display: grid; grid-template-columns: 24px 1fr auto auto;
      column-gap: 10px; row-gap: 3px; align-items: baseline;
      width: 100%; padding: 7px 6px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left;
    }
    .lib-slot-patch { cursor: pointer; }
    .lib-slot-patch:hover { background: var(--bg-raised); }
    .slot-num { color: var(--text-dim); font-variant-numeric: tabular-nums; }
    /* Empty and missing-file slots are distinct at a glance: empty is quiet,
       missing carries the warning treatment. */
    .lib-slot-empty .slot-text { color: var(--text-dim); font-style: italic; }
    /* Sits in the cleared row's trailing control cell — where the ✕ that
       emptied it was. */
    .slot-undo {
      display: inline-flex; align-items: center; justify-content: center;
      background: none; border: none; padding: 2px 6px; cursor: pointer;
      color: var(--amber); grid-column: 6;
    }
    .slot-undo:hover { color: var(--text); }
    .lib-slot-missing .slot-text { color: var(--warn); }
    /* Setlist editing */
    /* Pinned to the bottom of the scroller. It sat at the end of the list, so
       with enough setlists it fell below the fold and could not be clicked at
       all — and any small change elsewhere in the window (one more button in
       the connection row) was enough to tip it over. A control that creates
       things should not be the thing you have to scroll to find. */
    .lib-new-setlist {
      position: sticky; bottom: 0; z-index: 1;
      display: block; width: 100%; padding: 9px 6px;
      background: var(--bg); border: none; border-top: 1px solid var(--line);
      color: var(--text-muted); font: inherit; text-align: left; cursor: pointer;
    }
    .lib-new-setlist:hover { background: var(--bg-raised); color: var(--text); }
    .lib-setlist-renaming { display: block; }
    .setlist-input {
      width: 100%; font: inherit; font-weight: 600; color: var(--text);
      background: var(--bg); border: 1px solid var(--amber); border-radius: 3px;
      padding: 3px 6px;
    }
    .slot-assign {
      font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .05em;
      color: var(--amber); background: transparent;
      border: 1px solid var(--amber); border-radius: 9px;
      padding: 2px 9px; cursor: pointer; flex: none; margin-left: 6px;
    }
    .slot-assign:hover { background: rgba(255, 176, 32, .15); }
    .slot-assign:disabled { opacity: .35; cursor: default; }
    .slot-clear {
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-dim); background: transparent; border: none;
      padding: 2px 4px; cursor: pointer;
    }
    .slot-clear:hover { color: var(--text); }
    /* Slot change feedback: the row settles into its new state rather than
       snapping, so a clear reads as a removal and an undo as a return. */
    @keyframes slot-cleared {
      from { background: var(--shade-hard); opacity: .35; transform: translateY(-3px); }
      to { background: transparent; opacity: 1; transform: none; }
    }
    @keyframes slot-restored {
      from { background: rgba(63, 185, 80, .16); opacity: .35; transform: translateY(4px); }
      to { background: transparent; opacity: 1; transform: none; }
    }
    .lib-slot.slot-cleared { animation: slot-cleared 340ms ease-in-out; }
    .lib-slot.slot-restored { animation: slot-restored 340ms ease-in-out; }
    /* Drop feedback while dragging a patch or a slot over a target slot. */
    .lib-slot.drop-target { outline: 1px dashed var(--amber); outline-offset: -2px; background: rgba(255, 176, 32, .06); }
    /* Slot rows grew controls; make room without breaking the grid. */
    .lib-slot .slot-num { grid-column: 1; grid-row: 1 / span 2; align-self: center; }
    .lib-slot .patch-name, .lib-slot .slot-text { grid-column: 2; grid-row: 1; }
    .lib-slot .lib-badges { grid-column: 3; grid-row: 1; text-align: right; }
    .lib-slot .lib-origin { grid-column: 2; grid-row: 2; }
    .lib-slot .patch-sound { grid-column: 3 / -1; grid-row: 2; text-align: right; }
    /* Slot rows carry the sound's kind as a lettered dot next to the sound
       name rather than a pill in the corner — the corner belongs to Assign.
       Hover reveals "Modeled" / "Sampled". */
    .sound-tag { font-style: italic; color: var(--text-dim); }
    .sound-tag.is-warn { color: var(--warn); font-style: normal; }
    .lib-slot .slot-controls {
      grid-column: 4; grid-row: 1; align-self: center;
      display: flex; align-items: center; gap: 3px; justify-content: flex-end;
    }
    .slot-undo { grid-column: auto; }

    /* 4. Detail */
    /* min-width 0 lets the column shrink instead of overflowing #main
       horizontally; the stable gutter keeps content width constant whether or
       not a classic scrollbar is showing. */
    /* Audition bar: only rendered while an instrument is connected. */
    /* Two text links, sized like the lines above them. They were a filled
       button and a link, which put two button shapes in one column and made
       saving look louder than the patch it belonged to (Daniel, 2026-08-13).
       They stand out by COLOUR and WEIGHT — nothing else. */
    /* Column-first: these two stack, because the column is narrow and a row
       wrapped more often than not — leaving the separator dangling at the end
       of the first line. Stacked, they need no separator at all. */
    .save-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .save-sep { display: none; }
    /* Never break a label across lines — "Save to Seven" came out three lines
       tall in a narrow column (Daniel, 2026-08-13). */
    #save-live-btn, .save-seven-link { white-space: nowrap; }
    .save-sep { color: var(--text-dim); font-size: 12px; }
    #save-live-btn, .save-seven-link {
      font: inherit; font-size: 12px; font-weight: 600;
      background: none; border: none; padding: 0; cursor: pointer;
      text-decoration: none; text-align: left;
    }
    /* The one that writes to disk carries the action colour; the one that only
       explains something is quieter. */
    #save-live-btn { color: var(--action); }
    .save-seven-link { color: var(--text-muted); font-weight: 500; }
    #save-live-btn:hover:not(:disabled), .save-seven-link:hover {
      text-decoration: underline; text-underline-offset: 2px;
    }
    #save-live-btn:focus-visible, .save-seven-link:focus-visible {
      outline: 2px solid var(--action); outline-offset: 2px; border-radius: 3px;
    }
    #save-live-btn:disabled { cursor: default; }


    /* Coming alive is an ANIMATION, not a transition: the panel is re-rendered
       on every live edit, so the node is new each time and has no previous
       state to transition from. .is-appearing is set only on the render where
       it goes live, or it would flare on every drag. */
    .save-slot { overflow: hidden; }
    @keyframes save-wake {
      from { opacity: .35; }
      to   { opacity: 1; }
    }
    .save-slot.is-appearing .audition-bar { animation: save-wake 340ms ease-out both; }
    @media (prefers-reduced-motion: reduce) {
      .save-slot.is-appearing .audition-bar { animation: none; }
    }
    /* In-column: left-aligned with the bank line above, and every decoration
       the old full-width bar carried is undone here or it draws a stray rule
       across the column. */
    .save-slot .audition-bar,
    .save-slot .audition-bar.is-live {
      display: block; position: static; z-index: auto; text-align: left;
      margin: 12px 0 0; padding: 0;
      background: none; border: none; box-shadow: none;
    }
    .save-slot .audition-bar .audition-note {
      display: block; margin-top: 6px; min-width: 0; font-size: 12px; line-height: 1.45;
      text-align: left;
    }
    /* Quiet: the two ACTIONS dim and neither can be pressed. The note does
       not — it is what just happened, and saving is precisely what makes the
       controls go quiet, so the confirmation was arriving already greyed out
       (Daniel, 2026-08-13). */
    .save-slot .audition-bar.is-idle .save-actions { opacity: .5; }

    .audition-bar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin: -4px 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
    }
    #audition-btn {
      font: inherit; font-size: 12px; font-weight: 600; color: var(--text);
      background: var(--bg-raised); border: 1px solid var(--line);
      border-radius: 5px; padding: 5px 12px; cursor: pointer; flex: none;
    }
    #audition-btn:hover:not(:disabled) { border-color: var(--text-muted); }
    #audition-btn:disabled { opacity: .6; cursor: default; }
    .audition-note { font-size: 12px; color: var(--text-muted); flex: 1; min-width: 12rem; }
    .audition-note.is-ok { color: var(--modeled); }
    .audition-note.is-error { color: var(--warn-text, #c0392b); }
    /* A live row is interactive: the bar becomes a track you can press
       anywhere along, and switches/selectors respond to a click. */
    .param.is-live .param-bar { cursor: ew-resize; }
    .param.is-live .param-bar:hover { box-shadow: 0 0 0 1px var(--text-dim); }

    .param.is-live .param-bar:hover .param-bar-knob { box-shadow: 0 0 0 3px var(--shade-hard); }
    /* Only the side that would CHANGE something is a target: the lit half is
       already the current value, so it gets no pointer and no hover. */

    .param.is-live .d6-half:not(.pressed),
    .param.is-live .d6-toggle,
    .param.is-live .seg { cursor: pointer; }
    .param.is-live .d6-half:not(.pressed):hover {
      background: var(--shade-hard); color: var(--text);
      box-shadow: inset 0 0 0 1px var(--action);
    }
    .param.is-live .d6-toggle:hover { box-shadow: inset 0 0 0 1px var(--action); }
    .param.is-live .seg:hover { background: var(--action); }
    .param.is-live .param-seg:hover .seg { background: var(--text-dim); }
    /* Audition mode reads as a state you are IN: the header sticks to the top
       of the detail panel as you scroll, and the panel wears an amber edge. */
    .audition-bar.is-live {
      position: sticky; top: -16px; z-index: 5;
      padding-right: 48px; /* keeps the wrapped line clear of the close control */
      margin: -16px -20px 16px; padding: 10px 20px;
      background: var(--bg); border-bottom: 2px solid var(--action);
      box-shadow: 0 6px 12px -8px rgba(0, 0, 0, .45);
    }
    .audition-mode {
      font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--action-ink); background: var(--action);
      padding: 3px 8px; border-radius: 4px; flex: none;
    }
    .audition-patch { font-weight: 600; font-size: 13px; flex: none; }
    #audition-btn.is-secondary { font-weight: 400; color: var(--text-muted); }
    /* The note's height is reserved, so swapping its text (hint, result,
       error) never reflows the row beneath it. */
    /* The line belongs UNDER the controls, not squeezed into the gap beside
       them — it was taking whatever width was left and wrapping to three. */
    .audition-bar.is-live .audition-note {
      flex: 0 0 100%; min-width: 0; min-height: 1.4em; margin-top: 2px;
    }
    /* Leaving audition mode is a close control at the bar's right edge, the
       same affordance the modal uses — not a button beside Save. */
    #done-live-btn {
      /* Pinned to the bar's top-right corner rather than floated to the end of
         the row, so it stays put as the line below it wraps. */
      position: absolute; top: 8px; right: 14px;
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0;
      background: none; border: none; border-radius: 4px;
      color: var(--text-dim); cursor: pointer;
    }
    #done-live-btn:hover { color: var(--text); background: var(--shade-hard); }

    #detail { flex: 1; min-width: 0; overflow-y: auto; scrollbar-gutter: stable; padding: 16px 20px; }
    #detail .placeholder { color: var(--text-dim); padding: 40px; text-align: center; }
