    /* minmax(0, 1fr): a plain 1fr never shrinks below its content's minimum,
       so a patch whose widest word was narrower got a narrower column — 287px
       against 294 (Daniel, 2026-08-13). Now both halves are exactly half,
       whatever is in them. */
    .detail-cols {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px; align-items: start;
    }
    .col-title {
      font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 10px;
      /* Centered over each column's own width (bank tabs stay left-aligned —
         they're a tab strip, not a column header). */
      text-align: center;
    }

    /* Text on the left, instrument on the right: the picture uses the space
       beside the name rather than taking a band across the top and pushing
       every parameter down. */
    .engine-head {
      /* BLOCK, not flex: the picture floats and the text flows past it, so
         the name and its pill get the panel's full width on the first line
         and only the shorter lines below sit beside the instrument. A flex
         row gave the text a fixed column, and no offset or size could stop
         "Venice Upright U1 Felt" wrapping in it (Daniel, 2026-08-13). */
      /* flow-root: the header CONTAINS its float. A ::after clearfix was not
         enough once the picture moved inside the text column — the parameter
         grid below was laying out beside it, squeezed to 132px with the
         labels truncated (Daniel, 2026-08-13). */
      display: flow-root; margin-bottom: 12px;
      /* The picture is pushed down, so the row is as tall as the picture's
         offset plus itself — pull that back off the bottom. */
      margin-bottom: -6px;
    }
    .engine-head-text { min-width: 0; }
    /* The float is cleared by the row below it, not by the head. */
    .engine-head::after { content: ''; display: block; clear: both; }
    /* The name and its pill stay on one line together. */
    .engine-sound .badge { white-space: nowrap; }
    /* 128, not 150: the picture sets the header's height in every case (the
       longest sound name and description together still come in shorter), so
       every pixel here is a pixel of parameters pushed below the fold on an
       ordinary patch. 128 also widens the text column enough to un-wrap most
       names — better in both dimensions at once. */
    /* Pushed DOWN so the name and its pill get the panel's full width on the
       first line. The picture used to start level with the heading, which
       squeezed the text column and wrapped "Electric Grand Piano" onto two
       lines with the pill stranded on the second (Daniel, 2026-08-13). The
       heading is one line tall, so that is how far it drops. */
    /* Below the HEADING, not merely below the top. At 26px the float's edge
       still cut into the name's own line, so the pill had nowhere to sit even
       with half the panel empty (Daniel, 2026-08-13). The name clears it now
       and the picture sits beside the lines that are short anyway. */
    /* Back to 128. It was cut to 96 while trying to give the heading room,
       which the FLOAT already does — the text flows past the picture, so its
       width costs the name nothing (Daniel, 2026-08-13). The carousel shares
       this class, so shrinking it shrank the wheel too. */
    /* No margin-top. Text avoids a float's MARGIN box, not its border box, so
       an offset here reserved space beside the heading while merely drawing
       the picture lower — which is why pushing it down never freed the name's
       line (Daniel, 2026-08-13). The picture is emitted AFTER the heading
       instead: a float only affects what follows it. */
    .engine-art { float: right; width: 128px; margin: 0 0 6px 14px; }
    /* Under the wheel, appearing only when the middle is a candidate. */
    .car-select {
      /* Tucked against the foot of the instrument, not floating below the box:
         at -30px it landed on the first parameter row. */
      position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
      z-index: 4; font: inherit; font-size: 11px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      padding: 4px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap;
      color: var(--action-ink); background: var(--action); border: 1px solid var(--action);
    }
    .car-select:hover { filter: brightness(1.08); }
    .car-select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    /* A name the instrument is not playing yet. */
    .engine-sound.is-candidate { color: var(--text-muted); }
    /* The picture as a carousel. At rest it is one instrument: the sound this
       patch names. On hover its neighbours slide out either side under arrows,
       so choosing a different instrument is paging through pictures rather
       than opening a grid and reading names. The peeks are drawn OUTSIDE the
       box (overflow visible, high z-index) so the resting layout keeps its
       128px and nothing reflows when the pointer arrives. */
    .engine-carousel {
      /* A FIXED box. The centre picture used to sit in normal flow, so the
         whole panel rose and fell as instruments of different proportions took
         the middle — a grand is tall, a stack of synths is wide and flat
         (Daniel, 2026-08-12). Now the box never moves and each instrument is
         fitted inside it, standing on the same floor. */
      position: relative; overflow: visible; isolation: isolate;
      height: 128px;
    }
    .engine-carousel .car-face {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
    }
    .engine-carousel .car-face .sound-art.is-drawing { height: 100%; }
    /* Specific enough to beat `.engine-art .sound-art.is-drawing img`, which
       sets height:auto — without that the tall instruments (the Venice grand)
       ignored the box and spilled over the parameter rows. */
    .engine-carousel .car-face .sound-art.is-drawing img,
    .engine-carousel .car-face .sound-art.is-drawing svg,
    .engine-carousel .car-face img, .engine-carousel .car-face svg {
      width: 100%; height: 100%;
      /* Centred, not stood on the floor. Every drawing is trimmed tight to its
         canvas, so `contain` scales a wide instrument by WIDTH and it comes out
         short — floor-aligned, the flatter it is the lower it sits, which is the
         order Daniel picked out by eye: combo (2.67:1) sank furthest, then the
         MKS rack, the Clavi, the CP. Rhodes and Wurly looked right because they
         are tall enough to fill the box. Matching centres leaves those two
         exactly where they were and lifts the rest to meet them. */
      object-fit: contain; object-position: center;
    }
    /* Choosing settles the instrument into place and glows once behind it.
       The picture does not travel — the one you pick is already in the middle —
       so the movement is not about WHERE it went. Three things change at the
       same instant: Select disappears, the heading stops being a candidate and
       goes solid, and the wheel closes. Without a beat between them the panel
       simply blinks and you are left to work out whether the click took. The
       settle says it took; the afterglow says the instrument is now the one
       playing.

       Both ride the .sound-art WRAPPER, not the face and not the image. The
       face carries the hover and turn transforms (scale 1.12 when open), so
       animating it would fight them and snap back when the class comes off;
       the image carries the resting drop-shadow that lifts a cut-out off the
       panel, and a filter here composes with that instead of replacing it. */
    @keyframes car-land {
      from { transform: translateY(5px) scale(.9); }
      55%  { transform: translateY(0) scale(1.035); }
      to   { transform: none; }
    }
    /* The glow inverts with the theme, for the same reason the resting halo
       does: light on dark reads as a lamp coming up behind the instrument, and
       on the cream panel it is simply invisible. Light theme gets the negative
       — a warm shadow blooming and receding under it. Two keyframe sets rather
       than one parameterised by a custom property, because an unregistered
       custom property does not interpolate and the bloom would step instead of
       swell. */
    @keyframes car-afterglow {
      from { filter: drop-shadow(0 0 0 rgba(58, 44, 26, 0)); }
      30%  { filter: drop-shadow(0 2px 13px rgba(58, 44, 26, .5))
                     drop-shadow(0 4px 32px rgba(58, 44, 26, .26)); }
      to   { filter: drop-shadow(0 0 0 rgba(58, 44, 26, 0)); }
    }
    @keyframes car-afterglow-dark {
      from { filter: drop-shadow(0 0 0 rgba(255, 246, 224, 0)); }
      30%  { filter: drop-shadow(0 0 16px rgba(255, 246, 224, .55))
                     drop-shadow(0 0 38px rgba(255, 236, 196, .3)); }
      to   { filter: drop-shadow(0 0 0 rgba(255, 246, 224, 0)); }
    }
    .engine-carousel .car-face.is-landing .sound-art {
      animation: car-land 420ms cubic-bezier(.22, 1, .36, 1) both,
                 car-afterglow 900ms ease-out both;
    }
    :root[data-theme="dark"] .engine-carousel .car-face.is-landing .sound-art {
      animation: car-land 420ms cubic-bezier(.22, 1, .36, 1) both,
                 car-afterglow-dark 900ms ease-out both;
    }
    /* A SAMPLED instrument gets the scan and nothing else — no settle, no
       afterglow (Daniel, 2026-08-13). At 550ms the scan is a single quick
       statement, and anything running alongside it only blurred that. Modeled
       instruments keep both: they have no scan, so the settle and the glow are
       the only things saying the choice landed. */
    .engine-carousel .car-face.is-landing .sound-art.is-sampled,
    :root[data-theme="dark"] .engine-carousel .car-face.is-landing .sound-art.is-sampled {
      animation: none;
    }
    @media (prefers-reduced-motion: reduce) {
      /* The afterglow stays — it is a light coming up, not motion — but it
         comes up where the instrument already is. */
      .engine-carousel .car-face.is-landing .sound-art {
        animation: car-afterglow 900ms ease-out both;
      }
      :root[data-theme="dark"] .engine-carousel .car-face.is-landing .sound-art {
        animation: car-afterglow-dark 900ms ease-out both;
      }
    }
    .engine-carousel .is-hero { position: relative; z-index: 3; }
    /* Waking up: the centre grows a little and the neighbours fade in, rather
       than appearing all at once. Turning gets its own, longer curve below.
       And after a turn the faces are REBUILT — so the waking animation would
       replay every time the wheel moved, which is what .no-anim suppresses
       (Daniel, 2026-08-12). */
    .engine-carousel .car-face {
      display: block;
      transition: transform .26s cubic-bezier(.3, 1, .5, 1), opacity .26s ease;
    }
    .engine-carousel.is-turning .car-face {
      transition: transform .42s cubic-bezier(.22, .9, .3, 1), opacity .38s ease;
    }
    .engine-carousel.no-anim .car-face { transition: none; }
    .engine-carousel .car-face .sound-art.is-drawing { display: block; width: 100%; }
    .engine-carousel .car-face img, .engine-carousel .car-face svg {
      display: block; width: 100%; height: auto;
    }
    /* The two neighbours sit exactly on the hero until the pointer arrives,
       then move out and dim. Pointer-events off until then, or an invisible
       peek would eat the hero's clicks. */
    .engine-carousel .is-peek, .engine-carousel .is-far {
      /* Bottom-aligned, not top: the instruments are different shapes, and a
         wide flat one (the stacked synths) rendered at the same WIDTH is much
         shorter — hung from the top it floated above the others. Sharing a
         floor line is what makes a row of instruments look like a row of
         instruments. */
      transform-origin: bottom center;
      opacity: 0; pointer-events: none; cursor: pointer; z-index: 1;
    }
    .engine-carousel .is-hero { transform-origin: bottom center; }
    .engine-carousel .is-far { z-index: 0; }
    /* Parked out of sight either side. Never visible at rest — their whole job
       is to arrive during a turn. */
    .engine-carousel .is-far-prev { transform: translateX(-140%) scale(.6); }
    .engine-carousel .is-far-next { transform: translateX(140%) scale(.6); }

    .engine-carousel.is-open .is-peek, .engine-carousel:focus-within .is-peek {
      opacity: .38; pointer-events: auto;
      /* ABOVE the hero while open, so the whole neighbour is a target. The
         hero's box is a full-width square scaled to 1.12, and it was covering
         most of each peek — how much depended on the instrument's proportions,
         so a wide one like the Clavi or the DX7 left almost nothing to aim at
         (Daniel, 2026-08-13). The hero keeps the middle, which is where you
         click to choose it. */
      z-index: 4;
    }
    .engine-carousel.is-open .is-prev, .engine-carousel:focus-within .is-prev {
      transform: translateX(-72%) scale(.74);
    }
    .engine-carousel.is-open .is-next, .engine-carousel:focus-within .is-next {
      transform: translateX(72%) scale(.74);
    }
    .engine-carousel .is-peek:hover { opacity: .72; }
    .engine-carousel .is-hero { cursor: pointer; }
    .engine-carousel.is-open .is-hero, .engine-carousel:focus-within .is-hero {
      transform: scale(1.12);
    }
    /* Turning the wheel: every face moves one position along, so the picture
       you clicked travels INTO the middle and the middle one travels out.
       Re-rendering without this made the images change in place — a jump cut,
       not a rotation. */

    /* No arrows. Clicking a neighbour brings it to the middle, so the picture
       you want IS the button — one target instead of a control pointing at a
       control. It lifts on hover to say it can be reached. */
    .engine-carousel .is-peek:hover { opacity: .82; }
    .engine-carousel.is-open .is-prev:hover { transform: translateX(-72%) scale(.82); }
    .engine-carousel.is-open .is-next:hover { transform: translateX(72%) scale(.82); }
    .engine-carousel.is-turning.is-turning-next .is-next,
    .engine-carousel.is-turning.is-turning-prev .is-prev { transform: translateX(0) scale(1.12); opacity: 1; }
    .engine-carousel.is-turning.is-turning-next .is-hero { transform: translateX(-72%) scale(.74); opacity: .38; }
    .engine-carousel.is-turning.is-turning-prev .is-hero { transform: translateX(72%) scale(.74); opacity: .38; }
    .engine-carousel.is-turning.is-turning-next .is-prev { transform: translateX(-140%) scale(.6); opacity: 0; }
    .engine-carousel.is-turning.is-turning-prev .is-next { transform: translateX(140%) scale(.6); opacity: 0; }
    /* The one rolling in from beyond, taking the vacated side. */
    .engine-carousel.is-turning.is-turning-next .is-far-next { transform: translateX(72%) scale(.74); opacity: .38; }
    .engine-carousel.is-turning.is-turning-prev .is-far-prev { transform: translateX(-72%) scale(.74); opacity: .38; }
    .engine-carousel.is-turning.is-turning-next .is-far-prev { transform: translateX(-210%) scale(.5); opacity: 0; }
    .engine-carousel.is-turning.is-turning-prev .is-far-next { transform: translateX(210%) scale(.5); opacity: 0; }

    /* No labels on the faces: the SOUND ENGINE heading names the centre
       instead, so nothing is drawn over the instruments. */
    /* The app's micro-label treatment (DESIGN.md type ladder): 10px, bold,
       uppercase, letterspaced. It reads as a LABEL on top of the picture
       rather than as a sentence someone left there. */
    .engine-art-cta-unused {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; text-align: center;
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; line-height: 1.5; color: #fff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, .9), 0 0 22px rgba(0, 0, 0, .75);
      opacity: 0; transition: opacity .18s ease; pointer-events: none;
    }
    button.engine-art:hover .engine-art-cta,
    button.engine-art:focus-visible .engine-art-cta { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      button.engine-art, .engine-art-cta { transition: none; }
      button.engine-art:hover { transform: none; }
    }
    .engine-art .sound-art.is-drawing { display: block; width: 100%; }
    .engine-art .sound-art.is-drawing img,
    .engine-art .sound-art.is-drawing svg { display: block; width: 100%; height: auto; }
    /* The line-art fallback is a 48x32 mark, not a picture — it keeps its own
       size and the family tint rather than being blown up to fill the space. */
    .engine-art > svg.sound-art { width: 92px; height: auto; color: var(--text-dim); }
    /* The longest name and its pill share one line. "Venice Upright U1 Felt"
       plus a Sample pill overflowed at 17px and the pill dropped to a line of
       its own; a point off the name and a tighter pill fit them together
       (Daniel, 2026-08-13). */
    .engine-sound { font-size: 16px; font-weight: 700; }
    .engine-sound .badge {
      vertical-align: 2px; margin-left: 6px;
      font-size: 9px; padding: 2px 6px; white-space: nowrap;
    }
    .engine-sub { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .engine-group { color: var(--text-muted); font-size: 12px; }
    .engine-pos { color: var(--text-muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .warn-banner {
      margin-top: 10px; padding: 8px 10px; border-radius: 4px;
      background: rgba(217, 161, 59, .12); border: 1px solid var(--warn);
      color: var(--warn); font-size: 12px;
    }

    .fx-section {
      border: 1px solid var(--line); border-radius: 6px;
      padding: 10px 12px; margin-bottom: 12px;
      background: var(--bg-raised);
    }
    /* Transient open-confirmation: a brief accent tint fading out. No left
       edge bar — that colour belongs to the library's selected-patch marker.
       The persistent "expanded" cue is the accent ring on the knob. */
    @keyframes nav-tint {
      from { background-color: rgba(255, 59, 48, .10); }
      to { background-color: var(--bg-raised); }
    }
    .fx-section.nav-flash { animation: nav-tint 1.2s ease-out; }
    .fx-section.dimmed { opacity: .38; }
    /* Headers are clickable toggles; collapse state is view state only. The
       whole row is the click target, with a hover state to say so. */
    .fx-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 0;
      cursor: pointer; border-radius: 4px; padding: 2px 4px; margin-left: -4px; margin-right: -4px;
    }
    .fx-head:hover { background: var(--shade); }
    /* Flex-centred box around a geometric SVG chevron: vertically centred on
       the header text's midline in both states (a font glyph's ink sat below
       centre regardless of box alignment). */
    .fx-chevron {
      color: var(--text); width: 24px; flex: none;
      display: flex; align-items: center; justify-content: center;
      transition: transform 180ms ease-out;
    }
    .fx-chevron svg { display: block; }
    .fx-section.collapsed .fx-chevron { transform: rotate(-90deg); transition-duration: 140ms; }
    /* Expand/collapse animates the body's grid row 0fr↔1fr (height 0↔auto);
       content fades in slightly behind the container getting room. The body is
       always in the DOM — app.js toggles the class without re-rendering. */
    .fx-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 180ms ease-out; }
    .fx-section.collapsed .fx-body { grid-template-rows: 0fr; transition-duration: 140ms; }
    .fx-body-inner {
      min-height: 0; overflow: hidden;
      opacity: 1; transition: opacity 120ms ease-out 40ms;
    }
    .fx-section.collapsed .fx-body-inner { opacity: 0; transition: opacity 100ms ease-in; }
    .fx-body-inner .params { padding-top: 8px; }
    @media (prefers-reduced-motion: reduce) {
      .fx-body, .fx-body-inner, .fx-chevron { transition: none !important; }
      .fx-section.nav-flash { animation: none; }
      .lib-slot.slot-cleared, .lib-slot.slot-restored { animation: none; }
    }
    /* Uppercase + tracking is reserved for section headers (matches .col-title). */
    .fx-title { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
    #library-head .fx-title { color: var(--text-muted); transition: color .15s; }
    #library-head:hover .fx-title { color: var(--text); }
    /* The summary is the header's flex-grow middle slot in BOTH states —
       visibility (not display) hides its text when expanded, so the slot keeps
       filling and the ON/OFF pill stays anchored hard right regardless of
       whether a summary exists or how long it is. */
    .fx-summary {
      flex: 1; text-align: right; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums;
      visibility: hidden;
    }
    .fx-section.collapsed .fx-summary { visibility: visible; }
    /* State pill: a real control, but it renders device state only — clicks
       never flip it locally (docs/DESIGN.md). */
    .fx-state {
      font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .1em;
      padding: 2px 9px; border-radius: 9px; margin-left: auto;
      cursor: pointer; flex: none;
    }
    .fx-state.on { background: rgba(63, 185, 80, .16); color: var(--ok); border: 1px solid transparent; }
    .fx-state.off { background: transparent; color: var(--text-muted); border: 1px solid var(--line); }
    .fx-state.on:hover { background: rgba(63, 185, 80, .28); }
    .fx-state.off:hover { color: var(--text); border-color: var(--text-muted); }
    .fx-state:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
    .fx-head .fx-summary + .fx-state { margin-left: 0; }
    /* Non-interactive pill variant (kept for reuse elsewhere). */
    .fx-state.static { pointer-events: none; cursor: default; }
    /* Clavinet-D6 rocker tabs (binary params), rotated 90° to horizontal:
       cream cap in a dark recessed bezel. Consecutive tab rows fuse into one
       frame, as on the instrument. Non-interactive — stored patch data only.
       NOT the green status pills; that vocabulary belongs to section headers.
       Toggles (one label): pressed = on, raised = off. Choices (two labels):
       the tab tips toward the active side; neither side is "off". */
    .param-switch { padding: 2px 0; }
    .param-switch .param-pill-cell { grid-column: 2; justify-self: start; }
    /* No pointer-events:none here. It was correct when these were read-only
       readouts, but a later rule trying to switch it back on lost the cascade
       — same specificity, earlier in the file — so the switches stayed
       unclickable and could not even be used to enter audition mode. */
    .d6-frame {
      display: inline-flex;
      background: var(--d6-frame-bg); border: 1px solid var(--d6-frame-border); border-radius: 3px;
      padding: 3px;
    }
    .param-switch:has(+ .param-switch) .d6-frame {
      border-bottom-left-radius: 0; border-bottom-right-radius: 0;
      border-bottom-width: 0; padding-bottom: 2px;
    }
    .param-switch + .param-switch { padding-top: 0; }
    .param-switch + .param-switch .d6-frame {
      border-top-left-radius: 0; border-top-right-radius: 0; padding-top: 2px;
    }
    .d6-tab {
      display: inline-flex; border-radius: 2px; overflow: hidden;
      font-size: 10px; font-weight: 700; letter-spacing: .05em;
      min-width: 110px; justify-content: center;
    }
    /* Plain cream caps in both states; the ONE state cue beyond the subtle
       pressed depth is opacity — the deselected tab (or unchosen side) fades
       toward the background so the selection is obvious at a glance. */
    .d6-toggle {
      width: 100%; text-align: center; justify-content: center;
      padding: 3px 12px; color: #232325;
      background: linear-gradient(#f6f2e6, #dcd7c7);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 -2px 3px rgba(0, 0, 0, .18), 0 1px 1px rgba(0, 0, 0, .5);
    }
    .d6-toggle.pressed {
      background: linear-gradient(#d5d0c0, #c7c2b2);
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, .35);
      transform: translateY(.5px); color: #1a1a1c;
    }
    .d6-half {
      flex: 1; text-align: center; padding: 3px 10px; color: #232325;
      background: linear-gradient(#f6f2e6, #dcd7c7);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 -2px 3px rgba(0, 0, 0, .18);
    }
    .d6-half + .d6-half { border-left: 1px solid rgba(0, 0, 0, .28); }
    .d6-half.pressed {
      background: linear-gradient(#d0cbbb, #c4bfaf);
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, .4);
      color: #1a1a1c;
    }
    /* The one change vs the original: fade the deselected state. */
    .d6-toggle:not(.pressed), .d6-half:not(.pressed) { opacity: .5; }
    /* Bipolar bars: a centre tick marks the neutral origin; fill is absolute
       so it can grow from the centre outward. */
    .param-bar.bipolar { position: relative; }
    .param-bar.bipolar .param-bar-fill { position: absolute; top: 0; height: 100%; }
    .param-bar.bipolar::after {
      content: ''; position: absolute; left: 50.4%; top: 0; bottom: 0;
      width: 1px; background: var(--text-muted);
    }
    /* Range pair: one track, both handles; amber min→max readout when the
       range is reversed (min above max reverses the pedal action).
       Built from the same parts as an ordinary parameter row — same track,
       same fill colours, same round handle — because it IS one, read twice.
       It had its own grey fill and a pair of upright bars, which made the
       pedal look like a different kind of control than everything around it. */
    .param-rangebar {
      grid-column: 2; position: relative; height: 6px; border-radius: 3px;
      background: var(--bar); pointer-events: none;
    }
    .range-fill {
      position: absolute; top: 0; height: 100%; border-radius: 3px;
      background: var(--bar-fill);
    }
    .param.is-changed .range-fill { background: var(--bar-fill-changed); }
    /* The one deliberate difference from .param-bar-knob: these stay visible.
       A single value can be read off the length of its fill, but a range's
       ENDS are the value, and a range of nothing (min == max) would otherwise
       be an empty track. */
    .range-handle {
      position: absolute; top: 50%; width: 11px; height: 11px;
      margin-left: -5.5px; transform: translateY(-50%);
      border-radius: 50%; background: var(--bar-fill);
      box-shadow: 0 0 0 2px var(--bg);
    }
    .param.is-default .range-handle { background: var(--text-dim); }
    .param.is-changed .range-handle { background: var(--bar-fill-changed); }
    .param-value.range-reversed { color: var(--amber); font-weight: 600; }
    /* Inert parameters: dimmed with the reason inline; section-level override
       notes span the params grid. */
    .param.is-inert { opacity: .45; }
    .inert-note { font-style: italic; color: var(--text-muted); font-weight: 400; }
    .fx-inert-banner {
      grid-column: 1 / -1; margin: 8px 0 2px; padding: 6px 10px; border-radius: 4px;
      background: var(--shade); color: var(--text-muted); font-size: 12px;
    }
    /* Discrete selector (unnamed N-position params): segmented control in the
       bar column, current position filled; value cell shows 1-based pos/total.
       Non-interactive. */
    .param-seg { grid-column: 2; display: flex; gap: 2px; align-items: center; }
    .param-seg .seg { flex: 1; max-width: 14px; height: 6px; border-radius: 2px; background: var(--bar); }
    .param-seg .seg.cur { background: var(--bar-fill-changed); }
    .device-note { color: var(--text-muted); font-size: 12px; flex: none; }
    /* In enum rows the note overlays below the control (tooltip-like) so it
       never squeezes the select or shifts the row. */
    .param-enum .param-value { position: relative; }
    .param-enum .device-note {
      position: absolute; right: 0; top: 100%; margin-top: 3px; z-index: 1;
      background: var(--bg-panel); border: 1px solid var(--line);
      border-radius: 4px; padding: 2px 8px; white-space: nowrap;
    }

    /* Shared column tracks per group (subgrid): the label column sizes to the
       LONGEST label in the displayed group and every row aligns to it; the
       value column is fixed (three tabular digits, never shifts); the bar
       takes ALL remaining width. Bar start therefore differs between groups
       (engine vs each effects section) but aligns within one — intended. */
    .params {
      /* A FIXED label column. It was fit-content(46%), which sized itself to
         whichever label happened to be longest in the group on screen — so the
         bars started at 624px on a Tine Piano and 610 on a Venice, and every
         patch you clicked nudged the layout (Daniel, 2026-08-13, asking for
         fit and finish). One width for every engine and every effects
         section: the bars now start in the same place all the way down the
         panel and across patches. Long labels ellipsize (.param-label already
         clips). */
      display: grid; grid-template-columns: 116px 1fr minmax(40px, max-content);
      column-gap: 10px;
    }
    .param {
      grid-column: 1 / -1;
      display: grid; grid-template-columns: subgrid;
      align-items: center; padding: 3px 0;
    }
    .param-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* position:relative so the handle anchors to the TRACK. Without it the
       handle resolved against whatever ancestor happened to be positioned and
       floated well above the bar. */
    .param-bar {
      position: relative; height: 6px; border-radius: 3px;
      background: var(--bar); overflow: visible;
    }
    /* A 6px track is a hard thing to hit with a mouse, and hovering it is
       harder still. The bar keeps its size but claims a band above and below —
       layout untouched, only hit testing grows. */
    .param-bar::before {
      content: ''; position: absolute; left: 0; right: 0; top: -8px; bottom: -8px;
    }
    /* The mark sits ON the value, so a drag has something to aim at. It shows
       on hover only: at rest these rows are a readout, and 110 permanent dots
       would be noise. */
    .param-bar-knob {
      position: absolute; top: 50%; left: 0;
      width: 11px; height: 11px; margin-left: -5.5px;
      transform: translateY(-50%);
      border-radius: 50%; background: var(--bar-fill);
      box-shadow: 0 0 0 2px var(--bg);
      pointer-events: none; /* the track owns the drag */
      opacity: 0; transition: opacity .12s ease, box-shadow .12s ease;
    }
    /* Shown when the pointer is over the TRACK (plus its band), not anywhere
       in the row — the label and the number are far from the thing the handle
       belongs to. Live it is a drag target; idle it marks where the value
       sits, which is the only way a zero reads as a value rather than an
       empty bar. */
    .param-bar:hover .param-bar-knob { opacity: 1; }
    .param.is-default .param-bar-knob { background: var(--text-dim); }
    .param-bar-fill { display: block; height: 100%; border-radius: 3px; background: var(--bar-fill); }
    .param-value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* Enum rows: label left, dropdown right (a choice, not a magnitude).
       Two-column layout — the control column shrinks and never exceeds the
       card's inner edge, so the select's right edge lines up with the numeric
       values below it and the ON pill above it. */
    /* Enum rows share the same subgrid tracks; the control's LEFT edge sits on
       the bar column's left edge (Mode aligns with the Depth/Speed bars) and
       it sizes to its content — a control, not another bar. */
    .param-enum .param-value {
      grid-column: 2 / 4; display: flex; justify-content: flex-start; min-width: 0;
    }
    .select-wrap { position: relative; display: block; min-width: 0; max-width: 100%; }
    .param-select {
      appearance: none; -webkit-appearance: none;
      background-color: var(--bg-panel); color: var(--text);
      /* Same chevron as the section headers: 14x9, 2px stroke, text colour —
         one chevron style app-wide. Inside the control at its right edge.
         The stroke is baked into the data URI, so it needs a colour per
         theme: --chevron carries it, and both palettes set it alongside
         --text. A single hardcoded light stroke was invisible in light mode. */
      background-image: var(--select-chevron);
      background-repeat: no-repeat; background-position: right 8px center;
      border: 1px solid var(--line); border-radius: 4px;
      font: inherit; font-size: 12px; line-height: 1.3;
      padding: 1px 30px 1px 8px; /* row-height match; right pad clears chevron */
      cursor: pointer;
      width: auto; max-width: 240px; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .param-select:hover { border-color: var(--text-muted); }
    /* Accent ring on keyboard focus only — app.js blurs after a reverted
       change so the ring never lingers as a false selected/error state. */
    .param-select:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
    .param.is-default .param-select { color: var(--text-muted); }
    .param-value em { font-style: normal; color: var(--text-dim); margin-left: 4px; }
    /* Default vs changed: default is muted, changed is primary. */
    .param.is-default .param-label,
    .param.is-default .param-value { color: var(--text-muted); }
    .param.is-changed .param-label,
    .param.is-changed .param-value { color: var(--text); font-weight: 600; }
    .param.is-changed .param-bar-fill { background: var(--bar-fill-changed); }
  </style>
</head>
<body>
  <div id="panel-strip"></div>
  <div id="connection-row">
    <span class="conn-status">
      <span class="conn-dot"></span>
      <span id="connection-text">No instrument connected</span>
    </span>
    <!-- Appearance sits on the divider itself: it belongs to neither region,
         and the aluminium strip is the seam between them. -->
    <div id="theme-toggle" role="group" aria-label="Appearance">
      <button type="button" data-theme-set="light">light</button>
      <button type="button" data-theme-set="dark">dark</button>
    </div>
    <span class="conn-actions">
      <button id="sounds-button" type="button" hidden>24 sounds</button>
      <button id="backup-button" type="button" hidden>Back up instrument</button>
      <button id="conn-button" type="button">Connect</button>
      <button id="settings-button" type="button" title="The Seven’s own settings">Settings</button>
    </span>
    <!-- Expansion visibility: what THIS unit has installed, per the sound
         table read on connect. Sound ids are unit-specific; the fingerprint
         is what backups reference. -->
    <!-- The instrument's own global options. Nine slots, three of them with a
         verified meaning; see seven-midi.js PINNED_GLOBALS. -->
    <div id="settings-panel" hidden>
      <div class="settings-head">Instrument settings</div>
      <div class="settings-rows"></div>
      <div class="settings-foot"></div>
    </div>
    <div id="sounds-panel" hidden>
      <div class="sounds-cols"></div>
      <div class="sounds-foot"></div>
    </div>
  </div>
  <div id="main">
    <div id="library">
      <!-- Two labelled regions teach the core relationship: the four banks
           mirror what's ON THE SEVEN; the Library is files ON THIS COMPUTER.
           Transfer means moving between them, so BOTH stay visible at all
           times — when the Library expands, the bank rows collapse to a
           one-line summary strip (never hidden). -->
      <div class="region-head" id="seven-head">On the Seven</div>
      <div id="bank-tabs"></div>
      <div id="patch-list"></div>
      <!-- Collapsed, the bank region reads exactly like the collapsed library
           header: chevron, region name, then its one-line summary. Its own
           region-head is hidden so there is only ever one title line. -->
      <button type="button" id="bank-strip" title="Show the bank presets">
        <span class="fx-chevron strip-chevron"><svg viewBox="0 0 14 9" width="14" height="9" aria-hidden="true"><path d="M2 2 L7 7 L12 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="fx-title">On the Seven</span>
        <span id="bank-strip-label" class="lib-count"></span>
        <span id="bank-strip-asof" class="strip-asof"></span>
      </button>
      <!-- Drag handle between the regions; the split persists across
           launches. Active only while the Library is expanded. -->
      <div id="split-divider" title="Drag to resize the Library"></div>
      <!-- Library: a collapsible section directly after the 8th bank row.
           Reuses the effects-section disclosure component (fx-section /
           fx-head / fx-body classes: same chevron, same animation) but NEVER
           the bypass-dimming rule — bypass has no meaning here. Global: the
           same Library renders under every bank. -->
      <div id="library-section" class="fx-section collapsed">
        <div class="fx-head" id="library-head" role="button" title="Toggle Library">
          <span class="fx-chevron"><svg viewBox="0 0 14 9" width="14" height="9" aria-hidden="true"><path d="M2 2 L7 7 L12 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="fx-title">On this computer</span>
          <span id="library-count" class="lib-count"></span>
          <button type="button" id="library-reveal" class="lib-reveal" title="Open the library folder in Finder">Open Library Folder</button>
        </div>
        <div class="fx-body"><div class="fx-body-inner">
          <div id="library-body"></div>
        </div></div>
      </div>
    </div>
    <div id="detail"><div class="placeholder">Select a patch</div></div>
  </div>
  <script src="defaults.js"></script>
  <script src="renderer.js"></script>
  <script src="panel-mini.js"></script>
    <script src="toast.js"></script>
    <script src="audition.js"></script>
    <script src="undo.js"></script>
    <script src="scroll-fade.js"></script>
    <script src="modal.js"></script>
    <script src="sound-art.js"></script>
    <script src="key-range.js"></script>
    <script src="picker.js"></script>
    <script src="library-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
