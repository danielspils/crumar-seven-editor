<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
  <title>Crumar Seven Editor</title>
  <style>
    :root {
      --bg: #141416;
      --bg-raised: #1c1c1f;
      --bg-panel: #232326;
      --line: #2e2e33;
      --text: #e8e8ea;
      --text-muted: #77777d;
      --text-dim: #4c4c52;
      --accent: #ff3b30;      /* panel LED red */
      --amber: #ffb020;
      --warn: #d9a13b;
      --sampled: #4fc3d9;
      --modeled: #9a8fd9;
      --bar: #3a3a3f;
      --bar-fill: #8e8e96;
      --bar-fill-changed: #d9d9de;
      --ok: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* The window itself never scrolls: the panel strip is a fixed reference at
       the top, and only the two columns below scroll, independently. A root
       scrollbar could otherwise shift the whole UI when sections expand. */
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      /* Inter is self-hosted (registered by app.js via data: URI); the panel
         strip alone uses Archivo inside the SVG. */
      font: 13px/1.45 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column;
      user-select: none;
    }

    /* 1. Panel strip */
    #panel-strip { background: #202022; border-bottom: 1px solid var(--line); }
    #panel-strip svg { display: block; width: 100%; height: auto; max-height: 150px; }
    /* The SVG's readonly class disables all controls; selectively re-enable the
       bank button and preset buttons — they drive the same state as the tabs. */
    /* Full-button hit targets: the transparent .btn-hit rect (drawn last,
       sized to the bezel) is the only element that takes clicks — the readonly
       rule keeps suppressing the faces beneath. Hover brightens the face via
       :has() since the overlay sits above it. */
    #panel-strip .btn-hit { pointer-events: auto; cursor: pointer; }
    #panel-strip g:has(.btn-hit:hover) .btn-face:not(.on) { fill: #2b2b2e; }
    #panel-strip g:has(.btn-hit:hover) .btn-bezel { fill: #1e1e20; }
    /* Momentary press state — BANK only (presets have a persistent selected
       state instead). app.js drives .bank-pressed with a ~150ms minimum hold
       so a quick click still reads as intentional, then keeps it while held.
       Press-down is instant (transition: none while pressed); release settles
       via a 120ms fade. */
    #panel-strip g:has([data-hit="bank"]) #btn-bank,
    #panel-strip g:has([data-hit="bank"]) .btn-inset { transition: fill 120ms; }
    #panel-strip g.bank-pressed #btn-bank { fill: #141416; transition: none; }
    #panel-strip g.bank-pressed .btn-inset { fill: #232325; transition: none; }
    /* Mapped knobs are click targets for navigation only (strip stays readonly;
       knobs are clickable, never draggable). The transparent .knob-hit circle —
       drawn last, radius of the outer ring — is the ONLY element that takes
       pointer events, so the readonly rule keeps suppressing the face/pointer.
       Unmapped elements get no cursor or hover. app.js tags mapped knob groups
       with .nav-knob. */
    #panel-strip .knob-hit { pointer-events: none; }
    #panel-strip .nav-knob .knob-hit { pointer-events: auto; cursor: pointer; }
    #panel-strip .nav-knob .knob-ring { transition: stroke .3s; }
    #panel-strip .nav-knob .knob-face { transition: stroke .3s, fill .3s; }
    /* One treatment per annulus: the outer ring belongs to the FOCUSED knob
       only (its section expanded). At rest there is no ring at all; hover
       shows the same ring dimmed so clickability stays discoverable. The lit
       cue lives on the face (amber fill+outline) and never uses the annulus. */
    #panel-strip .nav-knob:not(.nav-ring):hover .knob-ring { stroke: rgba(255, 59, 48, .35); }
    /* Two distinct, stackable knob cues (docs/DESIGN.md):
       LIT (effect on, patch data)  = amber cap fill + amber outline + dark
                                      pointer. ID-prefixed so the SVG's own
                                      .knob-face rule can't override the fill.
       EXPANDED (view state)        = accent OUTER RING only — never the face,
                                      so it can't be mistaken for amber. */
    #panel-strip .knob-lit .knob-face { fill: #ffd9a0; stroke: #ff9d2e; }
    #panel-strip .knob-lit .knob-ptr { stroke: #1a1a1c; }
    #panel-strip .nav-ring .knob-ring { stroke: var(--accent); stroke-width: 3; }

    /* 2. Connection row */
    #connection-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: var(--bg-raised); border-bottom: 1px solid var(--line);
      color: var(--text-muted); font-size: 12px;
    }
    #connection-row .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim);
    }

    /* Main area: library left, detail right */
    #main { flex: 1; display: flex; min-height: 0; }

    /* 3. Library */
    #library {
      width: 480px; min-width: 400px;
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0;
    }
    #bank-tabs { display: flex; border-bottom: 1px solid var(--line); }
    /* Subtle tabs: selection is carried by the same raised background as a
       selected patch row — no tab outline, no radius. The amber underline is
       text-width (on the label span), so it doesn't stack with the patch row's
       full-width red edge marker. All four tabs are identical when unselected. */
    .bank-tab {
      flex: 1; padding: 9px 0 7px; text-align: center;
      background: transparent; border: none;
      color: var(--text-muted); font: inherit; font-weight: 600; letter-spacing: .08em;
      cursor: pointer;
    }
    .bank-tab:hover { color: var(--text); }
    .bank-tab-label { display: inline-block; padding-bottom: 3px; border-bottom: 2px solid transparent; }
    .bank-tab.active { background: var(--bg-panel); color: var(--amber); }
    .bank-tab.active .bank-tab-label { border-bottom-color: var(--amber); }
    /* The eight bank rows are always fully visible — they never scroll out of
       view when the Library opens; the Library body scrolls internally. */
    #patch-list { flex: none; }
    .patch-row {
      display: grid; grid-template-columns: 28px 1fr 1fr auto auto;
      gap: 10px; align-items: center;
      width: 100%; padding: 9px 14px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    .patch-row:hover { background: var(--bg-raised); }
    .patch-row.selected { background: var(--bg-panel); box-shadow: inset 3px 0 0 var(--accent); }
    .patch-num { color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .patch-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .patch-sound { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge {
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      padding: 2px 7px; border-radius: 9px; white-space: nowrap;
    }
    .badge-modeled { color: var(--modeled); border: 1px solid var(--modeled); }
    .badge-sampled { color: var(--sampled); border: 1px solid var(--sampled); }
    .badge-warn { color: #16130b; background: var(--warn); }
    .badge-gap { width: 0; }

    /* 3a. Two-region model: "On the Seven" (banks) above, "On this computer"
       (Library) below. The regions expand mutually exclusively — app.js
       toggles .lib-open on #library — but the bank region is NEVER fully
       hidden: it collapses to a one-line summary strip (current bank +
       selected preset) so the instrument↔computer relationship stays on
       screen, and transfer always has a visible target. */
    .region-head {
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-muted); padding: 8px 14px 4px;
    }
    #bank-strip {
      display: none; /* visible only while the Library is expanded */
      width: 100%; align-items: center; gap: 8px;
      padding: 8px 14px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    #bank-strip:hover { background: var(--bg-raised); }
    #bank-strip .strip-chevron { transform: rotate(-90deg); }
    #bank-strip-label { font-weight: 600; }
    #library.lib-open #bank-tabs, #library.lib-open #patch-list { display: none; }
    #library.lib-open #bank-strip { display: flex; }
    /* Drag handle between the regions. Only meaningful while the Library is
       open; the chosen split persists across launches (app.js). */
    #split-divider { display: none; height: 5px; cursor: row-resize; flex: none; position: relative; }
    #split-divider::after {
      content: ''; position: absolute; left: 50%; top: 2px; width: 44px; height: 3px;
      transform: translateX(-50%); border-radius: 2px; background: var(--line);
    }
    #split-divider:hover::after { background: var(--text-muted); }
    #library.lib-open #split-divider { display: block; }

    /* 3b. Library section — reuses the fx-section disclosure (chevron,
       header hover, grid-rows collapse animation) but sits full-width in the
       library column: no side borders, no radius, visually distinct from the
       indented bank rows above. The dimming rule is NOT reused. */
    #library-section {
      margin: 0; border-left: none; border-right: none; border-radius: 0;
      border-top: 1px solid var(--line);
      padding: 8px 10px;
      min-height: 0; overflow: hidden;
    }
    /* Expanded, the section flexes into the REMAINING column space and the
       list scrolls inside whatever fits — the section must never run past
       the window edge (that clipped the slot view to two visible rows).
       Scoped to expanded so a collapsed section still shrinks to its header.
       Tradeoff: the height half of the open animation is skipped for this
       section (the body snaps to the flexed size; the opacity fade
       remains). */
    #library-section:not(.collapsed) { display: flex; flex-direction: column; flex: 0 1 auto; }
    #library-section:not(.collapsed) .fx-head { flex: none; }
    #library-section:not(.collapsed) .fx-body { flex: 0 1 auto; min-height: 0; }
    #library-body { display: flex; flex-direction: column; min-height: 0; height: 100%; }
    #library-body .lib-bar { flex: none; }
    #library-body .lib-list { flex: 0 1 auto; min-height: 0; }
    .lib-count { flex: 1; color: var(--text-muted); font-size: 12px; }
    .lib-reveal {
      font: inherit; font-size: 11px; color: var(--text-muted);
      background: transparent; border: 1px solid var(--line); border-radius: 4px;
      padding: 2px 8px; cursor: pointer; flex: none;
    }
    .lib-reveal:hover { color: var(--text); border-color: var(--text-muted); }
    .lib-bar { display: flex; gap: 8px; align-items: center; padding: 8px 2px 8px; }
    .lib-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; flex: none; }
    .seg-btn {
      font: inherit; font-size: 11px; font-weight: 600;
      background: transparent; border: none; color: var(--text-muted);
      padding: 3px 10px; cursor: pointer;
    }
    .seg-btn + .seg-btn { border-left: 1px solid var(--line); }
    .seg-btn.active { background: var(--bg-panel); color: var(--amber); }
    .seg-btn:hover:not(.active) { color: var(--text); }
    .lib-search {
      flex: 1; min-width: 0; font: inherit; font-size: 12px;
      background: var(--bg-panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px;
    }
    .lib-search:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
    /* The list is the internal scroller — fixed max height so the bank rows
       above never leave the viewport. The scrollbar is ALWAYS visible
       (custom-drawn, so macOS overlay hiding doesn't apply): without it, a
       320px viewport over 32 rows silently reads as "11 patches, the end". */
    .lib-list { max-height: 320px; overflow-y: auto; scrollbar-gutter: stable; }
    .lib-list::-webkit-scrollbar { width: 10px; }
    .lib-list::-webkit-scrollbar-track { background: transparent; }
    .lib-list::-webkit-scrollbar-thumb {
      background: var(--bar); border-radius: 5px;
      border: 2px solid var(--bg); background-clip: padding-box;
    }
    .lib-list::-webkit-scrollbar-thumb:hover { background: var(--bar-fill); }
    .lib-row {
      display: grid; grid-template-columns: 1fr 1fr auto auto;
      gap: 10px; align-items: center;
      width: 100%; padding: 7px 6px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    .lib-row:hover { background: var(--bg-raised); }
    /* Selected library patch wears the same red edge marker as a selected
       bank row — one vocabulary for "selected patch" (docs/DESIGN.md). */
    .lib-row.selected, .lib-slot-patch.selected { background: var(--bg-panel); box-shadow: inset 3px 0 0 var(--accent); }
    .lib-row-invalid { opacity: .55; cursor: default; }
    .lib-rename-input {
      font: inherit; font-weight: 600; color: var(--text);
      background: var(--bg); border: 1px solid var(--amber); border-radius: 3px;
      padding: 1px 5px; min-width: 0;
    }
    .lib-empty { color: var(--text-dim); padding: 18px 8px; text-align: center; }
    /* Stacked name + origin line in library rows. */
    .name-cell { display: flex; flex-direction: column; min-width: 0; }
    .name-cell .patch-name { min-width: 0; }
    .lib-origin {
      font-size: 11px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* When the user has dragged the split, app.js sets --lib-split (px) on
       #library; the list honors it up to the available space. */
    #library.lib-open .lib-list { max-height: var(--lib-split, 320px); }
    .lib-set-chev { color: var(--text-dim); font-size: 15px; }
    .lib-set-head {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 2px 8px; color: var(--text-muted);
    }
    .lib-back {
      font: inherit; font-size: 11px; color: var(--text-muted);
      background: transparent; border: 1px solid var(--line); border-radius: 4px;
      padding: 2px 8px; cursor: pointer;
    }
    .lib-back:hover { color: var(--text); border-color: var(--text-muted); }
    .lib-set-name { font-weight: 600; color: var(--text); }
    .lib-slot {
      display: grid; grid-template-columns: 24px 1fr 1fr auto auto;
      gap: 10px; align-items: center;
      width: 100%; padding: 7px 6px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left;
    }
    .lib-slot-patch { cursor: pointer; }
    .lib-slot-patch:hover { background: var(--bg-raised); }
    .slot-num { color: var(--text-dim); font-variant-numeric: tabular-nums; }
    /* Empty and missing-file slots are distinct at a glance: empty is quiet,
       missing carries the warning treatment. */
    .lib-slot-empty .slot-text { color: var(--text-dim); font-style: italic; }
    .lib-slot-missing .slot-text { color: var(--warn); }

    /* 4. Detail */
    /* min-width 0 lets the column shrink instead of overflowing #main
       horizontally; the stable gutter keeps content width constant whether or
       not a classic scrollbar is showing. */
    #detail { flex: 1; min-width: 0; overflow-y: auto; scrollbar-gutter: stable; padding: 16px 20px; }
    #detail .placeholder { color: var(--text-dim); padding: 40px; text-align: center; }
    .detail-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .col-title {
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 10px;
      /* Centered over each column's own width (bank tabs stay left-aligned —
         they're a tab strip, not a column header). */
      text-align: center;
    }

    .engine-head { margin-bottom: 12px; }
    .engine-sound { font-size: 17px; font-weight: 700; }
    .engine-sound .badge { vertical-align: 3px; margin-left: 6px; }
    .engine-sub { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .engine-group { color: var(--text-muted); font-size: 12px; }
    .engine-pos { color: var(--text-dim); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .warn-banner {
      margin-top: 10px; padding: 8px 10px; border-radius: 4px;
      background: rgba(217, 161, 59, .12); border: 1px solid var(--warn);
      color: var(--warn); font-size: 12px;
    }

    .fx-section {
      border: 1px solid var(--line); border-radius: 6px;
      padding: 10px 12px; margin-bottom: 12px;
      background: var(--bg-raised);
    }
    /* Transient open-confirmation: a brief accent tint fading out. No left
       edge bar — that colour belongs to the library's selected-patch marker.
       The persistent "expanded" cue is the accent ring on the knob. */
    @keyframes nav-tint {
      from { background-color: rgba(255, 59, 48, .10); }
      to { background-color: var(--bg-raised); }
    }
    .fx-section.nav-flash { animation: nav-tint 1.2s ease-out; }
    .fx-section.dimmed { opacity: .38; }
    /* Headers are clickable toggles; collapse state is view state only. The
       whole row is the click target, with a hover state to say so. */
    .fx-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 0;
      cursor: pointer; border-radius: 4px; padding: 2px 4px; margin-left: -4px; margin-right: -4px;
    }
    .fx-head:hover { background: rgba(255, 255, 255, .045); }
    /* Flex-centred box around a geometric SVG chevron: vertically centred on
       the header text's midline in both states (a font glyph's ink sat below
       centre regardless of box alignment). */
    .fx-chevron {
      color: var(--text); width: 24px; flex: none;
      display: flex; align-items: center; justify-content: center;
      transition: transform 180ms ease-out;
    }
    .fx-chevron svg { display: block; }
    .fx-section.collapsed .fx-chevron { transform: rotate(-90deg); transition-duration: 140ms; }
    /* Expand/collapse animates the body's grid row 0fr↔1fr (height 0↔auto);
       content fades in slightly behind the container getting room. The body is
       always in the DOM — app.js toggles the class without re-rendering. */
    .fx-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 180ms ease-out; }
    .fx-section.collapsed .fx-body { grid-template-rows: 0fr; transition-duration: 140ms; }
    .fx-body-inner {
      min-height: 0; overflow: hidden;
      opacity: 1; transition: opacity 120ms ease-out 40ms;
    }
    .fx-section.collapsed .fx-body-inner { opacity: 0; transition: opacity 100ms ease-in; }
    .fx-body-inner .params { padding-top: 8px; }
    @media (prefers-reduced-motion: reduce) {
      .fx-body, .fx-body-inner, .fx-chevron { transition: none !important; }
      .fx-section.nav-flash { animation: none; }
    }
    /* Uppercase + tracking is reserved for section headers (matches .col-title). */
    .fx-title { font-weight: 700; letter-spacing: .09em; text-transform: uppercase; font-size: 11px; }
    /* The summary is the header's flex-grow middle slot in BOTH states —
       visibility (not display) hides its text when expanded, so the slot keeps
       filling and the ON/OFF pill stays anchored hard right regardless of
       whether a summary exists or how long it is. */
    .fx-summary {
      flex: 1; text-align: right; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums;
      visibility: hidden;
    }
    .fx-section.collapsed .fx-summary { visibility: visible; }
    /* State pill: a real control, but it renders device state only — clicks
       never flip it locally (docs/DESIGN.md). */
    .fx-state {
      font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .1em;
      padding: 2px 9px; border-radius: 9px; margin-left: auto;
      cursor: pointer; flex: none;
    }
    .fx-state.on { background: rgba(63, 185, 80, .16); color: var(--ok); border: 1px solid transparent; }
    .fx-state.off { background: transparent; color: var(--text-muted); border: 1px solid var(--line); }
    .fx-state.on:hover { background: rgba(63, 185, 80, .28); }
    .fx-state.off:hover { color: var(--text); border-color: var(--text-muted); }
    .fx-state:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
    .fx-head .fx-summary + .fx-state { margin-left: 0; }
    /* Non-interactive pill variant (kept for reuse elsewhere). */
    .fx-state.static { pointer-events: none; cursor: default; }
    /* Clavinet-D6 rocker tabs (binary params), rotated 90° to horizontal:
       cream cap in a dark recessed bezel. Consecutive tab rows fuse into one
       frame, as on the instrument. Non-interactive — stored patch data only.
       NOT the green status pills; that vocabulary belongs to section headers.
       Toggles (one label): pressed = on, raised = off. Choices (two labels):
       the tab tips toward the active side; neither side is "off". */
    .param-switch { padding: 2px 0; }
    .param-switch .param-pill-cell { grid-column: 2; justify-self: start; }
    .d6-frame {
      display: inline-flex; pointer-events: none;
      background: #101012; border: 1px solid #000; border-radius: 3px;
      padding: 3px;
    }
    .param-switch:has(+ .param-switch) .d6-frame {
      border-bottom-left-radius: 0; border-bottom-right-radius: 0;
      border-bottom-width: 0; padding-bottom: 2px;
    }
    .param-switch + .param-switch { padding-top: 0; }
    .param-switch + .param-switch .d6-frame {
      border-top-left-radius: 0; border-top-right-radius: 0; padding-top: 2px;
    }
    .d6-tab {
      display: inline-flex; border-radius: 2px; overflow: hidden;
      font-size: 10px; font-weight: 700; letter-spacing: .05em;
      min-width: 110px; justify-content: center;
    }
    /* Plain cream caps in both states; the ONE state cue beyond the subtle
       pressed depth is opacity — the deselected tab (or unchosen side) fades
       toward the background so the selection is obvious at a glance. */
    .d6-toggle {
      width: 100%; text-align: center; justify-content: center;
      padding: 3px 12px; color: #232325;
      background: linear-gradient(#f6f2e6, #dcd7c7);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 -2px 3px rgba(0, 0, 0, .18), 0 1px 1px rgba(0, 0, 0, .5);
    }
    .d6-toggle.pressed {
      background: linear-gradient(#d5d0c0, #c7c2b2);
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, .35);
      transform: translateY(.5px); color: #1a1a1c;
    }
    .d6-half {
      flex: 1; text-align: center; padding: 3px 10px; color: #232325;
      background: linear-gradient(#f6f2e6, #dcd7c7);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 -2px 3px rgba(0, 0, 0, .18);
    }
    .d6-half + .d6-half { border-left: 1px solid rgba(0, 0, 0, .28); }
    .d6-half.pressed {
      background: linear-gradient(#d0cbbb, #c4bfaf);
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, .4);
      color: #1a1a1c;
    }
    /* The one change vs the original: fade the deselected state. */
    .d6-toggle:not(.pressed), .d6-half:not(.pressed) { opacity: .5; }
    /* Bipolar bars: a centre tick marks the neutral origin; fill is absolute
       so it can grow from the centre outward. */
    .param-bar.bipolar { position: relative; }
    .param-bar.bipolar .param-bar-fill { position: absolute; top: 0; height: 100%; }
    .param-bar.bipolar::after {
      content: ''; position: absolute; left: 50.4%; top: 0; bottom: 0;
      width: 1px; background: var(--text-muted);
    }
    /* Range pair: one track, both handles; amber min→max readout when the
       range is reversed (min above max reverses the pedal action). */
    .param-rangebar {
      grid-column: 2; position: relative; height: 6px; border-radius: 3px;
      background: var(--bar); pointer-events: none;
    }
    .range-fill { position: absolute; top: 0; height: 100%; background: var(--bar-fill); }
    .range-handle {
      position: absolute; top: -3px; width: 4px; height: 12px; border-radius: 2px;
      background: var(--bar-fill-changed); transform: translateX(-50%);
    }
    .param-value.range-reversed { color: var(--amber); font-weight: 600; }
    /* Inert parameters: dimmed with the reason inline; section-level override
       notes span the params grid. */
    .param.is-inert { opacity: .45; }
    .inert-note { font-style: italic; color: var(--text-muted); font-weight: 400; }
    .fx-inert-banner {
      grid-column: 1 / -1; margin: 8px 0 2px; padding: 6px 10px; border-radius: 4px;
      background: rgba(255, 255, 255, .04); color: var(--text-muted); font-size: 12px;
    }
    /* Discrete selector (unnamed N-position params): segmented control in the
       bar column, current position filled; value cell shows 1-based pos/total.
       Non-interactive. */
    .param-seg { grid-column: 2; display: flex; gap: 2px; align-items: center; pointer-events: none; }
    .param-seg .seg { flex: 1; max-width: 14px; height: 6px; border-radius: 2px; background: var(--bar); }
    .param-seg .seg.cur { background: var(--bar-fill-changed); }
    .device-note { color: var(--text-muted); font-size: 11px; flex: none; }
    /* In enum rows the note overlays below the control (tooltip-like) so it
       never squeezes the select or shifts the row. */
    .param-enum .param-value { position: relative; }
    .param-enum .device-note {
      position: absolute; right: 0; top: 100%; margin-top: 3px; z-index: 1;
      background: var(--bg-panel); border: 1px solid var(--line);
      border-radius: 4px; padding: 2px 8px; white-space: nowrap;
    }

    /* Shared column tracks per group (subgrid): the label column sizes to the
       LONGEST label in the displayed group and every row aligns to it; the
       value column is fixed (three tabular digits, never shifts); the bar
       takes ALL remaining width. Bar start therefore differs between groups
       (engine vs each effects section) but aligns within one — intended. */
    .params {
      display: grid; grid-template-columns: max-content 1fr 40px;
      column-gap: 10px;
    }
    .param {
      grid-column: 1 / -1;
      display: grid; grid-template-columns: subgrid;
      align-items: center; padding: 3px 0;
    }
    .param-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .param-bar { height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; }
    .param-bar-fill { display: block; height: 100%; background: var(--bar-fill); }
    .param-value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* Enum rows: label left, dropdown right (a choice, not a magnitude).
       Two-column layout — the control column shrinks and never exceeds the
       card's inner edge, so the select's right edge lines up with the numeric
       values below it and the ON pill above it. */
    /* Enum rows share the same subgrid tracks; the control's LEFT edge sits on
       the bar column's left edge (Mode aligns with the Depth/Speed bars) and
       it sizes to its content — a control, not another bar. */
    .param-enum .param-value {
      grid-column: 2 / 4; display: flex; justify-content: flex-start; min-width: 0;
    }
    .select-wrap { position: relative; display: block; min-width: 0; max-width: 100%; }
    .param-select {
      appearance: none; -webkit-appearance: none;
      background-color: var(--bg-panel); color: var(--text);
      /* Same chevron as the section headers: 14x9, 2px stroke, text colour —
         one chevron style app-wide. Inside the control at its right edge. */
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 9" width="14" height="9"><path d="M2 2 L7 7 L12 2" fill="none" stroke="%23e8e8ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      background-repeat: no-repeat; background-position: right 8px center;
      border: 1px solid var(--line); border-radius: 4px;
      font: inherit; font-size: 12px; line-height: 1.3;
      padding: 1px 30px 1px 8px; /* row-height match; right pad clears chevron */
      cursor: pointer;
      width: auto; max-width: 240px; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .param-select:hover { border-color: var(--text-muted); }
    /* Accent ring on keyboard focus only — app.js blurs after a reverted
       change so the ring never lingers as a false selected/error state. */
    .param-select:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
    .param.is-default .param-select { color: var(--text-muted); }
    .param-value em { font-style: normal; color: var(--text-dim); margin-left: 4px; }
    /* Default vs changed: default is muted, changed is primary. */
    .param.is-default .param-label,
    .param.is-default .param-value { color: var(--text-muted); }
    .param.is-changed .param-label,
    .param.is-changed .param-value { color: var(--text); font-weight: 600; }
    .param.is-changed .param-bar-fill { background: var(--bar-fill-changed); }
  </style>
</head>
<body>
  <div id="panel-strip"></div>
  <div id="connection-row">
    <span class="conn-dot"></span>
    <span id="connection-text">No instrument connected</span>
  </div>
  <div id="main">
    <div id="library">
      <!-- Two labelled regions teach the core relationship: the four banks
           mirror what's ON THE SEVEN; the Library is files ON THIS COMPUTER.
           Transfer means moving between them, so BOTH stay visible at all
           times — when the Library expands, the bank rows collapse to a
           one-line summary strip (never hidden). -->
      <div class="region-head" id="seven-head">On the Seven</div>
      <div id="bank-tabs"></div>
      <div id="patch-list"></div>
      <button type="button" id="bank-strip" title="Show the bank presets">
        <span class="fx-chevron strip-chevron"><svg viewBox="0 0 14 9" width="14" height="9" aria-hidden="true"><path d="M2 2 L7 7 L12 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span id="bank-strip-label">Bank 1</span>
      </button>
      <!-- Drag handle between the regions; the split persists across
           launches. Active only while the Library is expanded. -->
      <div id="split-divider" title="Drag to resize the Library"></div>
      <!-- Library: a collapsible section directly after the 8th bank row.
           Reuses the effects-section disclosure component (fx-section /
           fx-head / fx-body classes: same chevron, same animation) but NEVER
           the bypass-dimming rule — bypass has no meaning here. Global: the
           same Library renders under every bank. -->
      <div id="library-section" class="fx-section collapsed">
        <div class="fx-head" id="library-head" role="button" title="Toggle Library">
          <span class="fx-chevron"><svg viewBox="0 0 14 9" width="14" height="9" aria-hidden="true"><path d="M2 2 L7 7 L12 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="fx-title">On this computer</span>
          <span id="library-count" class="lib-count"></span>
          <button type="button" id="library-reveal" class="lib-reveal" title="Reveal the library folder in Finder">Reveal Library Folder</button>
        </div>
        <div class="fx-body"><div class="fx-body-inner">
          <div id="library-body"></div>
        </div></div>
      </div>
    </div>
    <div id="detail"><div class="placeholder">Select a patch</div></div>
  </div>
  <script src="defaults.js"></script>
  <script src="renderer.js"></script>
  <script src="library-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
