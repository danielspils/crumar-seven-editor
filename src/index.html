      background: var(--bg-raised); border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    #notes-strip[hidden] { display: none; }
    #notes-strip-open {
      flex: 1 1 auto; min-width: 0; text-align: left;
      background: none; border: none; padding: 0;
      font: inherit; color: var(--text-muted); cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #notes-strip-open:hover { color: var(--text); text-decoration: underline; }
    #notes-strip-close {
      flex: none; width: 20px; height: 20px;
      background: none; border: none; border-radius: 4px;
      color: var(--text-dim); font-size: 15px; line-height: 1; cursor: pointer;
    }
    #notes-strip-close:hover { color: var(--text); }

    #undo-toast {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, calc(-50% + 8px));
      z-index: 80; pointer-events: none;
      background: var(--bg-panel); color: var(--text);
      border: 1px solid var(--line); border-left: 3px solid var(--action);
      border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600;
      box-shadow: 0 10px 26px rgba(0, 0, 0, .4);
      opacity: 0; transition: opacity .15s ease, transform .15s ease;
    }
    #undo-toast.shown { opacity: 1; transform: translate(-50%, -50%); }
    /* Work in progress rather than a result: the action colour on both edges
       and a quiet pulse, so it reads as "hold on" instead of "done". Same
       position as any other message — only the treatment differs. */
    #undo-toast.is-busy {
      padding: 14px 24px; font-size: 13px;
      border-left-color: var(--action); border-right: 3px solid var(--action);
    }
    #undo-toast.is-busy.shown { transform: translate(-50%, -50%); }
    #undo-toast.is-busy::after {
      content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 8px;
      border-radius: 50%; background: var(--action); vertical-align: middle;
      animation: toast-pulse 1s ease-in-out infinite;
    }
    @keyframes toast-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

    /* In-app modal (src/modal.js): the app's own voice for moments that are
       about how the instrument behaves, rather than the OS asking a question. */
    .seven-modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(0, 0, 0, .5);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .seven-modal {
      position: relative;
      width: min(440px, 92vw);
      background: var(--bg-panel); color: var(--text);
      border: 1px solid var(--line); border-top: 4px solid var(--action);
      border-radius: 8px; padding: 20px 22px 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
    }
    .seven-modal.is-warning { border-top-color: var(--accent); }
    .seven-modal-title { font-size: 15px; font-weight: 700; line-height: 1.35; }
    /* A title is already 700, so emphasis inside one cannot be weight. --amber
       is what the ACTIVE TAB LABEL wears, which is the point: the heading names
       a tab the player can go and click, and the word looks like the thing it
       names. */
    .seven-modal-title strong { color: var(--amber); }
    .seven-modal-body { margin-top: 10px; color: var(--text-muted); font-size: 13px; line-height: 1.5; }
    .seven-modal-body p { margin: 0 0 9px; }
    .seven-modal-body p:last-child { margin-bottom: 0; }
    .seven-modal-actions { display: flex; justify-content: center; margin-top: 18px; }
    .seven-modal-ok {
      font: inherit; font-size: 12px; font-weight: 600;
      border-radius: 5px; padding: 6px 14px; cursor: pointer;
    }
    /* Dismiss lives in the corner so the action below stands alone. */
    .seven-modal-cancel {
      position: absolute; top: 10px; right: 10px;
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0;
      color: var(--text-dim); background: none; border: none; border-radius: 4px;
    }
    .seven-modal-cancel:hover { color: var(--text); background: var(--shade-hard); }
    .seven-modal-title { padding-right: 28px; }
    .seven-modal-ok {
      color: var(--action-ink); background: var(--action); border: 1px solid var(--action);
    }
    .seven-modal-second {
      font: inherit; font-size: 12px; font-weight: 600;
      color: var(--text-muted); background: none;
      border: 1px solid var(--line); border-radius: 5px;
      padding: 7px 14px; cursor: pointer;
    }
    .seven-modal-second:hover { color: var(--text); border-color: var(--text-muted); }
    /* TWO ANSWERS AT EQUAL WEIGHT, for a question with no sensible default.
       The filled treatment says "this is the action"; where both choices are
       real — keep what you made, or play what the file says — leaning on one
       of them is the modal answering for the reader. Same outlined weight as
       the secondary, so neither reads as the way out. */
    .seven-modal.is-equal .seven-modal-ok {
      color: var(--text-muted); background: none; border: 1px solid var(--line);
      padding: 7px 14px;
    }
    .seven-modal.is-equal .seven-modal-ok:hover {
      color: var(--text); border-color: var(--text-muted);
    }
    /* Declining, when it deserves a button rather than the corner X. Same
       outlined weight as the secondary — the filled one is the action. */
    .seven-modal-deny {
      font: inherit; font-size: 12px; font-weight: 600;
      color: var(--text-muted); background: none;
      border: 1px solid var(--line); border-radius: 5px;
      padding: 7px 14px; cursor: pointer;
    }
    .seven-modal-deny:hover { color: var(--text); border-color: var(--text-muted); }
    .seven-modal-deny:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .seven-modal-actions { gap: 8px; }

    /* The transfer confirm reads as a movement — this, into that — so it is
       centred and stacked rather than set as prose. TRANSFER is a region
       header in the app's own vocabulary (uppercase, letterspaced, dim), not a
       heading competing with the two names it introduces: what is moving and
       where it lands are the largest things here, at the same size the engine
       gives a sound's name. */
    .seven-modal.is-transfer .seven-modal-title {
      text-align: center; padding: 0 28px;
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-dim);
    }
    .seven-modal.is-transfer .seven-modal-body { text-align: center; margin-top: 18px; }
    /* The same treatment for an announcement — the backup asking, and the
       backup reporting. DESIGN.md: a header never competes with what it
       introduces. Left at 15/700 over a centred body, the title WAS the focal
       point and the copy underneath had nothing to anchor it
       (Daniel, 2026-08-13). */
    /* A dialog that asks WHICH: a short heading, the thing being acted on
       under it, the options as buttons, and the rule about them last
       (Daniel, 2026-08-14). */
    .seven-modal.is-choice .seven-modal-title {
      text-align: center; font-size: 26px; font-weight: 700; letter-spacing: -.01em;
      padding: 0 28px;
    }
    .seven-modal.is-choice .seven-modal-body {
      text-align: center; margin-top: 14px; font-size: 15px; color: var(--text-muted);
    }
    .seven-modal.is-choice .seven-modal-body em { font-style: italic; color: var(--text); }
    .seven-modal.is-choice .seven-modal-actions { gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .seven-modal.is-choice .seven-modal-ok { font-size: 14px; padding: 9px 18px; }
    /* Shown but not on offer, and it has to LOOK unavailable at a glance —
       a faintly greyed button still reads as a button you may press. */
    .seven-modal-ok.is-off, .seven-modal-ok:disabled {
      background: var(--shade-hard); color: var(--text-dim);
      border: 1px solid var(--line); opacity: .45;
      cursor: not-allowed; box-shadow: none;
    }
    .seven-modal-ok.is-off:hover { filter: none; }
    /* The rule that explains a greyed choice, under the buttons it is about. */
    .seven-modal-note {
      margin: 16px 0 0; text-align: center;
      font-size: 13px; color: var(--text-muted);
    }
    .seven-modal.is-announce .seven-modal-title {
      text-align: center; padding: 0 28px;
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-dim);
    }
    .seven-modal.is-announce .seven-modal-body { text-align: center; margin-top: 18px; }
    .seven-modal-body .tx-from, .seven-modal-body .tx-to {
      margin: 0; font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.3;
    }
    .seven-modal-body .tx-from { font-style: italic; }
    .seven-modal-body .tx-count {
      margin: 4px 0 0; font-size: 10px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim);
    }
    .seven-modal-body .tx-arrow { margin: 8px 0; font-size: 17px; line-height: 1; color: var(--text-dim); }
    /* One sentence per paragraph: a forced break inside centred prose lands
       wherever the modal happens to be wide, which reads as ragged. `balance`
       does the rest — centred text with an orphan on the last line is the
       whole reason this block looked untidy.

       Every rule here is scoped under .seven-modal-body on purpose: the
       modal's own `.seven-modal-body p { margin: 0 0 9px }` is MORE specific
       than a bare .tx-class, so an unscoped `margin: … auto` silently lost and
       the measured block sat left-aligned with its text centred inside it. */
    .seven-modal-body .tx-note {
      margin: 18px auto 0; max-width: 26em;
      font-size: 13px; line-height: 1.45; text-wrap: balance;
    }
    /* THE MESSAGE SLOT under the panel: one box, two faces, and the box is as
       tall as the taller face.
       Both faces occupy the SAME grid cell, so the row's height is the max of
       the two and the modal cannot change size as the walk steps between them.
       Hiding one used to mean `hidden` — display: none — and the dialog shrank
       and grew through a bank send, which is how a player watching seven
       already-matching presets lost track of what it was telling him
       (Daniel, 2026-08-22).
       `visibility`, not `display`: the hidden face must keep its space. */
    .seven-modal-body .tx-slot { display: grid; }
    .seven-modal-body .tx-face { grid-area: 1 / 1; }
    .seven-modal-body .tx-face.is-off { visibility: hidden; }
    /* The first note in a face carries the slot's top margin; the face itself
       adds none, so the two states start at exactly the same y. */
    .seven-modal-body .tx-face > .tx-note:first-child { margin-top: 18px; }

    /* The aside sits under its sentence, not as a second statement. */
    .seven-modal-body .tx-note + .tx-note { margin-top: 5px; }
    .seven-modal-body .tx-aside { color: var(--text-dim); }
    /* What the instrument never told us, said quietly rather than dropped. */
    .seven-modal-body .tx-fine { font-size: 12px; color: var(--text-dim); }
    .seven-modal-body .tx-alarm { margin-top: 0; color: var(--accent); }
    /* The picture answering a press. Amber rather than the alarm red: nothing
       has gone wrong, somebody has simply reached for the drawing instead of
       the instrument, and a red correction for a reasonable mistake reads as
       telling them off. */
    .seven-modal-body .tx-alarm-soft { color: var(--amber); }
    /* THREE BLINKS, THEN REST. 260ms on, 260ms off; app.js's BLINK_MS is
       3 * 520 and has to agree with this.
       TWO MECHANISMS STOP IT, DELIBERATELY REDUNDANT: the iteration count
       here, and the timer in modal-panel.js that takes the class off. Measured, the
       TIMER is what wins — setting this to `infinite` does not make the blink
       run on, because the class is gone by then. That is worth writing down
       rather than leaving as a claim: neither half can be mutation-proven
       while the other is in place, and the count is the one that would still
       hold if a timer were ever lost. */
    @keyframes tx-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .15; } }
    .seven-modal-body .tx-blink { animation: tx-blink 520ms steps(1, end) 3; }
    @media (prefers-reduced-motion: reduce) {
      /* The words still change; only the flashing goes. */
      .seven-modal-body .tx-blink { animation: none; }
    }
    /* TWO LINES, ALWAYS. This one line carries two different sentences — the
       standing instruction and the correction — and it is directly under the
       thing somebody has their finger on, so the dialog must not change height
       as it swaps. Reserved rather than measured, because the wrap point
       depends on the font that actually loaded. */
    .seven-modal-body .tx-hold-line { min-height: 2.9em; }

    /* ---- The save flow ----------------------------------------------------
       TWO ROWS THAT ARE THE ACTIONS, not a body with buttons under it. The
       whole point of this dialog is that the two confusable choices — the
       instrument and the computer — sit next to each other and explain
       themselves by contrast, which only works if each one carries its own
       sentence (out/save-what-you-hear.md §1).
       Full width and stacked, never side by side: side by side they read as a
       pair to choose BETWEEN quickly, and this is a question worth a moment. */
    .seven-modal-body .sv-rows { display: grid; gap: 9px; margin-top: 4px; }
    .seven-modal-body .sv-row {
      display: block; width: 100%; text-align: left; cursor: pointer;
      font: inherit; color: var(--text);
      background: none; border: 1px solid var(--line); border-radius: 8px;
      padding: 12px 14px;
    }
    .seven-modal-body .sv-row:hover { border-color: var(--text-muted); background: var(--shade-hard); }
    .seven-modal-body .sv-row:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
    .seven-modal-body .sv-row-t { display: block; font-size: 13px; font-weight: 600; }
    /* The sentence under each title is the whole defence against the two
       labels being mistaken for each other, so it is never optional and never
       truncated. */
    .seven-modal-body .sv-row-s {
      display: block; margin-top: 3px;
      font-size: 12px; line-height: 1.45; color: var(--text-muted);
    }
    /* THE BANK 1 NOTE, where the Seven row would have been.
       It explains why there are fewer options; it is not a warning about
       something the player did, and it is not a control. So: no border, no
       background, no hover, no cursor, and NOT red or amber — this is a fact
       about the instrument, not a problem with the save. --text-muted is the
       same ink the row subtitles use, which is what makes it read as of a
       piece with them rather than as an alert dropped into the list.
       The left padding matches .sv-row's so the sentence starts on the same
       line as the titles above and below it. */
    .seven-modal-body .sv-note {
      margin: 0; padding: 2px 14px;
      font-size: 12px; line-height: 1.45; color: var(--text-muted);
    }
    /* THE TICK BOX IS THE PROTECTION, so it reads as reassurance rather than
       as an extra decision: a quiet box under the instruction, already
       ticked. */
    .seven-modal-body .sv-check {
      display: flex; gap: 10px; align-items: flex-start; text-align: left;
      margin-top: 16px; padding: 11px 13px;
      border: 1px solid var(--line); border-radius: 7px;
      font-size: 12px; line-height: 1.45; color: var(--text-muted); cursor: pointer;
    }
    .seven-modal-body .sv-check input { margin: 2px 0 0; flex: none; }
    .seven-modal-body .sv-check b { color: var(--text); font-weight: 600; }
    /* The backup summary reads as a little diagram — the count, an arrow, the
       destination — so it is centred and the arrow stands alone. */
    /* "32 presets → computer" is a from/to, exactly as a transfer is, so it
       carries the same weight: the two ends large, the arrow between them
       quiet, and the supporting lines small. */
    .seven-modal-body .bk-sum {
      text-align: center; margin: 0;
      font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.3;
    }
    .seven-modal-body .bk-arrow {
      text-align: center; margin: 2px 0; font-size: 16px; line-height: 1;
      color: var(--text-dim);
    }
    .seven-modal-body .bk-time {
      text-align: center; margin: 16px 0 0; font-size: 12px; color: var(--text-muted);
    }
    .seven-modal-body .bk-time + .bk-time { margin-top: 4px; }
    /* "copy" is the app's word, not yours: same size and weight as the name it
       trails, in the muted ink the rest of the app gives secondary facts. */
    .seven-modal-body .bk-sum .bk-suffix { color: var(--text-muted); }
    /* A link inside a dialog, in the app's one link treatment (#save-live-btn
       and .save-seven-link): a borderless button, action-coloured, underlined
       on hover only. It is not a second BUTTON — the dialog has one action,
       and this is a way out of it to somewhere else. */
    .seven-modal-body .modal-link {
      display: inline-block; margin: 14px 0 0;
      font: inherit; font-size: 12px; font-weight: 600;
      background: none; border: none; padding: 0; cursor: pointer;
      color: var(--action-text); text-decoration: none;
    }
    .seven-modal-body .modal-link:hover { text-decoration: underline; text-underline-offset: 2px; }
    .seven-modal-body .modal-link:focus-visible {
      outline: 2px solid var(--action); outline-offset: 2px; border-radius: 3px;
    }
    /* The walk's step: which patch, then where it goes, then the panel. */
    .seven-modal-body .tx-step-name { margin: 0; font-size: 17px; font-weight: 700; color: var(--text); }
    /* Sits ON the name, not under the block: the patch is already playing, and
       that is the one thing about this step you can check by ear. */
    .seven-modal-body .tx-step-hear { margin: 1px 0 0; font-size: 13px; }
    .seven-modal-body .tx-step-where {
      margin: 4px 0 14px; font-size: 10px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim);
    }
    /* Mid-step the app is writing to the instrument. The actions go inert
       rather than disappear, so the dialog keeps its shape under the hands. */
    .seven-modal.is-busy .seven-modal-actions,
    .seven-modal.is-busy .seven-modal-cancel { opacity: .4; pointer-events: none; }
    /* Becoming the next thing: the old content fades out, the card resizes,
       the new content fades in. One dialog, several states — never a dialog
       that vanishes so another can take its place. */
    .seven-modal-body, .seven-modal-actions { transition: opacity .17s ease; }
    .seven-modal.is-swapping .seven-modal-body,
    .seven-modal.is-swapping .seven-modal-actions { opacity: 0; }
    .seven-modal.is-resizing { overflow: hidden; transition: height .34s cubic-bezier(.4, 0, .2, 1); }
    @media (prefers-reduced-motion: reduce) {
      .seven-modal-body, .seven-modal-actions, .seven-modal.is-resizing { transition: none; }
    }
    .seven-modal.is-warning .seven-modal-ok {
      background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    }
    .seven-modal-ok:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

    /* ── THE MODAL PANEL ────────────────────────────────────────────────
       The bank-and-preset row cut from the dashboard's own drawing
       (src/modal-panel.js). One drawing, two views — which is the fix for the
       eleven days the small panel spent with no BANK button because nobody was
       comparing two hand-maintained copies.
       Everything here is about STATE. The shapes, the caps, the LEDs and the
       colours all come from assets/seven-panel.svg and are not restated. */
    .modal-panel { display: block; margin: 2px 0 4px; }
    /* The panel is labelled TINES, REEDS, GRAND … which are BANK 1's factory
       presets. In a modal choosing a destination in banks 2-4 they are wrong,
       so the legends go and the numerals — already in the drawing — stay.
       NOT IN THE BACKUP GRID, whose top row IS bank 1: there the legends are
       simply true, and they are the panel's own header the way the instrument
       prints it (Daniel, 2026-11-13: "Just use mine"). Written as :not()
       rather than undone later, because an opt-out a later rule tries to
       reverse is the cascade bug test/css-hazards.test.js exists for. */
    .modal-panel:not(.bk-row) .lbl-preset { display: none; }
    /* The stage heading. The panel's own label face, so it belongs to the
       picture rather than to the dialog around it. */
    .modal-panel .mp-heading {
      fill: #e8e8ea; font-family: 'Archivo Narrow', 'Archivo', Helvetica, Arial, sans-serif;
      font-weight: bold; font-style: italic; font-size: 15px; letter-spacing: .08em;
    }

    /* THE BRACKETS. These are the only marks here that belong to the INTERFACE
       rather than to the machine — they sit outside the panel's backdrop and
       point up at it — so they take the app's own face and the app's own
       tokens, and they change with the theme while everything above them stays
       literally the colour of a Crumar. --amber is the established token for
       exactly this job; in the light theme it is the deep amber that passes AA
       there, not the brighter orange of the drawing. */
    /* THE HOLD LEGEND. It belongs to the MACHINE, not to the interface: the
       panel's own CLAVI TABS yellow, in the panel's own label face, bracketed
       the way the panel brackets a legend. So it is literal in both themes,
       like everything else inside the backdrop. */
    .modal-panel .mp-hold { opacity: 0; transition: opacity .2s ease, transform .3s cubic-bezier(.4, 0, .2, 1); }
    .modal-panel.is-hold .mp-hold { opacity: 1; }
    .modal-panel .mp-hold-word {
      fill: #d9c24a; font-family: 'Archivo Narrow', 'Archivo', Helvetica, Arial, sans-serif;
      font-size: 15px; font-weight: bold; font-style: italic; letter-spacing: .06em;
    }
    .modal-panel .mp-hold-rule { stroke: #d9c24a; stroke-width: 1.4; fill: none; }
    /* Nothing is being chosen at the hold, so the question goes away and the
       legend over the button is the whole message. */
    .modal-panel.is-hold .mp-heading { visibility: hidden; }
    /* The one lit LED BLINKS, the way a preset waiting to be stored asks for
       attention on the instrument itself. Only at the hold: everywhere else
       the panel is recording a choice, and a blink there would be asking for
       something. */
    .modal-panel.is-hold .is-chosen .led.on { animation: mp-blink 1.05s steps(1, end) infinite; }
    @keyframes mp-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .modal-panel .mp-hold { transition: none; }
      .modal-panel.is-hold .is-chosen .led.on { animation: none; }
    }

    .modal-panel .mp-bracket { fill: none; stroke: var(--amber); stroke-width: 2; }
    .modal-panel .mp-cap {
      fill: var(--text); font-family: 'Archivo', Helvetica, Arial, sans-serif;
      font-weight: 700; font-size: 17px;
    }

    /* WHAT IS LIVE, BY STAGE. Only the controls that can be pressed take a
       cursor and answer hover; the rest are a picture. */
    .modal-panel .btn-hit { pointer-events: none; cursor: default; }
    /* THE KEYBOARD'S OWN MARK. The hit rects are transparent and sit over the
       drawing, so the ring lands exactly on the cap it drives. --amber rather
       than the app's usual focus ink because it has to read on a picture of a
       black instrument, not on the dialog. */
    .modal-panel [data-mp-bank]:focus-visible,
    .modal-panel [data-mp-hit]:focus-visible {
      outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 3px;
    }
    /* AT THE HOLD, THE PICTURE ANSWERS — and it is the only stage where a
       press is not a choice. Somebody reaching for the button they have just
       been told to hold will reach for the one on screen, and a picture that
       ignores them looks broken rather than inert. It takes the press and says
       where the real button is. Not a pointer cursor: it is still not a
       control, and it must not look like one. */
    /* Only the PRESETS. They are the buttons somebody was told to hold, so
       they are the ones a mistaken press lands on. The bank control has no
       part in a hold and stays inert rather than taking a press it has no
       answer for. */
    .modal-panel.is-hold [data-mp-hit] { pointer-events: auto; cursor: default; }
    .modal-panel.is-bank [data-mp-bank],
    .modal-panel.is-row [data-mp-bank],
    .modal-panel.is-preset [data-mp-bank],
    .modal-panel.is-chosen [data-mp-bank],
    .modal-panel.is-preset [data-mp-hit],
    .modal-panel.is-chosen [data-mp-hit] { pointer-events: auto; cursor: pointer; }

    /* HOVER LIGHTENS THE FACE — and stays live after a preset is chosen, on
       the presets AND the bank control, because the player may change their
       mind about either until they press NEXT. The lit lamp and the single lit
       LED are what say what is currently chosen; nothing else needs to. */
    .modal-panel [data-mp-hit]:hover ~ .btn-face,
    .modal-panel g:hover > .btn-face { filter: brightness(1.35); }
    .modal-panel [data-mp-bank]:hover ~ .btn-face { filter: brightness(1.35); }
    @media (prefers-reduced-motion: reduce) {
      .modal-panel .btn-face { transition: none; }
    }

    /* Before a bank is chosen the presets are a dark row: there is nothing to
       pick from yet, and eight lit caps would invite a press that does
       nothing. */
    .modal-panel.is-bank [data-mp-preset] { opacity: .45; }
    /* Bank chosen: all eight wake up — "pick one". */
    /* A whole-bank send: all eight are the DESTINATION. They light like the
       chooser's offer and, unlike it, none of them answers a click — the row
       is being reported, not offered. */
    .modal-panel.is-row [data-mp-preset],
    .modal-panel.is-preset [data-mp-preset],
    .modal-panel.is-hold [data-mp-preset],
    .modal-panel.is-chosen [data-mp-preset] { opacity: 1; }
    /* Preset chosen: every LED goes out and the chosen CAP carries it, raised
       and outlined. .on is removed in JS; this is the face. */
    .modal-panel.is-chosen [data-mp-preset]:not(.is-chosen) .btn-face,
    .modal-panel.is-hold [data-mp-preset]:not(.is-chosen) .btn-face { filter: none; }
    .modal-panel .is-chosen .btn-face { stroke: #f2f2f5; stroke-width: 1.6; }

    /* The bank control is dark once a bank has been chosen: its job is done
       until the player wants to change it, and a lit face beside a lit lamp
       says the same thing twice. */
    .modal-panel.is-bank [data-mp-bank] ~ .btn-face,
    .modal-panel.is-bank #mp-btn-bank { filter: brightness(1.5); }
    /* …and it stays lit through a whole-bank send, where it is the only
       control there is. */
    .modal-panel.is-row #mp-btn-bank { filter: brightness(1.5); }

    /* ── THE BACKUP GRID ────────────────────────────────────────────────
       The Seven's own 32 buttons, four banks stacked, lighting as the run
       reaches each slot (src/modal-panel.js buildGrid/paintBackup). Same
       shape the JUNO-X editor's Crumar picker uses; built here from this
       app's own drawing rather than imported.

       NOTHING HERE INVENTS A LIT COLOUR, and that is deliberate. A glow
       tuned on the dark palette is exactly the hazard that left the select
       chevron invisible in light mode for weeks — a colour baked into one
       theme's idea of bright. The lit state is the DRAWING's own `.led.on`
       (#ff3b30, assets/seven-panel.svg), which is literal in both themes for
       the same reason the whole panel strip is: it is a picture of a machine,
       and a machine's LED does not change colour when the room lights do
       (DESIGN.md, "What is NOT themed"). Checked in both. The furniture
       around the picture — the slot line, the count — takes app tokens and
       changes with the theme like everything else. */
    .bk-grid { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 0; }
    .bk-grid .bk-row { display: block; width: 100%; height: auto; margin: 0; }
    /* Each row carries only its OWN bank lamp and numeral (marked `is-own` in
       buildGridRow). Four copies of all four lamps is sixteen lamps saying
       nothing; one per row is how the instrument says which bank it is. */
    .bk-row .led.amber { opacity: 0; }
    .bk-row .led.amber.is-own { opacity: 1; }
    .bk-row .lbl-bank-num { opacity: 0; }
    .bk-row .lbl-bank-num.is-own { opacity: 1; }
    /* THE BANK INDICATOR, not a bank button. The instrument has one BANK
       button and four of them said nothing, so the crop starts after it
       (Daniel, 2026-11-13: "We don't need that") — what is kept is the lamp
       and the numeral, which is how the panel says which bank is live. The
       row being read lights both. Literal colours, like everything else
       inside the backdrop: these numerals are part of the picture, and the
       picture does not change when the room lights do (DESIGN.md). The lit
       value is the drawing's own `.lbl` white; the resting one is it, dimmed. */
    .bk-row .lbl-bank-num.is-own { fill: #6e6e74; transition: fill .18s ease; }
    .bk-row.is-current .lbl-bank-num.is-own { fill: #f2f2f4; }
    @media (prefers-reduced-motion: reduce) {
      .bk-row .lbl-bank-num.is-own { transition: none; }
    }
    /* A light coming on has a rise. Short enough not to lag a slot that reads
       quickly, long enough that 32 of them do not read as flicker. */
    .bk-row .led { transition: fill .18s ease; }
    @media (prefers-reduced-motion: reduce) { .bk-row .led { transition: none; } }
    /* THE GRID ARRIVES WHOLE AND FADED, AND FILLS IN (Daniel, 2026-11-14, on
       his own design: "the progress thing is somewhat overwhelming"). Every
       slot is drawn from the first frame, at a tenth; a slot comes to full
       when its light goes on. The growing bright area IS the progress bar, and
       the faded remainder is where the rest will land.

       REVEALING ONE BANK AT A TIME WAS THE FIRST IDEA AND IS WRONG. A row
       arriving mid-run changes the dialog's height four times, at the exact
       moment somebody is watching it to see whether anything is still
       happening. The same mistake was made and fixed once already in the
       JUNO-X editor, where the setlist sheet's rule is now always drawn at
       zero width for this reason. Reserve the space; reveal the content.

       Keyed off `.led.on` rather than a class of its own, so there is ONE
       definition of "this slot is done" — paintBackup sets the light, and
       nothing can set the light and forget the slot. */
    .bk-row [data-bk-preset] { opacity: .1; transition: opacity .18s ease; }
    .bk-row [data-bk-preset]:has(.led.on) { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .bk-row [data-bk-preset] { transition: none; }
    }
    /* THE UNLIT LED, DARKER THAN THE DRAWING'S (#7d2b26 in
       assets/seven-panel.svg, which is right on the instrument where one lamp
       is lit at a time, and wrong here where thirty-two are drawn at once).
       Daniel, 2026-11-14: "make the inactive light less bright so when it
       lights up there's more contrast and it's clear it has saved."

       :not(.on) so the lit state still comes from the drawing, and :not(.amber)
       so the bank lamp keeps its own colour. Both are needed — without them
       this rule outranks `.led.on` and `.led.amber` and puts out the two
       lights that matter. */
    .bk-row .led:not(.amber):not(.on) { fill: #5d201c; }
    /* The slot being read, in words — the sound name is the thing worth
       seeing, because it is what the instrument is playing at that moment.
       A fixed height: the name changes 32 times and the dialog must not
       breathe under somebody watching it. */
    .seven-modal-body .bk-now {
      margin: 14px 0 0; min-height: 2.6em;
      font-size: 13px; color: var(--text); line-height: 1.3;
    }
    .seven-modal-body .bk-now .bk-where {
      display: block; font-size: 10px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim);
    }
    .seven-modal-body .bk-count {
      margin: 6px 0 0; font-size: 12px; color: var(--text-muted);
    }
    /* THERE IS NO BUTTON. The only answer this dialog takes is "stop", the
       corner X already says it, and a button beside it said it twice
       (Daniel, 2026-11-13: "the 'x' in the upper right takes care of that").
       So the actions row is empty and takes no room — and the X's accessible
       name is "Cancel backup", not "Close", because it is now the only visible
       way to stop a 48-second run. */
    .seven-modal-actions:empty { display: none; }
    .seven-modal.is-backup .seven-modal-title {
      text-align: center; padding: 0 28px;
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-dim);
    }
    .seven-modal.is-backup .seven-modal-body { text-align: center; margin-top: 16px; }

    /* Patch picker: a modal over the setlist, so the slots you're filling stay
       visible behind it. Tiles rather than rows — the point is seeing many
       options at once, and a row wastes the width. */
    .pick-overlay {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(0, 0, 0, .55);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    /* ONE SIZE, every tab. The height used to follow the content, so moving
       between Patches, Instruments and Backups resized the panel under the
       pointer and moved the tabs and Cancel with it (Daniel, 2026-08-16). A
       smooth resize was the alternative, and it cannot work here: the library
       panel re-renders its whole innerHTML on every state change, so no
       element survives a tab change for a transition to run on. */
    .pick-modal {
      display: flex; flex-direction: column;
      width: min(860px, 92vw); height: min(700px, 82vh);
      background: var(--bg-panel); border: 1px solid var(--line); border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }
    .pick-modal-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--line);
    }
    .pick-title { font-weight: 600; flex: none; }
    .pick-modal-head .lib-search { flex: 1; }
    .pick-cancel {
      font: inherit; font-size: 12px; color: var(--text-muted);
      background: none; border: 1px solid var(--line); border-radius: 4px;
      padding: 3px 10px; cursor: pointer;
    }
    .pick-cancel:hover { color: var(--text); border-color: var(--text-muted); }
    .pick-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; }
    /* Inside a backup run: the way out, and which run you are in. */
    .pick-run-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .pick-run-title { font-weight: 600; }
    .pick-group + .pick-group { margin-top: 16px; }
    .pick-group-title {
      position: sticky; top: -12px; z-index: 1;
      background: var(--bg-panel); padding: 4px 0 6px;
      font-size: 12px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-muted);
    }
    /* The instrument grid's two halves are named in their own colour, at a
       size that reads as a heading rather than a caption. */
    .pick-group-title.is-modeled, .pick-group-title.is-sampled {
      font-size: 15px; letter-spacing: .08em; padding-bottom: 8px;
    }
    .pick-group-title.is-modeled { color: var(--modeled); }
    .pick-group-title.is-sampled { color: var(--sampled); }
    .pick-grid {
      display: grid; gap: 8px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    /* Each tile carries its engine's colour as a top edge — family is legible
       even when the name truncates. */
    .pick-tile {
      display: flex; flex-direction: column; gap: 2px; text-align: left;
      padding: 8px 10px; border: 1px solid var(--line); border-top: 3px solid var(--tile);
      border-radius: 5px; background: var(--bg-raised); color: var(--text);
      font: inherit; cursor: pointer; min-width: 0;
    }
    /* One line, clipped. A long name wrapped to two and made its tile taller
       than the row around it (Daniel, 2026-08-13); the full name is in the
       tile's tooltip. */
    .pick-tile .tile-name {
      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pick-tile .tile-sound, .pick-tile .tile-when {
      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pick-tile .tile-when { color: var(--text-dim); font-size: 11px; }
    .pick-tile:hover { background: var(--shade-hard); border-color: var(--text-dim); }
    /* A row in the picker's Backups tab: a run, or a preset inside one. */
    .pick-list { display: flex; flex-direction: column; }
    .pick-row {
      display: flex; align-items: baseline; gap: 10px; width: 100%;
      padding: 7px 10px; text-align: left;
      background: none; border: 0; border-top: 1px solid var(--line);
      color: var(--text); font: inherit; cursor: pointer;
    }
    .pick-row:hover { background: var(--shade); }
    .pick-row.is-empty { color: var(--text-dim); cursor: default; }
    .pick-row .patch-num { flex: 0 0 1.6em; color: var(--text-dim); font-size: 12px; }
    .pick-row .patch-name { flex: 1 1 auto; }
    .pick-row .patch-sound, .pick-row .lib-origin { color: var(--text-dim); font-size: 12px; }
    .pick-modes { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
    .pick-mode {
      font: inherit; font-size: 12px; font-weight: 600; color: var(--text-muted);
      background: none; border: 0; padding: 4px 12px; cursor: pointer;
    }
    .pick-mode + .pick-mode { border-left: 1px solid var(--line); }
    .pick-mode.on { background: var(--shade-hard); color: var(--text); }
    /* Illustrated tiles are roomier than patch tiles — 24 instruments fit on a
       screen at this size, so the art can be legible without costing overview. */
    .pick-grid-art { grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); }
    /* The same grid, hosted inside a plain dialog rather than the library's
       own picker shell (one preset on the instrument, not a setlist slot). */
    .pick-inline { max-height: 54vh; overflow-y: auto; margin-top: 12px; text-align: left; }
    .pick-tile-art {
      align-items: center; text-align: center; gap: 4px; padding: 8px 8px 8px;
      /* A wash of the family colour behind the picture. Sounds that share an
         instrument — every Venice Grand is an acoustic grand sample — share a
         drawing, so the tile's colour and its name are what tell them apart. */
      background: color-mix(in srgb, var(--tile) 14%, var(--bg-raised));
    }
    .pick-tile-art:hover { background: color-mix(in srgb, var(--tile) 26%, var(--bg-raised)); }
    /* A FIXED picture area, with the instrument centred in it. The art was
       sized by its own aspect, so a short wide one (the MKS rack) floated
       against the top of a tall box and every label sat at a different height
       down the row (Daniel, 2026-08-13). One box, one baseline for the names. */
    .tile-art {
      color: var(--tile); display: flex; align-items: center; justify-content: center;
      width: 100%; height: 92px; line-height: 0;
    }
    /* A drawn instrument brings its own colours; only the fallback line art is
       tinted with the family colour. */
    .tile-art .sound-art.is-drawing {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
    }
    .tile-art .sound-art.is-drawing svg,
    .tile-art .sound-art.is-drawing img {
      display: block; width: 100%; height: 100%;
      object-fit: contain; object-position: center;
    }
    /* A photograph with a transparent background reads as a cut-out pasted on
       — hardest on the dark theme, where the silhouette meets near-black with
       nothing between them. drop-shadow follows the ALPHA rather than the box,
       so a pale halo traces the instrument itself and lifts it off the panel.
       Light theme gets the opposite: a soft dark shadow, so it sits on the
       surface rather than floating above it. */
    .sound-art.is-drawing img {
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .28));
    }
    :root[data-theme="dark"] .sound-art.is-drawing img {
      filter: drop-shadow(0 0 9px rgba(255, 255, 255, .16))
              drop-shadow(0 0 26px rgba(255, 255, 255, .07))
              drop-shadow(0 2px 4px rgba(0, 0, 0, .55));
    }
    /* How a SAMPLED instrument arrives: a line crosses it, and the instrument
       exists behind the line. Nothing is there before the line reaches it.

       The line follows the CONTOURS of the instrument rather than running the
       full width of the box (Daniel, 2026-08-13), and the way it does that is
       a mask: app.js hands the instrument's own image over as --art-src, the
       line is painted across the whole drawn rect, and the mask means it only
       shows where that image is opaque. So on a grand piano the line is short
       over the legs and long across the lid, for free — no per-instrument work
       and no silhouette data to maintain.

       Everything is measured, not assumed. The art is object-fit: contain, so
       a wide flat instrument leaves empty bands above and below; app.js
       measures the drawn rect and hands over --scan-top/-left/-span/-w, and
       every rule here is expressed in those. Animating over the BOX instead
       meant the pass spent most of its travel crossing nothing.

       Landing only, so nothing animates at rest. */
    .car-face.is-landing .sound-art.is-drawing.is-sampled {
      position: relative;
      /* A proportion of the instrument, not a fixed height: wide flat art
         renders short — the Combo Piano is 48px tall in a 128px box — and a
         fixed lamp covered half of it at every moment, which reads as a blob
         arriving rather than a pass across something. */
      --lamp-h: max(4px, calc(var(--scan-span, 128px) * 0.14));
    }
    /* The reveal, over the drawn rect rather than the box. */
    @keyframes sampled-reveal {
      0%   { clip-path: inset(0 0 calc(100% - var(--scan-top)) 0); }
      100% { clip-path: inset(0 0 calc(100% - var(--scan-top) - var(--scan-span)) 0); }
    }
    /* A band of constant height travelling top to bottom. Both insets
       interpolate, which is what keeps the height fixed while it moves. */
    @keyframes sampled-line {
      0%   { clip-path: inset(0 0 calc(100% - var(--lamp-h)) 0); opacity: 0; }
      10%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { clip-path: inset(calc(100% - var(--lamp-h)) 0 0 0); opacity: 0; }
    }
    .is-landing.is-scan .sound-art.is-drawing.is-sampled img {
      animation: sampled-reveal 550ms linear var(--scan-delay, 0ms) 1;
    }
    .is-landing.is-scan .sound-art.is-drawing.is-sampled::before {
      content: '';
      position: absolute;
      left: var(--scan-left); top: var(--scan-top);
      width: var(--scan-w); height: var(--scan-span);
      /* Hard stops, not a falloff. A smooth gradient reads as something out of
         focus; a digital readout has EDGES — a bright core with a defined
         band either side of it, and a 1px scanline texture across the whole
         thing so it looks generated rather than lit (Daniel, 2026-08-13). */
      background-image:
        repeating-linear-gradient(to bottom,
          rgba(255, 255, 255, .55) 0 1px,
          transparent 1px 2px),
        linear-gradient(to bottom,
          transparent 0 14%,
          color-mix(in srgb, var(--sampled) 55%, transparent) 14% 34%,
          #fff 34% 66%,
          color-mix(in srgb, var(--sampled) 55%, transparent) 66% 86%,
          transparent 86% 100%);
      /* The silhouette. Prefixed too — this has to hold on whatever Chromium
         the packaged app ships with. */
      -webkit-mask-image: var(--art-src); mask-image: var(--art-src);
      -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      /* INVISIBLE unless the animation is driving it. The keyframes clip it to
         a band, but the moment the animation ends the clip reverts to none and
         it paints unclipped — a white silhouette of the instrument sitting on
         top of the instrument (Daniel, 2026-08-13). The base state has to be
         "nothing", so that whenever the animation is not running there is
         nothing to see. */
      opacity: 0; clip-path: inset(100% 0 0 0);
      pointer-events: none; z-index: 2;
      animation: sampled-line 550ms linear var(--scan-delay, 0ms) 1;
    }
    @media (prefers-reduced-motion: reduce) {
      .is-landing .sound-art.is-drawing.is-sampled img { animation: none; }
      .is-landing .sound-art.is-drawing.is-sampled::before { display: none; }
    }
    .pick-tile-art .tile-name { -webkit-line-clamp: 2; }
    .pick-note {
      margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line);
      font-size: 12px; color: var(--text-muted); max-width: 62ch;
    }
    /* A sound-only slot: no patch behind it, so its name reads as the sound. */
    .lib-slot-sound .patch-name { font-style: italic; }

    .tile-name {
      font-weight: 600; font-size: 12px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile-sound {
      font-size: 12px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .lib-slot {
      display: grid; grid-template-columns: 24px 1fr auto auto;
      column-gap: 10px; row-gap: 3px; align-items: baseline;
      width: 100%; padding: 7px 6px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left;
    }
    .lib-slot-patch { cursor: pointer; }
    .lib-slot-patch:hover { background: var(--bg-raised); }
    .slot-num { color: var(--text-dim); font-variant-numeric: tabular-nums; }
    /* Empty and missing-file slots are distinct at a glance: empty is quiet,
       missing carries the warning treatment. */
    .lib-slot-empty .slot-text { color: var(--text-dim); font-style: italic; }
    /* Sits in the cleared row's trailing control cell — where the ✕ that
       emptied it was. */
    .slot-undo {
      display: inline-flex; align-items: center; justify-content: center;
      background: none; border: none; padding: 2px 6px; cursor: pointer;
      color: var(--amber); grid-column: 6;
    }
    .slot-undo:hover { color: var(--text); }
    .lib-slot-missing .slot-text { color: var(--warn); }
    /* Setlist editing */
    /* Pinned to the bottom of the scroller. It sat at the end of the list, so
       with enough setlists it fell below the fold and could not be clicked at
       all — and any small change elsewhere in the window (one more button in
       the connection row) was enough to tip it over. A control that creates
       things should not be the thing you have to scroll to find. */
    .lib-new-setlist {
      position: sticky; bottom: 0; z-index: 1;
      display: block; width: 100%; padding: 9px 6px;
      background: var(--bg); border: none; border-top: 1px solid var(--line);
      color: var(--text-muted); font: inherit; text-align: left; cursor: pointer;
    }
    .lib-new-setlist:hover { background: var(--bg-raised); color: var(--text); }
    .lib-setlist-renaming { display: block; }
    .setlist-input {
      width: 100%; font: inherit; font-weight: 600; color: var(--text);
      background: var(--bg); border: 1px solid var(--amber); border-radius: 3px;
      padding: 3px 6px;
    }
    .slot-assign {
      font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .05em;
      color: var(--amber); background: transparent;
      border: 1px solid var(--amber); border-radius: 9px;
      padding: 2px 9px; cursor: pointer; flex: none; margin-left: 6px;
    }
    .slot-assign:hover { background: rgba(255, 176, 32, .15); }
    .slot-assign:disabled { opacity: .35; cursor: default; }
    .slot-clear {
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-dim); background: transparent; border: none;
      padding: 2px 4px; cursor: pointer;
    }
    .slot-clear:hover { color: var(--text); }
    /* Slot change feedback: the row settles into its new state rather than
       snapping, so a clear reads as a removal and an undo as a return. */
    @keyframes slot-cleared {
      from { background: var(--shade-hard); opacity: .35; transform: translateY(-3px); }
      to { background: transparent; opacity: 1; transform: none; }
    }
    @keyframes slot-restored {
      from { background: rgba(63, 185, 80, .16); opacity: .35; transform: translateY(4px); }
      to { background: transparent; opacity: 1; transform: none; }
    }
    .lib-slot.slot-cleared { animation: slot-cleared 340ms ease-in-out; }
    .lib-slot.slot-restored { animation: slot-restored 340ms ease-in-out; }
    /* Drop feedback while dragging a patch or a slot over a target slot. */
    .lib-slot.drop-target { outline: 1px dashed var(--amber); outline-offset: -2px; background: rgba(255, 176, 32, .06); }
    /* Reordering shows a LINE where the row will land, not a highlight on the
       row under the pointer: a highlight says "drop onto this", and dropping
       onto a patch means something else in this app (assign it to that slot).
       A line between rows can only mean a position. */
    .lib-row.drop-above, .lib-row.drop-below { position: relative; }
    .lib-row.drop-above::before, .lib-row.drop-below::after {
      content: ''; position: absolute; left: 0; right: 0; height: 2px;
      background: var(--amber); pointer-events: none; z-index: 2;
    }
    .lib-row.drop-above::before { top: -1px; }
    .lib-row.drop-below::after { bottom: -1px; }
    /* Back to sorting itself. Sits in the bar beside the tabs, and only exists
       while there is a hand-placed order to undo. */
    .lib-resort {
      flex: none; font: inherit; font-size: 11px; font-weight: 600;
      background: none; border: none; padding: 2px 6px; cursor: pointer;
      color: var(--text-muted);
    }
    .lib-resort:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    .lib-resort:focus-visible { outline: 2px solid var(--action); outline-offset: 1px; border-radius: 3px; }
    /* Slot rows grew controls; make room without breaking the grid. */
    .lib-slot .slot-num { grid-column: 1; grid-row: 1 / span 2; align-self: center; }
    .lib-slot .patch-name, .lib-slot .slot-text { grid-column: 2; grid-row: 1; }
    .lib-slot .lib-badges { grid-column: 3; grid-row: 1; text-align: right; }
    /* TWO LINES, NAME ABOVE META (Daniel, 2026-11-15).
       Line 1 pairs the patch name with the sound it is made of, which is the
       same left-name/right-sound pairing the Patches list uses. Line 2 is the
       meta line, and it spans to the row's end because it is the one that
       runs long — "Bank 2 · Preset 4 · 14 Nov" — and nothing shares it now
       that the sound has moved up. */
    .lib-slot .patch-sound { grid-column: 4; grid-row: 1; text-align: right; }
    .lib-slot .lib-origin {
      grid-column: 2 / -1; grid-row: 2;
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Slot rows carry the sound's kind as a lettered dot next to the sound
       name rather than a pill in the corner — the corner belongs to Assign.
       Hover reveals "Modeled" / "Sampled". */
    .sound-tag { font-style: italic; color: var(--text-dim); }
    .sound-tag.is-warn { color: var(--warn); font-style: normal; }
    /* ON HOVER, THE WAY "Send to Seven" APPEARS IN PATCHES (Daniel,
       2026-11-15). Two controls sitting on every row all the time are two
       controls competing with the thing the row is for. Laid over the row
       rather than in it, so revealing them reflows nothing — the same shape
       as .patch-send, which is why they read as the same idea.
       :focus-within keeps them reachable from the keyboard, where there is no
       hover to give. */
    .lib-slot { position: relative; }
    .lib-slot .slot-controls {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 3px; justify-content: flex-end;
      opacity: 0; transition: opacity .12s ease;
    }
    .lib-slot:hover .slot-controls,
    .lib-slot:focus-within .slot-controls { opacity: 1; }
    /* AN EMPTY SLOT KEEPS ITS SELECT. Assign is the only thing that can be
       done to an empty slot, and a row whose single action is invisible until
       you happen to point at it has no action at all. */
    .lib-slot-empty .slot-controls { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .lib-slot .slot-controls { transition: none; }
    }
    .slot-undo { grid-column: auto; }

    /* 4. Detail */
    /* min-width 0 lets the column shrink instead of overflowing #main
       horizontally; the stable gutter keeps content width constant whether or
       not a classic scrollbar is showing. */
    /* Audition bar: only rendered while an instrument is connected. */
    /* Two text links, sized like the lines above them. They were a filled
       button and a link, which put two button shapes in one column and made
       saving look louder than the patch it belonged to (Daniel, 2026-08-13).
       They stand out by COLOUR and WEIGHT — nothing else. */
    /* Column-first: these two stack, because the column is narrow and a row
       wrapped more often than not — leaving the separator dangling at the end
       of the first line. Stacked, they need no separator at all. */
    .save-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .save-sep { display: none; }
    /* Never break a label across lines — "Send to Seven" came out three lines
       tall in a narrow column (Daniel, 2026-08-13). */
    #save-live-btn, .save-seven-link { white-space: nowrap; }
    .save-sep { color: var(--text-dim); font-size: 12px; }
    .save-seven-link {
      font: inherit; font-size: 12px; font-weight: 500;
      background: none; border: none; padding: 0; cursor: pointer;
      text-decoration: none; text-align: left; color: var(--text-muted);
    }
    .save-seven-link:hover { text-decoration: underline; text-underline-offset: 2px; }
    /* A BUTTON, not a link. It was drawn as bare green text and Daniel took it
       for leftover UI on his own app (2026-08-21) — which is fair: everything
       else that writes to disk in this app wears a border. It is the primary
       action of the whole editing feature and now looks like one, borrowing
       the outlined treatment the connection row's buttons use. */
    /* THE LABEL IS WORDS; THE BORDER IS A MARK. 12px bold green type is the
       exact case DESIGN.md's "full chroma for marks, damped for text" was
       written for — the hue is borrowed from a printed legend a few
       millimetres tall, and at word scale it is many times the ink. The 1px
       border keeps --action because a hairline is the size the source
       actually is, and the hover FILL keeps it too. Identical in light,
       where paper needs no damping. */
    #save-live-btn {
      font: inherit; font-size: 12px; font-weight: 600;
      color: var(--action-text); background: none;
      border: 1px solid var(--action); border-radius: 5px;
      padding: 3px 10px; margin-top: 2px; cursor: pointer;
      text-align: left; text-decoration: none;
    }
    #save-live-btn:hover:not(:disabled) {
      color: var(--action-ink); background: var(--action);
    }
    #save-live-btn:focus-visible, .save-seven-link:focus-visible {
      outline: 2px solid var(--action); outline-offset: 2px; border-radius: 3px;
    }
    #save-live-btn:disabled { cursor: default; }
    /* TWO STATES ON THE INSTRUMENT VIEW, both clickable
       (out/save-what-you-hear.md §3). The base rule above is already the
       outlined one, so `is-quiet` only has to soften it: this is a control
       that is AVAILABLE rather than one that is asking, and at full action
       colour it asks on every slot you select.
       `is-ready` is the same button once something has changed — solid, which
       is the app's one way of saying "this is the thing to press now".
       NEITHER IS DISABLED. Saving an untouched slot into Patches is a real
       thing to want, and it is how an unedited factory preset gets into the
       library at all. */
    #save-live-btn.is-quiet { color: var(--text-muted); border-color: var(--line); }
    #save-live-btn.is-quiet:hover {
      color: var(--action-ink); background: var(--action); border-color: var(--action);
    }
    #save-live-btn.is-ready {
      color: var(--action-ink); background: var(--action); border-color: var(--action);
    }
    /* RESERVED, not removed. visibility keeps the slot's height, so the panel
       does not jump when an edit arrives and the button appears. */
    #save-live-btn.is-hidden { visibility: hidden; }
    /* The strip's honesty label needs air after the bank it follows —
       "Bank 2 ·3 of 32" ran together in every state where the label is long
       enough to notice (Daniel, 2026-08-21). A margin fixes it once, for every
       state, rather than threading a space through each string. */
    #bank-strip-asof { margin-left: 6px; }


    /* Coming alive is an ANIMATION, not a transition: the panel is re-rendered
       on every live edit, so the node is new each time and has no previous
       state to transition from. .is-appearing is set only on the render where
       it goes live, or it would flare on every drag. */
    .save-slot { overflow: hidden; }
    @keyframes save-wake {
      from { opacity: .35; }
      to   { opacity: 1; }
    }
    .save-slot.is-appearing .audition-bar { animation: save-wake 340ms ease-out both; }
    @media (prefers-reduced-motion: reduce) {
      .save-slot.is-appearing .audition-bar { animation: none; }
    }
    /* In-column: left-aligned with the bank line above, and every decoration
       the old full-width bar carried is undone here or it draws a stray rule
       across the column. */
    /* PROXIMITY: THE BUTTON BELONGS TO THE BLOCK ABOVE IT, which is what it
       acts on. One group reads name · sub-line · location · action, then air,
       then Type and the parameters.
       4px IS THE BLOCK'S OWN RHYTHM, not a new number: .engine-sub and
       .engine-pos are both margin-top 4px, so the button becomes the fourth
       line of the thing it belongs to rather than a fifth element floating
       between two groups. It was 12px, which put the button 14px below the
       bank line against the block's own 4px — three times the block's
       internal spacing, and it read as detached (Daniel: "looks floating out
       in space").
       THE GAP BELOW IS NOT SET HERE AND CANNOT BE. .save-slot is a grid cell
       whose height is dictated by the PICTURE beside it — .engine-stage spans
       rows 2-4 and is the taller of the two — so the cell has slack, and
       whatever is not spent above the bar falls below it automatically. That
       is the behaviour this change wants: tightening above widens below by
       exactly as much, without touching the grid. */
    .save-slot .audition-bar,
    .save-slot .audition-bar.is-live {
      display: block; position: static; z-index: auto; text-align: left;
      margin: 4px 0 0; padding: 0;
      background: none; border: none; box-shadow: none;
    }
    .save-slot .audition-bar .audition-note {
      display: block; margin-top: 6px; min-width: 0; font-size: 12px; line-height: 1.45;
      text-align: left;
    }
    /* Quiet: the two ACTIONS dim and neither can be pressed. The note does
       not — it is what just happened, and saving is precisely what makes the
       controls go quiet, so the confirmation was arriving already greyed out
       (Daniel, 2026-08-13). */
    .save-slot .audition-bar.is-idle .save-actions { opacity: .5; }

    .audition-bar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin: -4px 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
    }
    #audition-btn {
      font: inherit; font-size: 12px; font-weight: 600; color: var(--text);
      background: var(--bg-raised); border: 1px solid var(--line);
      border-radius: 5px; padding: 5px 12px; cursor: pointer; flex: none;
    }
    #audition-btn:hover:not(:disabled) { border-color: var(--text-muted); }
    #audition-btn:disabled { opacity: .6; cursor: default; }
    .audition-note { font-size: 12px; color: var(--text-muted); flex: 1; min-width: 12rem; }
    .audition-note.is-ok { color: var(--modeled); }
    .audition-note.is-error { color: var(--warn-text, #c0392b); }
    /* A live row is interactive: the bar becomes a track you can press
       anywhere along, and switches/selectors respond to a click. */
    .param.is-live .param-bar { cursor: ew-resize; }
    .param.is-live .param-bar:hover { box-shadow: 0 0 0 1px var(--text-dim); }

    .param.is-live .param-bar:hover .param-bar-knob { box-shadow: 0 0 0 3px var(--shade-hard); }
    /* Only the side that would CHANGE something is a target: the lit half is
       already the current value, so it gets no pointer and no hover. */

    .param.is-live .d6-half:not(.pressed),
    .param.is-live .d6-toggle,
    .param.is-live .seg { cursor: pointer; }
    .param.is-live .d6-half:not(.pressed):hover {
      background: var(--shade-hard); color: var(--text);
      box-shadow: inset 0 0 0 1px var(--action);
    }
    .param.is-live .d6-toggle:hover { box-shadow: inset 0 0 0 1px var(--action); }
    .param.is-live .seg:hover { background: var(--action); }
    .param.is-live .param-seg:hover .seg { background: var(--text-dim); }
    /* Audition mode reads as a state you are IN: the header sticks to the top
       of the detail panel as you scroll, and the panel wears an amber edge. */
    .audition-bar.is-live {
      position: sticky; top: -16px; z-index: 5;
      padding-right: 48px; /* keeps the wrapped line clear of the close control */
      margin: -16px -20px 16px; padding: 10px 20px;
      background: var(--bg); border-bottom: 2px solid var(--action);
      box-shadow: 0 6px 12px -8px rgba(0, 0, 0, .45);
    }
    .audition-mode {
      font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--action-ink); background: var(--action);
      padding: 3px 8px; border-radius: 4px; flex: none;
    }
    .audition-patch { font-weight: 600; font-size: 13px; flex: none; }
    #audition-btn.is-secondary { font-weight: 400; color: var(--text-muted); }
    /* The note's height is reserved, so swapping its text (hint, result,
       error) never reflows the row beneath it. */
    /* The line belongs UNDER the controls, not squeezed into the gap beside
       them — it was taking whatever width was left and wrapping to three. */
    .audition-bar.is-live .audition-note {
      flex: 0 0 100%; min-width: 0; min-height: 1.4em; margin-top: 2px;
    }
    /* ONE HEADER LINE ACROSS ALL THREE COLUMNS (Daniel, 2026-11-15).
       The logo and the word tabs used to hold this line alone, leaving it
       empty across the right two-thirds while SOUND ENGINE and EFFECTS CHAIN
       sat a row lower. They share it now, so the line is a header rather than
       a nav strip with a gap in it.

       BELOW THE LINE THE THREE COLUMNS RUN INDEPENDENTLY, and deliberately so.
       An earlier pass coupled them into a shared content row; that is undone.
       The patch name is much larger type than a bank tab, and coupling the
       heights lets the name set the row and drag the bank tabs off the top of
       the list they label — and that closeness is doing real work. The name
       landing roughly level with the tabs is a coincidence worth having, not
       a constraint worth enforcing.

       BASELINES, NOT BOXES. A 12/700 upper label and a 13.33/400 word tab have
       different ascents, so equal boxes — or even equal line-heights — leave
       the text at two different heights. The logo's own fix (1aa88be) put the
       offset in the artwork so no call site carries it; these two labels sit
       in different containers with no shared inline flow, so the offset has to
       be a number here. MEASURED in a rendered window with the font's own
       metrics, not the glyphs' (a line's baseline does not move because its
       words happen to have no descenders): the word tabs' baseline is y202.4,
       and 33.5px puts both column titles within 0.2px of it. Swept — 32px
       lands -1.3, 31px lands -2.3.

       RE-SWEPT after .top-tab's invalid font shorthand was fixed, which took
       the word tabs from the UA default 400 13.333px to their intended
       700 17px. The number did NOT have to change, and that is not luck: the
       nav row is baseline-aligned and its baseline is set by the LOGO, whose
       height comes from a fixed 28.2px drawing rather than from type. The word
       tabs were always aligning to it. Their baseline moved y202.6 -> y202.4,
       and the row's height did not move at all (the bank strip below it went
       y221.1 -> y221.3).
       A NUMBER IN A COMMENT ROTS, so one-header-line.js asserts the two
       baselines match in a real window rather than trusting this paragraph. */
    #detail {
      flex: 1; min-width: 0; overflow-y: auto; scrollbar-gutter: stable;
      padding: 33.5px 20px 16px;
    }
    /* pre-line so the blank line in the message becomes a break — it is two
       statements, what is missing and what to do, and it read as one run-on
       sentence (Daniel, 2026-08-13). Already centred. */
    #detail .placeholder {
      color: var(--text-dim); padding: 40px; text-align: center; white-space: pre-line;
    }
    /* minmax(0, 1fr): a plain 1fr never shrinks below its content's minimum,
       so a patch whose widest word was narrower got a narrower column — 287px
       against 294 (Daniel, 2026-08-13). Now both halves are exactly half,
       whatever is in them. */
    /* THE FREED WIDTH GOES TO THE SOUND ENGINE, not to both columns. It was
       1fr 1fr, so narrowing the left panel by 80px would have handed 40 to a
       column that did not need it. The effects chain is pinned at the 294px it
       already measured, and the engine column takes whatever is left — which
       is where the long sound names, the carousel and the parameter rows all
       compete (Daniel, 2026-11-15). */
    .detail-cols {
      display: grid; grid-template-columns: minmax(0, 1fr) 294px;
      gap: 24px; align-items: start;
      /* For the overlay below. Absolutely positioned, so it takes no grid
         cell and the two columns are laid out exactly as before. */
      position: relative;
    }

    /* ── THE PANEL IS DESCRIBING SOMETHING YOU CANNOT SEE ────────────────
       The detail panel can describe a patch that is not in the list on
       screen: selected in Patches, then the Backups tab, and the right side
       still describes it. This says "this isn't what you're looking at" and
       nothing else — the patch stays in the Seven's buffer, stays audible,
       and the columns keep REPORTING what is live. Dimmed does not mean
       frozen; it means you cannot drive it from here. */
    .detail-cols.out-of-view > .col { opacity: .3; }
    /* The overlay is the barrier, not this — but a control that is visibly
       out of reach should not also take focus by keyboard. */
    .detail-cols.out-of-view > .col { pointer-events: none; }
    .panel-reach {
      position: absolute; inset: 0; z-index: 3;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      /* IT CATCHES CLICKS. The columns beneath are pointer-events: none, so
         without this a press would fall through to whatever is behind them —
         and a control clickable through a "select patch" message is worse
         than no message at all. */
      pointer-events: auto; cursor: default;
      text-align: left;
    }
    .panel-reach .reach-arrow { flex: none; color: var(--amber); }
    .panel-reach .reach-lead {
      margin: 0; font-size: 15px; font-weight: 700; color: var(--text);
    }
    .panel-reach .reach-sub {
      margin: 2px 0 0; font-size: 13px; color: var(--text-muted); max-width: 22em;
    }
    /* A FEW NUDGES, THEN REST. Three at 600ms, toward the list it is pointing
       at — the same rule as the hold screen's blink: a hint that ends is a
       hint, one that never stops reads as an error state. It replays only on
       ENTERING this state, never on the re-renders that happen while it is
       showing. */
    @keyframes reach-nudge {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(-7px); }
    }
    .panel-reach.is-new .reach-arrow { animation: reach-nudge 600ms ease-in-out 3; }
    @media (prefers-reduced-motion: reduce) {
      .panel-reach.is-new .reach-arrow { animation: none; }
    }
    .col-title {
      font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-muted);
      /* Its own spacing, not a number tuned to land the column's content level
         with another column's. The columns are independent below the header
         line. */
      margin-bottom: 10px;
      /* Centered over each column's own width (bank tabs stay left-aligned —
         they're a tab strip, not a column header). */
      text-align: center;
    }

    /* Text on the left, instrument on the right: the picture uses the space
       beside the name rather than taking a band across the top and pushing
       every parameter down. */
    .engine-head {
      /* BLOCK, not flex: the picture floats and the text flows past it, so
         the name and its pill get the panel's full width on the first line
         and only the shorter lines below sit beside the instrument. A flex
         row gave the text a fixed column, and no offset or size could stop
         "Venice Upright U1 Felt" wrapping in it (Daniel, 2026-08-13). */
      /* flow-root: the header CONTAINS its float. A ::after clearfix was not
         enough once the picture moved inside the text column — the parameter
         grid below was laying out beside it, squeezed to 132px with the
         labels truncated (Daniel, 2026-08-13). */
      /* THE NEGATIVE MARGIN IS GONE WITH THE FLOAT. It was -6px to pull back
         the offset the floated picture was pushed down by; with the picture in
         a grid cell there is no offset, and the -6 became exactly 6px of
         parameter row sitting on the stage. Measured: first param y335-367
         against a stage ending at y341. */
      display: flow-root; margin-bottom: 12px;
    }
    /* A GRID, NOT A FLOAT (Daniel, 2026-11-15).
       The picture used to float right and the text flowed past it, which is
       what let a long name share its line with an instrument and what let the
       drawing's neighbours reach the parameter rows. Now:

           name and badge        full width, row 1, nothing beside it
           engine / Bank·Preset  column 1
           Save patch            column 1
           the stage             column 2, spanning those rows

       Every child is placed EXPLICITLY. Auto-placement with one positioned
       item is where this would silently rearrange the day somebody adds a
       fourth meta line. Rows are `auto`, so a missing Bank·Preset or Save
       collapses rather than leaving a gap. */
    .engine-head-text {
      min-width: 0;
      display: grid;
      /* THE TRACK SIZES TO THE PICTURE, which is 128px and fixed.
         It was `min(190px, 50%)` — a track sized for the 187px stage, which is
         reverted. Left at 187 the 128px picture sat at the track's LEFT edge,
         x607..735, where the float it replaced right-aligned it at x646..774.
         `auto` is safe HERE and was not before: the circularity that collapsed
         the text column to 0 (`cols=0px 358px`, measured) came from a
         PERCENTAGE width resolving against a track sizing itself to it. A
         fixed 128 resolves in one pass. */
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 16px;
    }
    .engine-sound { grid-column: 1 / -1; grid-row: 1; }
    .engine-sub   { grid-column: 1; grid-row: 2; }
    .engine-pos   { grid-column: 1; grid-row: 3; }
    /* ABOVE THE WHEEL, WHATEVER THE WHEEL IS DOING. A peek may cross the meta
       TEXT — that is deliberate and has always been allowed — but it may not
       take a click meant for a control. The stage lifts to z-index 5 while the
       wheel is awake so its neighbours can paint over the lines beside it, and
       that lift put the peek's image in front of this button: a click at the
       overlap's own centre was measured hitting `img`, not the button.
       A BUTTON OUTRANKS A PICTURE. z-index needs a position to bite, hence
       the relative. */
    .save-slot    { grid-column: 1; grid-row: 4; position: relative; z-index: 6; }
    /* Spanning the meta rows and ALIGNED TO THE TOP of them, so the row's
       height is the taller of the two and the parameters start below both. */
    .engine-stage { grid-column: 2; grid-row: 2 / span 3; align-self: start; }
    /* THE STAGE IS THE GRID CELL, NOT A BOX THAT SIZES THE PICTURE.
       It was `width: 100%; aspect-ratio: 190/120; overflow: hidden` — a fixed
       187x118 that grew the artwork 46% and clipped it. Both are reverted; the
       cell is now just where fc940cd's grid puts the picture, and the picture
       brings its own 128px.
       No overflow, so the peeks are drawn outside it exactly as they were
       before the stage existed — which is what makes the wheel turnable. */
    .engine-stage { position: relative; isolation: isolate; }
    /* 128px, the size the carousel was built around and the one Daniel
       reported as working. The float is gone because the grid cell places it
       now; the width is not. */
    .engine-stage .engine-art,
    .engine-stage .engine-carousel {
      /* The float is gone because the grid cell places it now. The 128px and
         the 20px of air on its right are the original's, which is what puts
         the picture back at x646..774 rather than hard against the column. */
      float: none; width: 128px; margin: 0 20px 6px 14px;
    }
    /* THE PLAIN VARIANT KEEPS ITS OWN SHAPE — the one a library patch gets,
       where there is no picker. 363/512 at 128 wide, as before the stage: the
       carousel fixed its own proportions on 2026-08-12 with a square box and
       each instrument fitted inside it, and this one never needed to. */
    .engine-stage .engine-art:not(.engine-carousel) {
      aspect-ratio: 363 / 512;
      display: flex; align-items: center; justify-content: center;
    }
    /* ROOM FOR THE HALO, and it is the halo that drew the box edge.
       The dark theme lifts a cut-out off the page with drop-shadow(0 0 9px
       rgba(255,255,255,.16)), which follows the instrument's ALPHA. The fitted
       picture is exactly as tall as the stage, so that glow met the stage's
       overflow:hidden and was cut off square — a straight bright line across
       the top and bottom of the box, which is what a box edge looks like.
       NOT a background baked into the photos. Measured, all 19: alpha is 0 at
       every corner, 24-66% of each canvas is fully transparent, and only
       0.2-0.5% of any canvas sits in the near-invisible 1-8 band — they are
       clean cut-outs, and no element in the chain paints a background
       (every computed backgroundColor rgba(0,0,0,0), no background-image).
       What the composite actually reads, canvas-reproduced with Chromium's own
       filter over the page colour rgb(35,33,30): along the box's top edge
       42,40,37 · 52,50,48 · 45,43,41 — the glow — dropping to the page one
       pixel above. 87% of the box differs from the page at all.
       10px is the room the 9px layer needs. The 26px layer is .07 alpha and
       lands within a level or two of the page, which is why it never drew an
       edge of its own. Padding rather than a smaller max-height so the
       carousel's faces and the plain drawing answer to one number, and the
       scan line is unaffected: app.js measures the DRAWN rect at runtime and
       absolute offsets resolve against the padding box, whose origin does not
       move. */
    /* THE PICTURE IS 128px AND NOTHING CLIPS IT — reverted to the state
       Daniel reported as working (2026-11-15, after the whole chain below).
       fc940cd made two sizing decisions on top of its grid layout: it grew the
       picture into a fixed 187x118 box and it clipped that box. The grid is
       his and stays. The other two are gone, and with them the four commits
       that existed only to cope with them.
       MEASURED, both states, Seven attached:
         76b2b6b  carousel 128px at x646..774, overflow visible, hero centre
                  710 at rest AND awake, both peeks drawn
         fc940cd  stage 187x118, clipped — +46%, and the wheel stopped turning
       The squared-off glow goes with the clip rather than needing the 10px of
       padding that was added to cope with it: nothing cuts the halo now.
       WHAT COMES BACK, deliberately, and is NOT to be fixed: while the wheel
       is TURNING only, the right-hand peek runs past the engine column's right
       edge — 94.7px wide at x754.8..849.5 against a column ending at x794, so
       41% of it stays inside, crossing seven parameter rows and reaching
       109.6px into the effects column. At rest nothing overlaps anything.
       That is the one original flaw. A 96px wheel would stop it and would cost
       a quarter of the resting artwork permanently for something that only
       exists mid-turn; Daniel is not taking that trade. If it ever bothers him
       it is one number, and it will be his. */
    /* The fit-to-the-box rules that lived here are gone with the box. They
       existed because a 187x118 stage CROPPED the tall drawings — Venice Grand
       Open measured 251px inside a 118px box, caught by engine-art-slot.js —
       and nothing crops now: the plain variant carries its own 363/512 above
       and the carousel fits its faces itself. */
    /* The name and its pill stay on one line together; the NAME may wrap. */
    .engine-sound .badge { white-space: nowrap; }
    /* 128, not 150: the picture sets the header's height in every case (the
       longest sound name and description together still come in shorter), so
       every pixel here is a pixel of parameters pushed below the fold on an
       ordinary patch. 128 also widens the text column enough to un-wrap most
       names — better in both dimensions at once. */
    /* Pushed DOWN so the name and its pill get the panel's full width on the
       first line. The picture used to start level with the heading, which
       squeezed the text column and wrapped "Electric Grand Piano" onto two
       lines with the pill stranded on the second (Daniel, 2026-08-13). The
       heading is one line tall, so that is how far it drops. */
