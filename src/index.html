<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
  <title>Crumar Seven Editor</title>
  <style>
    :root {
      --bg: #141416;
      --bg-raised: #1c1c1f;
      --bg-panel: #232326;
      --line: #2e2e33;
      --text: #e8e8ea;
      --text-muted: #77777d;
      --text-dim: #4c4c52;
      --accent: #ff3b30;      /* panel LED red */
      --amber: #ffb020;
      --warn: #d9a13b;
      --sampled: #4fc3d9;
      --modeled: #9a8fd9;
      --bar: #3a3a3f;
      --bar-fill: #8e8e96;
      --bar-fill-changed: #d9d9de;
      --ok: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      /* Inter is self-hosted (registered by app.js via data: URI); the panel
         strip alone uses Archivo inside the SVG. */
      font: 13px/1.45 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column;
      user-select: none;
    }

    /* 1. Panel strip */
    #panel-strip { background: #202022; border-bottom: 1px solid var(--line); }
    #panel-strip svg { display: block; width: 100%; height: auto; max-height: 150px; }
    /* The SVG's readonly class disables all controls; selectively re-enable the
       bank button and preset buttons — they drive the same state as the tabs. */
    #panel-strip #btn-bank,
    #panel-strip [id^="preset-"] .btn {
      pointer-events: auto; cursor: pointer;
    }
    #panel-strip #btn-bank:hover,
    #panel-strip [id^="preset-"] .btn:hover { stroke: #c8c8cc; }
    /* Mapped knobs are click targets for navigation only (strip stays readonly;
       knobs are clickable, never draggable). Unmapped elements get no cursor or
       hover. app.js tags mapped knob groups with .nav-knob. */
    #panel-strip .nav-knob { pointer-events: auto; cursor: pointer; }
    #panel-strip .nav-knob .knob-face { transition: stroke .3s; }
    #panel-strip .nav-knob:hover .knob-face { stroke: #d8d8dc; stroke-width: 3; }
    #panel-strip .nav-ring .knob-face,
    #panel-strip .nav-ring .knob-ring { stroke: var(--accent); stroke-width: 3; }

    /* 2. Connection row */
    #connection-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: var(--bg-raised); border-bottom: 1px solid var(--line);
      color: var(--text-muted); font-size: 12px;
    }
    #connection-row .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim);
    }

    /* Main area: library left, detail right */
    #main { flex: 1; display: flex; min-height: 0; }

    /* 3. Library */
    #library {
      width: 480px; min-width: 400px;
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0;
    }
    #bank-tabs { display: flex; border-bottom: 1px solid var(--line); }
    /* Subtle tabs: selection is carried by the same raised background as a
       selected patch row — no tab outline, no radius. The amber underline is
       text-width (on the label span), so it doesn't stack with the patch row's
       full-width red edge marker. All four tabs are identical when unselected. */
    .bank-tab {
      flex: 1; padding: 9px 0 7px; text-align: center;
      background: transparent; border: none;
      color: var(--text-muted); font: inherit; font-weight: 600; letter-spacing: .08em;
      cursor: pointer;
    }
    .bank-tab:hover { color: var(--text); }
    .bank-tab-label { display: inline-block; padding-bottom: 3px; border-bottom: 2px solid transparent; }
    .bank-tab.active { background: var(--bg-panel); color: var(--amber); }
    .bank-tab.active .bank-tab-label { border-bottom-color: var(--amber); }
    #patch-list { flex: 1; overflow-y: auto; }
    .patch-row {
      display: grid; grid-template-columns: 28px 1fr 1fr auto auto;
      gap: 10px; align-items: center;
      width: 100%; padding: 9px 14px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    .patch-row:hover { background: var(--bg-raised); }
    .patch-row.selected { background: var(--bg-panel); box-shadow: inset 3px 0 0 var(--accent); }
    .patch-num { color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .patch-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .patch-sound { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge {
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      padding: 2px 7px; border-radius: 9px; white-space: nowrap;
    }
    .badge-modeled { color: var(--modeled); border: 1px solid var(--modeled); }
    .badge-sampled { color: var(--sampled); border: 1px solid var(--sampled); }
    .badge-warn { color: #16130b; background: var(--warn); }
    .badge-gap { width: 0; }

    /* 4. Detail */
    #detail { flex: 1; overflow-y: auto; padding: 16px 20px; }
    #detail .placeholder { color: var(--text-dim); padding: 40px; text-align: center; }
    .detail-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .col-title {
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 10px;
    }

    .engine-head { margin-bottom: 12px; }
    .engine-sound { font-size: 17px; font-weight: 700; }
    .engine-sound .badge { vertical-align: 3px; margin-left: 6px; }
    .engine-sub { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .engine-group { color: var(--text-muted); font-size: 12px; }
    .engine-pos { color: var(--text-dim); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .warn-banner {
      margin-top: 10px; padding: 8px 10px; border-radius: 4px;
      background: rgba(217, 161, 59, .12); border: 1px solid var(--warn);
      color: var(--warn); font-size: 12px;
    }

    .fx-section {
      border: 1px solid var(--line); border-radius: 6px;
      padding: 10px 12px; margin-bottom: 12px;
      background: var(--bg-raised);
      /* Nav highlight is background + inset shadow only — no layout shift. */
      transition: background .35s, box-shadow .35s;
    }
    .fx-section.nav-flash {
      background: rgba(255, 59, 48, .07);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .fx-section.dimmed { opacity: .38; }
    .fx-section.collapsed { padding-bottom: 10px; }
    /* Headers are clickable toggles; collapse state is view state only. */
    .fx-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; cursor: pointer; }
    .fx-section.collapsed .fx-head { margin-bottom: 0; }
    .fx-chevron { color: var(--text-dim); font-size: 10px; width: 12px; flex: none; }
    /* Uppercase + tracking is reserved for section headers (matches .col-title). */
    .fx-title { font-weight: 700; letter-spacing: .09em; text-transform: uppercase; font-size: 11px; }
    .fx-summary {
      flex: 1; text-align: right; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums;
    }
    /* State pill: a real control, but it renders device state only — clicks
       never flip it locally (docs/DESIGN.md). */
    .fx-state {
      font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .1em;
      padding: 2px 9px; border-radius: 9px; margin-left: auto;
      cursor: pointer; flex: none;
    }
    .fx-state.on { background: rgba(63, 185, 80, .16); color: var(--ok); border: 1px solid transparent; }
    .fx-state.off { background: transparent; color: var(--text-muted); border: 1px solid var(--line); }
    .fx-state.on:hover { background: rgba(63, 185, 80, .28); }
    .fx-state.off:hover { color: var(--text); border-color: var(--text-muted); }
    .fx-state:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
    .fx-head .fx-summary + .fx-state { margin-left: 0; }
    .device-note { color: var(--text-muted); font-size: 11px; flex: none; }

    .param {
      display: grid; grid-template-columns: 150px 1fr 96px;
      gap: 10px; align-items: center; padding: 3px 0;
    }
    .param-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .param-bar { height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; }
    .param-bar-fill { display: block; height: 100%; background: var(--bar-fill); }
    .param-value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* Enum rows: a dropdown spans the bar area (a choice, not a magnitude). */
    .param-enum .param-value { grid-column: 2 / 4; }
    .select-wrap { position: relative; display: inline-block; }
    .select-wrap::after {
      content: '▾'; position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: var(--text-muted); font-size: 10px;
    }
    .param-select {
      appearance: none; -webkit-appearance: none;
      background: var(--bg-panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 4px;
      font: inherit; font-size: 12px; padding: 3px 24px 3px 9px;
      cursor: pointer; max-width: 200px;
    }
    .param-select:hover { border-color: var(--text-muted); }
    .param-select:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
    .param.is-default .param-select { color: var(--text-muted); }
    .param-value em { font-style: normal; color: var(--text-dim); margin-left: 4px; }
    /* Default vs changed: default is muted, changed is primary. */
    .param.is-default .param-label,
    .param.is-default .param-value { color: var(--text-muted); }
    .param.is-changed .param-label,
    .param.is-changed .param-value { color: var(--text); font-weight: 600; }
    .param.is-changed .param-bar-fill { background: var(--bar-fill-changed); }
  </style>
</head>
<body>
  <div id="panel-strip"></div>
  <div id="connection-row">
    <span class="conn-dot"></span>
    <span id="connection-text">No instrument connected</span>
  </div>
  <div id="main">
    <div id="library">
      <div id="bank-tabs"></div>
      <div id="patch-list"></div>
    </div>
    <div id="detail"><div class="placeholder">Select a patch</div></div>
  </div>
  <script src="defaults.js"></script>
  <script src="renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
