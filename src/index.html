<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
  <title>Crumar Seven Editor</title>
  <style>
    /* Two themes, one variable set. Everything below the aluminium divider
       reads from these; the panel strip is artwork and stays as it is in
       both — the instrument should be the darkest thing on screen. */
    :root {
      /* A TAMER BLACK (change 1 of the six locked 14 Nov 2026). Daniel, on the
         preview in the real window: "make the black a little less midnight
         black and more tame black." #141416 is the panel drawing's OWN ground —
         right behind photoreal artwork, too deep behind type, and the app was
         using it for both jobs. The drawing keeps it as --page.
            --bg        #141416 -> #1b1b1e
            --bg-panel  #232326 -> #2a2a2e
            --line      #2e2e33 -> #33333a
         DARK ONLY: the light values below already match the mock. */
      --bg: #23211e;
      --bg-raised: #2d2a26;
      --bg-panel: #2d2a26;
      --line: #3d3934;
      /* The old ground, kept for what it was always right for: behind the
         instrument artwork, so a drawing still reads as resting on something
         rather than floating on the new lighter surface. */
      --page: #1c1a17;
      --text: #e6dfd2;
      --select-chevron: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 9" width="14" height="9"><path d="M2 2 L7 7 L12 2" fill="none" stroke="%23e8e8ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      --text-muted: #9d9484;
      --text-dim: #9d9484;
      --accent: #b5584a;
      /* The same red as channels, for a keyframe that has to fade it. rgba()
         cannot take a hex, and the arrival animation interpolates from fully
         transparent to full chroma on the selected-row edge. */
      --accent-rgb: 181, 88, 74;
      /* TEXT ON A RED FILL. Near-black on this red failed to read; warm paper
         does. Delete buttons and the modal's destructive bar wear it.
         MEASURED AGAINST THE SMALL-TEXT BAR, which is the one that applies:
         the label is 12px/600, so 4.5:1 rather than the 3:1 large text gets.
         #f6ece2 on --accent #b5584a was 4.04:1 and failed. The ground is the
         brand red and is load-bearing elsewhere — the selected-row edge, the
         warning border, the connecting dot — so the INK moved instead, which
         is used on this one fill and nowhere else. #fffaf6 reads 4.54:1 and
         is still warm rather than a plain white. Light theme was already
         5.22:1 and is untouched. */
      --accent-ink: #fffaf6;
      /* An OUTLINED pill is state, never an action (DESIGN.md). Its border is
         quieter than its word so the shape reads before the colour. */
      --pill-amber-border: #7d6a45;
      --pill-on-text: #a9c3a1;
      --pill-on-border: #56704f;
      --pill-on-bg: #2f3a2b;
      --amber: #c9a25e;
      /* Action green: the panel's own DEPTH/RATE legend (#4fb96a in
         assets/seven-panel.svg). Filled buttons that DO something wear it. */
      --action: #7f9c78;
      --action-ink: #08150d;
      /* THE SAME GREEN AS WORDS, damped (DESIGN.md, "full chroma for marks,
         damped for text"). --action is borrowed from a printed legend a few
         millimetres tall; set on a 12px bold label it is many times the ink,
         and the first pass of the list design read as neon because of exactly
         this. A filled control keeps --action; text that acts takes this.
         In LIGHT they are the same value — on paper the legend green is
         already at word strength, so nothing needs damping. */
      --action-text: #a9c3a1;
      /* THE LOGO IS A LIT SIGN, and the one element in the app allowed to
         change value by theme (DESIGN.md, "The one exception"). Dark: the
         panel green, glowing. Unlit: a dark version of its own hue, so an
         unselected sign reads as switched off rather than as grey type. */
      --logo: #7f9c78;
      --logo-off: #3a4a3e;
      /* The 1px top highlight on a chosen surface — a tab or a selected row.
         The panel's own cap highlight, which is where "chosen" gets its
         slight physicality without a second surface tone. */
      --cap-hi: rgba(255, 255, 255, .06);

      /* Instrument illustrations (assets/instruments/*.svg, inlined so these
         reach them — an SVG loaded through <img> is its own document and
         inherits nothing). Flat-design colours, tuned per theme: the drawings
         sit on the panel surface in dark mode and on the antiqued paper in
         light, and the same greys read differently against each. */
      --inst-chassis: #33333a;
      --inst-chassis-accent: #565663;
      --inst-outline: #0b0b0d;
      --inst-hardware: #9a9aa4;
      --inst-key-white: #efece4;
      --inst-key-black: #17171a;
      --inst-wood: #7a4a24;
      --inst-wurlitzer-red: #c0392b;
      --inst-dx7-turquoise: #29a396;
      --inst-lcd: #3fbf6a;
      --inst-grille: #9d968a;
      --inst-rail: #cfc9ba;
      --inst-stripe: #c0392b;
      --inst-knob: #d98324;
      --warn: #d9a13b;
      --sampled: #7f9c78;
      /* MUTED STEEL BLUE for the warm palette (Daniel, 2026-11-15). #5b8fd9
         was the panel's blue legend and it was the one cool, saturated thing
         left on a warm charcoal screen. The Model/Sample distinction stays —
         blue against green — it is just brought to the same temperature as
         everything around it. Text and border both. */
      --modeled: #8fa8c4;
      --bar: #3a3a3f;
      --bar-fill: #8e8e96;
      --bar-fill-changed: #d9d9de;
      --ok: #3fb950;
      --shade: rgba(255, 255, 255, .05);   /* hover */
      --shade-hard: rgba(255, 255, 255, .08);
      --card-border: transparent;
      --d6-frame-bg: #101012;
      --d6-frame-border: #000;
    }
    /* Antiqued white: warm paper, not grey. Accents darken rather than
       change hue, so the two themes stay recognisably the same UI. */
    :root[data-theme="light"] {
      /* THE LIGHTER GROUND WAS TRIED IN THE REAL APP AND REJECTED
         (Daniel, 2026-11-15). #faf8f2 / #fffefb — the two lightest surfaces
         lifted, with --bg-panel, --line and --page held so the furniture kept
         its bite. It measured well: seventeen pairs moved and every one went
         UP, nothing newly failed. He ran it and preferred what shipped.
         Not reverted in history — the commit that tried it and this one that
         takes it back are both in the log, so the next person to propose it
         can read what it looked like and why it did not stay. Measuring well
         is not the same as looking right, and the app is the judge. */
      --bg: #f0ebe0;
      --bg-raised: #f8f5ed;
      --bg-panel: #e4ddcd;
      --line: #d2c9b6;
      --text: #26231f;
      --select-chevron: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 9" width="14" height="9"><path d="M2 2 L7 7 L12 2" fill="none" stroke="%2326231f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      --text-muted: #6a6355;
      /* A CONTRAST FIX, AWAITING DANIEL'S LOOK — not a settled design value.
         #8a8375 had been failing since long before either palette commit:
         3.16:1 on --bg and 3.45:1 on --bg-raised, against the 4.5 small text
         needs. This ink carries the row numbers and the unselected tab
         labels, so it is not decorative.

         NOT #78715f, which is the value the fix was requested as. That figure
         (4.57:1) was measured against the LIGHTER ground that has since been
         reverted. On this ground it is 4.08:1 on --bg and 4.46:1 on
         --bg-raised — better, and still failing. Shipping it would have been
         a contrast fix that does not fix the contrast.

         #6e695e is the first value along the SAME warm grey — all three
         channels scaled together, so the hue and the warmth are untouched —
         that clears 4.5 on both surfaces: 4.59:1 on --bg, 5.01:1 on
         --bg-raised.

         THE COST, because it is real: --text-muted is 5.01:1 on --bg, so dim
         and muted are now 0.42 apart there. The two-step hierarchy is intact
         but narrow, and on this ground it cannot be wider — anything quieter
         fails the bar and anything clearer passes --text-muted. That is the
         trade, and it is Daniel's to accept or drop with one revert. */
      --text-dim: #6e695e;
      --accent: #b8362b;
      --accent-rgb: 184, 54, 43;
      /* LIGHT IS UNTOUCHED by the dark repaint of 2026-11-15, but every
         variable must exist in BOTH palettes — test/css-hazards.test.js fails
         the build otherwise, because a colour defined in one theme is
         invisible in the other until somebody switches. These are the light
         values the same elements already used. */
      --accent-ink: #f8f1ec;
      --pill-amber-border: #b9a06a;
      --pill-on-text: #1c7a45;
      --pill-on-border: #8fb79c;
      --pill-on-bg: #e4efe6;
      --amber: #8a5d00;
      /* THE LIGHT GROUND IS ALREADY TAME. Change 1 is dark-only: these values
         were measured against the mock and match it, so only --page is new —
         the antiqued paper one step down, for the artwork to sit on. */
      --page: #ded5c2;
      /* Darkened from #2c8b4f on 2026-08-21. Same hue; it simply was not dark
         enough to be read on any light surface. Measured against WCAG AA
         (4.5:1 for normal text), on the three surfaces it can land on:
             as text   on --bg        3.60 -> 5.47
                       on --bg-raised 3.92 -> 5.97
                       on --bg-panel  3.16 -> 4.81
             --action-ink on it       3.96 -> 6.03   (the filled button)
         All four were failing, so this is not one link's problem. Dark mode's
         #4fb96a already passes at 6.33-7.43 and is untouched. */
      --action: #1f6b3d;
      --action-ink: #f4f7f5;
      /* SAME VALUE AS --action HERE, deliberately, and not a copy-paste slip:
         on paper the legend green is already at word strength, so there is
         nothing to damp. The variable still has to exist in both palettes —
         test/css-hazards.test.js fails the build otherwise, because a colour
         defined in one theme is invisible in the other until somebody
         switches. */
      --action-text: #1f6b3d;
      /* FOREST, chosen 14 Nov 2026 from six candidates all sourced from the
         panel drawing (the LOCAL OFF magenta, the LED red, this green, the
         panel teal, the unlit ochre legend, plain ink).
         It differs from the dark value where the panel strip deliberately does
         not, and that is allowed for one reason: the panel is a picture of a
         machine, the logo is a lit SIGN. A sign reads as its emission in the
         dark and as its own material in daylight. One object, two lights.
         WATCH: this is also --action-text in light, both descended from the
         DEPTH/RATE legend, so the shared hue is honest rather than a
         coincidence — a 31px script in the corner is not confusable with a
         12px label in the foot. If a third thing wants this green, split them
         then. */
      --logo: #1f6b3d;
      --logo-off: #b3a994;
      --cap-hi: rgba(255, 255, 255, .6);

      --inst-chassis: #3f3f47;
      --inst-chassis-accent: #6b6b78;
      --inst-outline: #23232a;
      --inst-hardware: #8d8d97;
      --inst-key-white: #fbf8f1;
      --inst-key-black: #23232a;
      --inst-wood: #8b5424;
      --inst-wurlitzer-red: #b7382c;
      --inst-dx7-turquoise: #1f8d82;
      --inst-lcd: #35a85c;
      --inst-grille: #b3ab9b;
      --inst-rail: #ddd7c8;
      --inst-stripe: #b7382c;
      --inst-knob: #c9761f;
      --warn: #7d5a10;
      --sampled: #1c7a45;
      --modeled: #2a5fae;
      --bar: #d8d0be;
      --bar-fill: #6a6355;
      --bar-fill-changed: #26231f;
      --ok: #2c7139;
      --shade: rgba(0, 0, 0, .045);
      --shade-hard: rgba(0, 0, 0, .075);
      --card-border: #ddd5c4;
      --d6-frame-bg: transparent;
      --d6-frame-border: transparent;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* The window itself never scrolls: the panel strip is a fixed reference at
       the top, and only the two columns below scroll, independently. A root
       scrollbar could otherwise shift the whole UI when sections expand. */
    html, body { height: 100%; overflow: hidden; }
    /* Light and dark cross-fade rather than cut. The rule is scoped to a class
       that exists only for the ~1s of a switch (src/app.js), so no ordinary
       hover, drag or re-render pays for it — and the switch is the one moment
       where every surface in the window changes at once, which is exactly when
       a cut is most jarring. Only the properties that carry the palette. */
    html.theme-fading, html.theme-fading *, html.theme-fading *::before,
    html.theme-fading *::after {
      transition: background-color 1s ease, color 1s ease, border-color 1s ease,
                  fill 1s ease, stroke 1s ease, box-shadow 1s ease, opacity 1s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      html.theme-fading, html.theme-fading *, html.theme-fading *::before,
      html.theme-fading *::after { transition: none; }
    }
    body {
      background: var(--bg);
      color: var(--text);
      /* Inter is self-hosted (registered by app.js via data: URI); the panel
         strip alone uses Archivo inside the SVG. */
      font: 13px/1.45 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column;
      user-select: none;
    }

    /* 1. Panel strip */
    #panel-strip { background: #202022; border-bottom: 1px solid #2e2e33; }
    #panel-strip svg { display: block; width: 100%; height: auto; max-height: 150px; }
    /* The SVG's readonly class disables all controls; selectively re-enable the
       bank button and preset buttons — they drive the same state as the tabs. */
    /* Full-button hit targets: the transparent .btn-hit rect (drawn last,
       sized to the bezel) is the only element that takes clicks — the readonly
       rule keeps suppressing the faces beneath. Hover brightens the face via
       :has() since the overlay sits above it. */
    #panel-strip .btn-hit { pointer-events: auto; cursor: pointer; }
    /* Child combinators, both sides: `g:has(.btn-hit:hover)` alone matches
       every ANCESTOR group, so the shared `sec-presets` parent matched and
       hovering one preset lit all eight. The hovered hit rect must be a
       direct child, and only that group's own face/bezel respond. */
    #panel-strip .btn-face:not(.on):has(~ .btn-hit:hover) { fill: #2b2b2e; }
    #panel-strip .btn-bezel:has(~ .btn-hit:hover) { fill: #1e1e20; }
    /* Momentary press state — BANK only (presets have a persistent selected
       state instead). app.js drives .bank-pressed with a ~150ms minimum hold
       so a quick click still reads as intentional, then keeps it while held.
       Press-down is instant (transition: none while pressed); release settles
       via a 120ms fade. */
    #panel-strip g:has([data-hit="bank"]) #btn-bank,
    #panel-strip g:has([data-hit="bank"]) .btn-inset { transition: fill 120ms; }
    #panel-strip g.bank-pressed #btn-bank { fill: #141416; transition: none; }
    #panel-strip g.bank-pressed .btn-inset { fill: #232325; transition: none; }
    /* Mapped knobs are click targets for navigation only (strip stays readonly;
       knobs are clickable, never draggable). The transparent .knob-hit circle —
       drawn last, radius of the outer ring — is the ONLY element that takes
       pointer events, so the readonly rule keeps suppressing the face/pointer.
       Unmapped elements get no cursor or hover. app.js tags mapped knob groups
       with .nav-knob. */
    #panel-strip .knob-hit { pointer-events: none; }
    #panel-strip .nav-knob .knob-hit { pointer-events: auto; cursor: pointer; }
    #panel-strip .nav-knob .knob-ring { transition: stroke .3s; }
    #panel-strip .nav-knob .knob-glass { transition: filter .3s; }
    /* One treatment per annulus: the outer ring belongs to the FOCUSED knob
       only (its section expanded). At rest there is no ring at all; hover
       shows the same ring dimmed so clickability stays discoverable. The lit
       cue lives on the face (amber fill+outline) and never uses the annulus. */
    #panel-strip .nav-knob:not(.nav-ring):hover .knob-ring { stroke: rgba(255, 59, 48, .35); }
    /* Two distinct, stackable knob cues (docs/DESIGN.md):
       LIT (effect on, patch data)  = amber cap fill + amber outline + dark
                                      pointer. ID-prefixed so the SVG's own
                                      .knob-face rule can't override the fill.
       EXPANDED (view state)        = accent OUTER RING only — never the face,
                                      so it can't be mistaken for amber. */
    /* Lit = the LED under the clear plastic is on: the whole knob glows from
       the center out, brightest in the bore. The COLOR is the hardware's
       value-encoding (manual; confirmed live on Volume): green at low values
       sweeping to red at high. updateKnobLit() computes the hue and sets the
       material custom properties inline — they inherit through the use-element
       boundary, which class selectors cannot cross. */
    #panel-strip .knob-lit .knob-glass { filter: drop-shadow(0 0 6px var(--k-shadow, rgba(255, 157, 46, 0.45))); }
    #panel-strip .nav-ring .knob-ring { stroke: #ff3b30; stroke-width: 3; }

    /* 2. Connection row — styled after the hardware's brushed-aluminum
       divider strip, with the red-felt keybed line as its bottom edge. */
    #connection-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background:
        repeating-linear-gradient(90deg,
          rgba(255, 255, 255, 0.05) 0 1px, rgba(0, 0, 0, 0.035) 1px 3px),
        linear-gradient(180deg,
          #c9c9ce 0%, #ababb1 42%, #bcbcc2 55%, #8b8b92 100%);
      border-bottom: 4px solid #8f2420; /* the felt */
      color: #26262a; font-size: 12px;
    }
    #connection-row #connection-text { text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35); }
    /* The write gate. Full width and under the felt, because it is about the
       instrument, and a sentence about the instrument must not be clipped into
       a tooltip the way the status line is. */
    /* [hidden] is a UA default of display:none, and ANY display rule beats it.
       Giving this flex made the banner permanently visible — an empty beige
       strip with a Report button, under the connection row, for everyone
       (shipped in a32fc5b, caught 2026-08-15 by a screenshot that showed a
       band the code said was hidden). The attribute needs its own rule now
       that the element has a layout mode. */
    #write-gate[hidden] { display: none; }
    #write-gate {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 9px 16px;
      background: #f6e6c8;
      color: #4a3410;
      border-bottom: 1px solid #d8c093;
      font-size: 12px; line-height: 1.5;
    }
    #write-gate b { font-weight: 600; }
    /* The action, right-aligned: for someone whose instrument this app cannot
       verify, sending the table is the only useful next move — so it sits at
       the end of the sentence that told them, not in a settings tray they
       would have to go looking for. */
    #write-gate-text { flex: 1 1 320px; min-width: 0; }
    #write-gate-text p { margin: 0 0 6px; }
    #write-gate-text p:last-child { margin-bottom: 0; }
    #report-instrument {
      flex: 0 0 auto;
      padding: 5px 12px;
      background: transparent;
      border: 1px solid rgba(74, 52, 16, 0.55); border-radius: 4px;
      color: #4a3410; font: inherit; font-weight: 600; cursor: pointer;
    }
    #report-instrument:hover { background: rgba(74, 52, 16, 0.09); }
    #report-instrument:disabled { opacity: .5; cursor: default; }
    #connection-row .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #66666d;
    }
    #connection-row.connected .conn-dot { background: #2e7d43; }
    .conn-name { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
    .conn-fw { color: var(--text-dim); margin-left: 8px; }
    #connection-row.connecting .conn-dot { background: var(--accent); }
    #connection-row.failed .conn-dot { background: #a8221c; }
    #conn-button {
      margin-left: auto;
      background: none; border: 1px solid rgba(0, 0, 0, 0.35); border-radius: 5px;
      color: #26262a; font: inherit; font-size: 12px;
      padding: 2px 10px; cursor: pointer;
    }
    #conn-button:hover { color: #000; border-color: rgba(0, 0, 0, 0.6); }
    #conn-button:disabled { opacity: 0.5; cursor: default; }
    /* Backup: the row's one call to action wears the felt red. */
    #backup-button {
      margin-left: auto;
      background: none; border: 1px solid #8f2420; border-radius: 4px;
      color: #8f2420; font: inherit; font-size: 12px; font-weight: 600;
      padding: 2px 10px; cursor: pointer;
    }
    #backup-button:hover { color: #6e1a17; border-color: #6e1a17; }
    #backup-button + #conn-button { margin-left: 0; }
    #connection-row { position: relative; }
    /* Three columns, not two things and a floating third. The toggle used to be
       absolutely centred, which put it out of flow — so a long status line ran
       underneath it and the buttons collided with it on a narrow window. Equal
       flex on the two side groups centres it exactly, and now everything in the
       row can see everything else. */
    .conn-status, .conn-actions { display: flex; align-items: center; flex: 1 1 0; min-width: 0; }
    .conn-status { gap: 8px; }
    .conn-actions { gap: 8px; justify-content: flex-end; }
    /* The failure messages are sentences, and a sentence must not push the
       controls off the strip. It gets the room it has and says the rest in its
       tooltip. */
    #connection-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #theme-toggle {
      flex: none;
      display: flex; border: 1px solid rgba(0, 0, 0, .3); border-radius: 5px;
      overflow: hidden; background: rgba(0, 0, 0, .06);
    }
    #theme-toggle button {
      font: inherit; font-size: 12px; padding: 2px 14px;
      background: none; border: none; color: #4a4a50; cursor: pointer;
    }
    #theme-toggle button + button { border-left: 1px solid rgba(0, 0, 0, .22); }
    #theme-toggle button:hover { color: #000; }
    /* Selected reads as the raised half of a two-way switch. */
    #theme-toggle button[aria-pressed="true"] {
      background: linear-gradient(180deg, #fbfaf7, #e4e2dd);
      color: #16161a; font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9);
    }
    /* [hidden] is a UA rule (display:none) and ANY author display wins over
       it — so a bare `display: inline-flex` here made the gear render while
       hidden, which is how it turned up in the connection row with no
       instrument attached. Scope the display to the not-hidden case. */
    #settings-button {
      font: inherit; font-size: 12px; padding: 2px 10px;
      color: #26262a; background: none;
      border: 1px solid rgba(0, 0, 0, 0.35); border-radius: 4px; cursor: pointer;
    }
    #settings-button:hover, #settings-button.open { color: #000; border-color: rgba(0, 0, 0, 0.6); }
    #settings-panel {
      position: absolute; top: 100%; right: 12px; z-index: 30;
      /* Nine short rows of label + dropdown. It was sized like the sounds
         table beside it, which is a 24-row grid and needs the room; this is a
         list of switches and was mostly air (Daniel, 2026-08-12). */
      min-width: 280px; max-width: 320px; max-height: 70vh; overflow-y: auto;
      background: var(--bg-raised); border: 1px solid var(--line);
      border-top: none; border-radius: 0 0 6px 6px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
      padding: 10px 12px 8px;
      /* The tray hangs inside #connection-row, which hard-codes near-black text
         for the brushed-metal strip — the metal is the same in both themes, so
         its ink cannot follow one. A panel is not the metal, and inheriting
         that ink painted the labels near-black on the dark panel
         (Daniel, 2026-08-12). */
      color: var(--text);
    }
    .settings-head {
      font-size: 11px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
    }
    .set-row {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; border-top: 1px solid var(--line);
    }
    .set-row:first-child { border-top: none; }
    .set-name { flex: 1 1 auto; min-width: 0; font-size: 12px; }
    /* A name we have not pinned against the device is shown, because the raw
       value is still worth seeing — but it is marked, and it cannot be
       written. */
    .set-row.is-unverified .set-name { color: var(--text-muted); }
    .set-guess {
      margin-left: 6px; font-size: 10px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-dim);
    }
    .set-value { flex: none; font-size: 12px; color: var(--text-dim); min-width: 26px; text-align: right; }
    .set-toggle {
      flex: none; font: inherit; font-size: 11px; font-weight: 700;
      letter-spacing: .05em; text-transform: uppercase;
      min-width: 52px; text-align: center;
      padding: 2px 10px; border-radius: 10px; cursor: pointer;
      color: var(--text-muted); background: none; border: 1px solid var(--line);
    }
    .set-toggle[aria-pressed="true"] {
      color: var(--action-ink); background: var(--action); border-color: var(--action);
    }
    .set-toggle:disabled { opacity: .5; cursor: default; }
    /* Every global is a named list on the instrument, so it is a named list
       here. A switch reading On/Off would have been our word for it; these are
       the device's own — "N.O.", "From Preset", "TX OFF". */
    /* The app's dropdown (src/picker.js). A native select can be styled shut
       and not styled open — the list belongs to the OS — so a tray in the
       app's colours dropped a grey macOS menu out of itself. */
    .picker {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      font: inherit; font-size: 11px; line-height: 1.6;
      padding: 1px 6px; border-radius: 5px; cursor: pointer;
      color: var(--text); background: var(--bg); border: 1px solid var(--line);
    }
    .picker:hover:not(:disabled) { border-color: var(--text-dim); }
    .picker:focus-visible { outline: 2px solid var(--action); outline-offset: 1px; }
    .picker:disabled { opacity: .5; cursor: default; }
    .picker-text { white-space: nowrap; }
    /* Flex-centred box around the geometric chevron, exactly as .fx-chevron
       does it — the caret sits on the midline of the value beside it because
       the box centres a known shape, not because a font's ink happened to land
       there. No colour of its own: it inherits the button's, so the chevron is
       the colour of the text it belongs to. */
    .picker-caret { flex: none; display: flex; align-items: center; justify-content: center; }
    .picker-caret svg { display: block; }
    /* Fixed, not absolute: the trays this opens in scroll and clip, and a
       dropdown's whole job is to leave its container. */
    .picker-list {
      position: fixed; z-index: 100; overflow-y: auto;
      padding: 4px; border-radius: 6px;
      background: var(--bg-raised); border: 1px solid var(--line);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .5);
    }
    .picker-option {
      padding: 3px 8px; border-radius: 4px; cursor: pointer;
      font-size: 11px; color: var(--text); white-space: nowrap;
    }
    .picker-option.is-active { background: var(--action); color: var(--action-ink); }
    /* The current value stays marked even while the pointer is elsewhere in
       the list — otherwise moving the mouse loses your place. */
    .picker-option[aria-selected="true"] { font-weight: 700; }
    .picker-option[aria-selected="true"]::after {
      content: ' ✓'; color: var(--text-dim);
    }
    .picker-option.is-active[aria-selected="true"]::after { color: var(--action-ink); }
    /* Which keys a sound answers to. Drawn only where a limit has been HEARD
       on the instrument — see schema/key-ranges-1.37.json. */
    /* A parameter row in everything but kind: same grid, same label column, so
       it lines up with the controls above it instead of floating under them. */
    /* Its own copy of the parameter grid. The row is a SIBLING of .params, not
       a child, so it never inherited those columns and the keyboard sat ~40px
       right of the bars (Daniel, 2026-08-13). Same 116px label column, so the
       keybed starts on the same edge as every BAR above it — the bars, not the
       label words: the keyboard is the picture-equivalent of a control, so it
       lines up with the controls. Both restricted sounds share this, which is
       what keeps the two keybeds consistent with each other. */
    /* `.param.engine-keyrange`, not `.engine-keyrange`: the row carries BOTH
       classes, and `.param` (line ~1996) sets `grid-template-columns: subgrid`
       later in this file — same specificity, so it won on source order. Subgrid
       needs a parent grid to borrow tracks from and this row's parent is not
       one, so the columns silently fell back to auto and the 116px label became
       142px of content, pushing the keybed 26px right of the bars. Two classes
       beat one; measured 626 = 626 afterwards. */
    .param.engine-keyrange {
      display: grid; grid-template-columns: 116px 1fr minmax(40px, max-content);
      gap: 10px; align-items: center; margin-top: 10px;
    }
    .keyrange-label { color: var(--text-muted); }
    .keyrange-keys { grid-column: 2; display: block; min-width: 0; }
    /* Sized by HEIGHT, letting the viewBox set the width — 61 keys at their
       drawn size ran past the panel and over the section list beside it. Its
       own width/height attributes are a starting size, not a claim on the
       layout. */
    .key-range {
      display: block; height: 22px; width: auto; max-width: 100%;
      border: 1px solid var(--line); border-radius: 2px;
    }
    .kr-white { fill: var(--bg-raised); stroke: var(--line); stroke-width: .4; }
    .kr-black { fill: var(--text); }
    /* Outside the range the keyboard INVERTS: white keys go dark, black keys
       go light. The keys stay drawn — the point is WHICH part of the board is
       dead, which you cannot see if the dead part is missing — but a fade left
       the two halves too close to tell apart at 22px tall. A negative reads at
       a glance (Daniel, 2026-08-12). */
    .kr-white.is-mute { fill: var(--text); stroke: var(--text); }
    .kr-black.is-mute { fill: var(--bg-raised); stroke: var(--text); stroke-width: .4; }
    .keyrange-note {
      font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums;
    }
    /* The dressed select stays in the DOM — hidden, not removed — because
       every listener and every UI scenario still talks to it. */
    .select-wrap.is-dressed { display: none; }
    .picker-param { font-size: 12px; padding: 2px 8px; }
    .param.is-inert .picker-param { opacity: .55; }
    .settings-foot {
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
      font-size: 12px; color: var(--text-dim); line-height: 1.5;
    }
    /* The unit's sound table. It was a tray of its own hanging off a chip in
       the connection row; it is now the body of a modal opened from the
       bottom of Settings — one less button in the row, for something nobody
       clicks twice a session (Daniel, 2026-08-13). The list styling is
       unchanged and class-scoped so it travels with the content. */
    /* ---- Sample expansions modal ----------------------------------------
       Two axes, both readable at a glance: MODELED vs SAMPLED reuses the
       app's existing colours (blue for modeled, green for sampled — the same
       pair as the sound badges and the carousel halo), and PERMANENT vs
       INSTALLABLE is carried by the row itself: permanent rows are plain
       text, installable rows have a status pill. */
    /* The warning is a way in to the expansion list, so it says so. */
    .badge-warn, .sound-tag.is-warn, .warn-banner { cursor: pointer; }
    /* This modal is a list of ten expansions with three data columns, not a
       question — 440px made every second title wrap. It gets its own width;
       nothing else changes. */
    .seven-modal.is-expansions { width: min(860px, 96vw); }
    /* One field, nothing else: naming a new patch. */
    .name-input {
      width: 100%; box-sizing: border-box;
      padding: 7px 9px; font: inherit; font-size: 14px;
      color: var(--text); background: var(--bg);
      border: 1px solid var(--line); border-radius: 4px;
    }
    .name-input:focus { outline: none; border-color: var(--action); }
    /* The name rule, said where the name is typed. Short and plain: the field
       is where someone is looking, and a toast after the press would be a
       refusal arriving after the moment they believed it worked
       (Daniel, 2026-08-18). */
    .name-taken {
      margin: 6px 2px 0; font-size: 12px; color: var(--warn-text, #c0392b);
    }
    .seven-modal-ok[disabled] { opacity: .45; cursor: not-allowed; }
    .exp-modal { max-width: 100%; }
    /* Two columns: the permanent sixteen on the left, the ten expansions on
       the right. Roughly balanced by row count, and both visible at once —
       what you have and what you are missing is one question. */
    .exp-cols { display: grid; grid-template-columns: 1fr 1.35fr; gap: 26px; align-items: start; }
    .exp-cols.is-single { grid-template-columns: 1fr; }
    @media (max-width: 720px) { .exp-cols { grid-template-columns: 1fr; gap: 0; } }
    /* A permanent sound: name and the instrument's own id, nothing else. */
    .exp-row.is-plain { grid-template-columns: 2.4em minmax(0, 1fr); }
    /* CONTRAST, scoped to this modal. Every failing style in here — .exp-note,
       .exp-sub, .exp-id, .exp-size, .exp-stamp, and .exp-name in light — draws
       its colour from --text-dim or --text-muted, so the tokens are redefined
       for the modal rather than each class being overridden one at a time.
       Measured against WCAG AA (4.5:1 for 12-13px text), on --bg-panel:

           dark    --text-dim   2.44 -> 5.21      --text-muted 4.64 -> 7.03
           light   --text-dim   2.78 -> 4.90      --text-muted 4.40 -> 6.09

       SCOPED ON PURPOSE. The tokens themselves fail app-wide, and raising them
       globally would collapse the three-tier hierarchy — text / muted / dim —
       because dim cannot reach 4.5:1 in dark without landing on top of muted's
       present value. Rebalancing all three is the contrast audit's job, which
       is deliberately post-launch (CLAUDE.md). This finishes the one surface
       that was reported, and the audit should delete it when it does the rest.

       The two tiers stay distinguishable within the modal: dim is still the
       quieter of the two, by roughly the same distance as before. */
    .seven-modal.is-expansions { --text-dim: #94949d; --text-muted: #adadb5; }
    :root[data-theme="light"] .seven-modal.is-expansions {
      --text-dim: #625c50; --text-muted: #544e44;
    }

    .exp-id {
      text-align: left; font-size: 12px; color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    .exp-stamp { margin: 5px 0 0; font-size: 11px; color: var(--text-dim); }
    .exp-group { margin: 0 0 12px; }
    /* One green in this modal, and it is the Installed pill — the thing you
       scan for. The headings were competing with it (Daniel, 2026-08-15), so
       modeled/sampled is carried by a rule on the left edge instead: the same
       two colours the app uses everywhere, without shouting. */
    .exp-group h4 {
      margin: 0 0 2px; font-size: 12px; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text);
      border-left: 3px solid transparent; padding-left: 8px;
    }
    .exp-group.is-modeled h4 { border-left-color: var(--modeled); }
    .exp-group.is-sampled h4 { border-left-color: var(--sampled); }
    .exp-group .exp-sub { margin: 0 0 5px 11px; color: var(--text-dim); font-size: 12px; }
    /* Three columns, so they line up whatever the name's length: name (fills),
       size (right-aligned so the decimals stack), status (fixed). */
    .exp-row {
      /* The name gets what is left, and the other three are sized to their
         content: a date, a size, a pill. Too generous here and every title
         wraps — "Venice Grand CB1898" is not a long name and should not need
         two lines (measured 2026-08-15). */
      /* Numbered list: the position leads, like any list of things you count.
         Then the name, the size, and the status. */
      display: grid; grid-template-columns: 3.2em minmax(0, 1fr) 5em 7em;
      align-items: baseline; gap: 8px;
      padding: 2px 0 2px 11px; border-top: 1px solid var(--line);
    }
    .exp-row:first-of-type { border-top: none; }
    .exp-name { min-width: 0; }
    .exp-size {
      text-align: right; font-variant-numeric: tabular-nums;
      color: var(--text-dim); font-size: 12px; white-space: nowrap;
    }
    .exp-pill {
      justify-self: end; font-size: 11px; padding: 1px 6px; border-radius: 9px;
      border: 1px solid var(--line); color: var(--text-dim); white-space: nowrap;
    }
    .exp-pill.is-installed { color: var(--sampled); border-color: var(--sampled); }
    .exp-pill.is-missing { color: var(--text-dim); }
    .exp-pill.is-unverified { color: #8a6d1f; border-color: #b99a45; }
    .exp-pill.is-partial { color: #a8221c; border-color: #a8221c; }
    .exp-pill.is-wide { grid-column: 3 / span 2; }
    .exp-note { margin: 4px 0 0; color: var(--text-dim); font-size: 12px; line-height: 1.45; }
    .exp-note strong { color: var(--text); font-weight: 600; }
    .exp-foot { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
    .exp-foot ol { margin: 6px 0 0; padding-left: 18px; }
    .exp-foot li { margin: 3px 0; }
    .exp-storage { margin: 0 0 8px; color: var(--text-dim); font-size: 12px; }

    .sounds-table .sounds-cols { display: flex; gap: 18px; }
    /* Content-sized, not equal halves: 8 modeled names against 16 sampled ones
       is not a 50/50 split, and `flex: 1` gave the short column the same width
       as the long one and left the difference as air. */
    .sounds-table .sounds-group { flex: 0 1 auto; min-width: 0; }
    .sounds-table h4 {
      /* The settings tray's heading treatment (.settings-head). */
      margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-dim); line-height: 1.3;
    }
    /* Hairline-separated rows, like .set-row — one list of facts about the
       instrument, drawn the way the other one is. */
    .sounds-table .sound-row {
      display: flex; gap: 8px; padding: 3px 0; font-size: 12px;
      color: var(--text); white-space: nowrap;
      border-top: 1px solid var(--line);
    }
    /* The first row sits flush under its heading; the heading is not a row. */
    .sounds-table .sound-row:first-of-type { border-top: none; }
    .sounds-table .sound-id {
      width: 20px; text-align: right; color: var(--text-dim);
      font-variant-numeric: tabular-nums; flex: none;
    }
    .sounds-table .sounds-foot {
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
      font-size: 12px; color: var(--text-dim); line-height: 1.5;
    }
    /* A row that opens something, at the foot of the settings list. It reads
       as one more row until you hover it, because that is what it is — the
       instrument's sound table, filed with the instrument's other facts. */
    .set-link {
      width: 100%; font: inherit; text-align: left; cursor: pointer;
      background: none; color: inherit; border: none;
      border-top: 1px solid var(--line);
    }
    /* A NAME, so the damped value — the ring below is the mark and keeps its. */
    .set-link:hover .set-name, .set-link:focus-visible .set-name { color: var(--action-text); }
    .set-link:focus-visible { outline: 2px solid var(--action); outline-offset: -2px; }
    .set-link .set-chev { flex: none; color: var(--text-dim); font-size: 13px; line-height: 1; }

    /* Main area: library left, detail right */
    #main { flex: 1; display: flex; min-height: 0; }

    /* 3. Library */
    /* ONE VALUE DECIDES THE LEFT PANEL (Daniel, 2026-11-15): 400px, or 36% of
       the window where that is narrower. It was a fixed 480 with a 400 floor.
       The percentage is what stops a narrow window squeezing the effects
       column — at 1100px the panel gives back 4px rather than holding 400 and
       taking it out of the columns.
       THERE IS NOTHING TO PRESERVE HERE. The divider that used to set this was
       draggable and its position persisted; the four-tab layout removed it
       along with the two trays, so this is the only width there is.
       flex: none, so the width above is the answer and flex-shrink cannot
       quietly overrule it. */
    #library {
      flex: none; width: min(400px, 36%); min-width: 0;
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0;
    }
    /* .bank-tabs admits a second instance of the same component — the backup
       detail view's tabs. The tabs themselves are
       .bank-tab either way; only the container needed a class. */
    /* A REGION IS NOT A CONTROL, so it draws no focus ring.
       #library and #bank-region carry tabindex="-1" so a click can put focus
       somewhere sensible. On macOS a click on a <button> does not focus the
       button, so focus lands on the nearest focusable ANCESTOR — the panel —
       and Chromium drew its default ring round it: an orange edge down both
       sides of the library (Daniel, 2026-11-15). Orange because
       -webkit-focus-ring-color follows the system accent, measured here as
       rgb(229, 151, 0).
       Suppressed rather than restyled: there is nothing to indicate. A focused
       region offers no action of its own, and what it DOES carry — which tab
       and which row are selected — the tab and the row already show. */
    #library:focus, #library:focus-visible,
    #bank-region:focus, #bank-region:focus-visible { outline: none; }

    /* NO RULE UNDER THE STRIP. "Lines separate rows. Nothing else" — regions
       are separated by space and type size (the design language agreed 14 Nov
       2026, which also took out the rule under the top tabs and the one above
       the foot). The chosen tab's own tint is what marks the strip now. */
    #bank-tabs, .bank-tabs { display: flex; }
    /* Subtle tabs: selection is carried by the same raised background as a
       selected patch row — no tab outline, no radius. The amber underline is
       text-width (on the label span), so it doesn't stack with the patch row's
       full-width red edge marker. All four tabs are identical when unselected. */
    /* LEVEL 2 WEARS THE REGION-HEADER TREATMENT: 12/700, .12em, uppercase
       (DESIGN.md's type ladder). It was 13/600 at .08em — a size the ladder
       does not have, which is how 11px and 14px crept in before. The mock has
       carried the ladder's own values since the design was agreed. */
    /* SENTENCE CASE, BECAUSE THESE ARE CONTROLS (Daniel, 2026-11-15).
       Caps with tracking means "a label, not a control" everywhere else in
       this app — SOUND ENGINE, EFFECTS CHAIN, AS OF LAST BACKUP, the effects
       cards — and not one of those is clickable. The bank tabs are clickable
       and were wearing the label treatment, which is the one place the rule
       broke. Both tab rows are navigation, so they look like each other:
       sentence case, no tracking, a step smaller than the word tabs above.
       Recorded as a rule in DESIGN.md, not just changed here.
       The DOM text is already "Bank 1" — it was CSS doing the shouting — so
       nothing downstream that reads a label has to change.
       WHAT STAYS: the amber underline on the selected tab, and the lock on
       Bank 1. The underline is the selection vocabulary, not a caps effect. */
    .bank-tab {
      flex: 1; padding: 9px 0 7px; text-align: center;
      background: transparent; border: none;
      color: var(--text-dim); font: inherit;
      /* 14/700, chosen by Daniel against his approved mock after seeing 12/600
         rendered — they read differently at a glance and the mock won. */
      font-size: 14px; font-weight: 700;
      cursor: pointer;
    }
    .bank-tab:hover { color: var(--text); }
    .bank-tab-label { display: inline-block; padding-bottom: 3px; border-bottom: 2px solid transparent; }
    /* Bank 1 is Crumar's and the Seven won't be written to there. One lock on
       the tab, in place of the badge that used to repeat it on all eight rows.
       Dim, and it does not brighten with the tab: it is a note about the bank,
       not a second thing to read (Daniel, 2026-08-16). */
    .bank-tab-lock { margin-left: 9px; vertical-align: -1px; color: var(--text-dim); }
    /* THE UNDERLINE CARRIES THE SELECTION ALONE. The word was amber too, which
       is the same thing said twice — "underline = selection" is already the
       vocabulary (DESIGN.md). The tint and the 1px cap highlight say "chosen"
       the same way the selected row does, so wherever the tint appears,
       something is selected. */
    .bank-tab.active {
      background: var(--bg-panel); color: var(--text);
      box-shadow: inset 0 1px 0 var(--cap-hi);
    }
    .bank-tab.active .bank-tab-label { border-bottom-color: var(--amber); }
    /* The eight bank rows are always fully visible — they never scroll out of
       view when the Library opens; the Library body scrolls internally. */
    #patch-list { flex: none; }
    /* One line: number, name, then the sound and its badge together on the
       right — the same right-hand pairing the library rows use. */
    .patch-row {
      display: grid; grid-template-columns: 28px 1fr auto auto auto;
      gap: 10px; align-items: center;
      width: 100%; padding: 9px 14px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    /* --shade-hard, not --bg-raised: a translucent overlay lifts a row on
       WHATEVER it sits on. The library's rows are already the raised colour,
       so hovering them to that same colour did nothing at all, and the two
       lists answered a pointer differently (Daniel, 2026-08-13). */
    .patch-row:hover { background: var(--shade-hard); }
    .patch-row.selected { background: var(--bg-panel); box-shadow: inset 3px 0 0 var(--accent); }
    .patch-num { color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .patch-row .patch-sound { text-align: right; }
    .patch-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .patch-sound { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge {
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      padding: 1px 6px; border-radius: 7px; white-space: nowrap;
    }
    /* One pill, two labels: the kind at rest, the instrument on hover. */
    .lib-row-wrap { position: relative; display: block; }
    .patch-delete {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0; cursor: pointer;
      color: var(--text-dim); background: none; border: none; border-radius: 4px;
      opacity: 0; transition: opacity .12s;
    }
    .lib-row-wrap:hover .patch-delete, .patch-delete:focus-visible { opacity: 1; }
    /* Send to Seven, on a backup row. Same anchoring and reveal as the delete
       control it stands in place of — a record is read-only, so this is the
       one action its row offers. */
    .patch-send {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; cursor: pointer; font: inherit; font-size: 11px;
      color: var(--text-dim); background: var(--bg-panel);
      border: 1px solid var(--line); border-radius: 4px;
      opacity: 0; transition: opacity .12s, color .12s, border-color .12s;
    }
    .lib-row-wrap:has(.lib-row.selected) .patch-send,
    .lib-row-wrap:hover .patch-send,
    .patch-send:focus-visible { opacity: 1; }
    .patch-send:hover { color: var(--text); border-color: var(--text-muted); }
    /* Where a row also has a delete control, Send sits to its left rather than
       under it — both are anchored to the row's right edge. */
    .lib-row-wrap:has(.patch-delete) .patch-send { right: 32px; }
    .patch-delete:hover { color: var(--warn-text, #c0392b); background: var(--shade-hard); }
    /* .badge-modeled / .badge-sampled are the DETAIL PANEL's pill only. The
       list rows lost theirs on 2026-08-21 — engine type describes the patch
       that is loaded, and saying it on every row said it 32 times.
       Gone with them: .badge-sound and the hover swap that showed the sound's
       name in the pill's place, and .badge-gap, the empty spacer that reserved
       the warning's width beside a pill there is no longer. */
    .badge-modeled { color: var(--modeled); border: 1px solid var(--modeled); }
    .badge-sampled { color: var(--sampled); border: 1px solid var(--sampled); }
    .badge-warn { color: #16130b; background: var(--warn); }

    /* TYPE SCALE below the panel — four tiers, nothing else:
         hero      17px/700  --text          detail sound name
         primary   13px/600  --text          item names, param rows
         metadata  12px/400  --text-muted    origin, sound, position, counts,
                                             summaries — every secondary fact
         header    12px/700  .12em caps      region/section/FX titles
         pill      10px/700                  badges and state chips
       Add a role to a tier rather than inventing a new size. */

    /* 3a. FOUR TABS, ONE LIST. The two-region model this replaced had the bank
       rows above and the library below, expanding mutually exclusively with a
       one-line summary strip so the instrument-to-computer relationship stayed
       on screen. The transfer names its own destination now, and both regions
       were never actually visible together — one was always a strip — so the
       tabs lose nothing and remove the strip's own overlap bug with it. */
    .patch-row.empty-slot .patch-name { color: var(--text-dim); font-style: italic; font-weight: 400; }

    /* ---- LEVEL 1: the four tabs ------------------------------------------
       BASELINE, NOT CENTRE. A script face has a far deeper descender than a
       grotesque, so centring the boxes floats the logo above the line its
       neighbours sit on. The baselines are what the eye reads, so they are
       what is aligned.
       The 7px padding under every tab gives the underline somewhere to sit
       that clears the descenders of "Patches" and "Setlists"; the transparent
       border on all four means selecting one moves no layout. */
    #top-tabs {
      display: flex; align-items: baseline; flex: none;
      padding: 14px 14px 11px; flex-wrap: wrap; row-gap: 8px;
    }
    /* LONGHAND, BECAUSE THE SHORTHAND WAS INVALID AND SILENTLY DISCARDED.
       `font: 700 17px/1.1 inherit` looks like it sets three things and sets
       none: the shorthand's last value must be a font-FAMILY, `inherit` is not
       a family token there, so the whole declaration is thrown away — the 700
       and the 17px with it. The `font-family: inherit` beside it still applied
       on its own, which is why the family looked right and nothing ever looked
       broken enough to chase. These tabs rendered at the UA button default,
       400 13.333px, from the day the rule was written until 2026-11-15.
       A BARE `font: inherit` IS FINE and is used ~30 times in this file. Only
       a shorthand that MIXES `inherit` with other values is broken, and there
       were exactly two — this and .top-strut. css-hazards.test.js now fails on
       the shape rather than trusting anyone to spot it again. */
    .top-tab {
      font-size: 17px; font-weight: 700; line-height: 1.1; font-family: inherit;
      background: none; border: 0; padding: 0 0 7px; cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--text-dim); transition: color .14s ease;
    }
    .top-tab:hover { color: var(--text-muted); }
    .top-tab[aria-selected="true"] { color: var(--text); }
    /* :not(.top-logo) IS THE RULE, and it stays a negation rather than a list
       of the three word tabs: a fourth word tab added later must get the
       underline by default, while the one thing that LIGHTS stays the
       exception that names itself. */
    .top-tab[aria-selected="true"]:not(.top-logo) { border-bottom-color: var(--amber); }
    .top-grp { display: flex; align-items: baseline; gap: 16px; }
    /* The divider separates two GROUPS — the Seven is one thing, the computer
       is three — and centres on the row rather than sitting on the baseline. */
    .top-split {
      width: 1px; height: 17px; background: var(--line);
      margin: 0 15px 0 14px; flex: none; align-self: center;
    }
    /* THE LOGO IS A LIT SIGN (DESIGN.md), the one element allowed to differ by
       theme, and the only one that may glow. The bloom is tight and low: lit,
       not neon. A drop-shadow on the PATHS, not a text-shadow — the ink is a
       shape, so the glow follows the strokes instead of a glyph box. */
    .top-logo { position: relative; padding: 0 2px 7px 0; line-height: 1; color: var(--logo-off); }
    /* The strut carries the SAME metrics as a word tab on purpose: it is what
       gives the logo button a text baseline to sit the artwork on (1aa88be).
       It had the same invalid shorthand, so it had the same wrong metrics —
       and the two were wrong together, which is why the logo still lined up
       with the tabs while both were at 13.333px. */
    .top-strut { font-size: 17px; font-weight: 700; line-height: 1.1; font-family: inherit; }
    /* IN FLOW, so the button sizes to the ink and nothing can overlap it.
       Absolute positioning took the drawing out of flow once: the button's
       width came from the zero-width strut alone and a ~90px drawing painted
       straight across "Patches".
       28.2px, not 31: the asset's box is cropped to the letters' baseline
       (626 units, not 688), so the same number would render ~9.8% larger.
       31 x 626/688 = 28.2 is the size the design was approved at. */
    .top-logo svg { display: inline-block; height: 28.2px; width: auto; }
    .top-logo:hover { color: var(--logo); }
    .top-logo[aria-selected="true"] {
      color: var(--logo);
      filter: drop-shadow(0 0 5px color-mix(in srgb, var(--logo) 45%, transparent))
              drop-shadow(0 0 13px color-mix(in srgb, var(--logo) 22%, transparent));
    }
    /* LIT ON PAPER, and not the dark glow in another colour. A sign in
       daylight does not halo white — it spills its own colour onto the surface
       behind it, so the spill is wider and much weaker, reading as more
       SATURATED than the ground rather than brighter. Only the spill changes;
       the ink is the same either way. */
    :root[data-theme="light"] .top-logo[aria-selected="true"] {
      filter: drop-shadow(0 0 9px color-mix(in srgb, var(--logo) 30%, transparent))
              drop-shadow(0 0 22px color-mix(in srgb, var(--logo) 17%, transparent))
              drop-shadow(0 0 44px color-mix(in srgb, var(--logo) 8%, transparent));
    }

    /* ---- the freshness caveat, on its own line ---------------------------- */
    #fresh-line { display: flex; justify-content: flex-end; padding: 2px 14px 6px; flex: none; }
    .fresh {
      font-size: 10px; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--text-dim);
    }

    /* ---- the foot: 12px labels, sentence case ---------------------------- */
    /* THE SEVEN TAB'S ALONE (Daniel, 2026-11-15). The only thing the three
       list tabs had down here was "Open library folder", which is now an icon
       on their own top line — so the row is empty for them, and an empty
       54px-min strip is just the list being shorter for no reason. Hidden
       rather than removed: the Seven tab still needs it for "Save this bank
       as a setlist".
       data-view is already on #library, set by setView, so this needs no new
       state and cannot disagree with which tab is actually showing. */
    #library:not([data-view="seven"]) #lib-foot { display: none; }
    #lib-foot {
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      padding: 14px 14px 16px; min-height: 54px; flex: none;
    }
    .foot-slot { font-size: 12px; font-weight: 700; color: var(--action-text); }
    .foot-link {
      background: none; border: 0; padding: 0; cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 400;
      color: var(--text-dim); margin-left: auto;
    }
    .foot-link:hover { color: var(--text-muted); }
    .foot-link:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 3px; }

    /* ONE LIST ON SCREEN. The tab decides which of the two containers is in
       the layout at all — not opacity, not height: a hidden list must not be
       reachable by a click or an arrow key. */
    #bank-region {
      display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto;
    }
    #library[data-view="seven"] #library-body { display: none; }
    #library:not([data-view="seven"]) #bank-region { display: none; }
    /* The list scrolls inside a fixed height, so a cut-off row can look like
       the end of the list. A fade over the bottom edge says otherwise; the
       .at-end class removes it once there is nothing left to scroll to. */
    #library-body { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; position: relative; }
    #library-body::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 28px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none; opacity: 1; transition: opacity .15s ease;
    }
    #library-body.at-end::after { opacity: 0; }
    /* Every other long scroller fades its own bottom edge with a mask — no
       wrapper needed, and it blends to whatever is behind it. The library list
       can't use this: a masked element becomes the containing block for its
       position:fixed children, which would trap the patch picker inside the
       list (src/scroll-fade.js). */
    #detail, .pick-body {
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
    }
    #detail.at-end, .pick-body.at-end {
      -webkit-mask-image: none; mask-image: none;
    }
    #library-body .lib-bar { flex: none; }
    #library-body .lib-list { flex: 0 1 auto; min-height: 0; }
    .lib-count { flex: 1; color: var(--text-muted); font-size: 12px; }
    /* Said once for the region, above the list and outside its scroller, so it
       cannot slide away from the rows it explains. Quiet: it is a statement
       about what the app cannot see, not a warning about a patch. */
    .lib-unknown-sounds {
      margin: 0 0 6px; padding: 0 2px;
      color: var(--text-muted); font-size: 12px;
    }
    /* A control of its own inside a clickable header row. It carried NO style
       at all until now, so it drew the platform's native button chrome — a
       light slab that ignored the theme and looked wrong in the dark one. And
       because only the row had a hover state, pointing at the button lit up
       the whole row, i.e. said "collapse" when it meant "open Finder"
       (Daniel, 2026-08-16). Two hovers, never both at once. */
    /* WHY EVERY ICON BUTTON WAS MISSING ITS TOOLTIP (measured 2026-08-19).
       Inside an <svg>, a tooltip comes from a <title> CHILD ELEMENT — the HTML
       `title` ATTRIBUTE on an ancestor is not consulted. So the pointer landed
       on a <path>, Chromium found no SVG title, and nothing appeared; hovering
       the button's padding just outside the glyph DID work, which is why it
       read as sporadic. Text buttons like Assign were always fine because the
       hit target is the button itself.
       Making the glyph transparent to the pointer hands every hit back to the
       button, so one `title` per control serves both the tooltip and the
       accessible name. Events bubbled to the button anyway, so no handler
       changes — and e.target is now the button, which is stricter, not looser. */
    button svg { pointer-events: none; }

    /* .lib-reveal is GONE. It was a bordered button in the library header,
       opaque at rest so the header's own hover wash could not light it up
       (Daniel, 2026-08-19) — a problem that no longer exists, because the
       header it sat in does not. The folder now opens from a plain 12px link
       in the foot (.foot-link), which is where the design puts it and where
       nothing else claims the pointer. */
    /* The FOLDER total, beside the button that opens the folder. It used to
       sit in the header over a filtered list, where it was accurate and
       therefore confusing — "36 patch files" above a tab showing one
       (Daniel, 2026-08-14). */
    /* Which patches the list shows. Segments rather than a dropdown: the
       counts are the point, and a dropdown hides two thirds of them. */
    /* Its own line, under the tabs it filters — reading as "this tab, shown
       this way" rather than as a fourth tab. */
    .lib-bar {
      display: flex; gap: 8px; align-items: center; padding: 8px 2px 8px;
      border-bottom: 1px solid var(--line);
      /* The scope control wraps to its own line. Three tabs, three scope
         segments and the search magnifier do not fit across a 480px pane —
         measured, after "From the Seven" was clipped by the pane edge
         (Daniel, 2026-08-14). */
      flex-wrap: wrap;
    }
    /* TABS, like the bank tabs above — one navigation metaphor in the app
       rather than tabs in one region and a segmented button in the other
       (Daniel, 2026-08-13). Same amber underline, same active panel colour. */
    /* The SAME tabs as #bank-tabs: same padding, same weight and tracking,
       same underline, and the row carries the same bottom rule. The library's
       were smaller and tighter, which read as a different control doing the
       same job (Daniel, 2026-08-13). They share the row with the search, so
       they size to their labels rather than splitting the width. */
    .lib-seg { display: inline-flex; flex: none; gap: 0; }
    .seg-btn {
      background: transparent; border: none; padding: 9px 16px 7px;
      color: var(--text-muted); font: inherit; font-weight: 600; letter-spacing: .08em;
      cursor: pointer;
    }
    .seg-btn.active { background: var(--bg-panel); color: var(--amber); }
    .seg-btn.active .seg-label { border-bottom-color: var(--amber); }
    .seg-label { display: inline-block; padding-bottom: 3px; border-bottom: 2px solid transparent; }
    .seg-btn:hover:not(.active) { color: var(--text); }
    /* THE BAR INSIDE A DETAIL VIEW: "‹ Backups   14 November".
       The title is a flex child here, NOT the absolutely-centred span the old
       head used. That span was centred on the header so it would not shuffle
       when the Send button's bank number changed width — and the cost was that
       it knew nothing about what it was centring over, so at this pane width
       it overlapped the button by 6px. Laid out in the line, it cannot.
       It also takes the leftover width and truncates, which the nowrap
       absolute span could not: setlist names are user-written and long. */
    /* 6px, the gutter the rows use — the back button moved up here from
       .lib-setlist-head, which had just been aligned to it, and .lib-bar's own
       2px would have put it back on the panel edge. */
    .lib-bar-detail { flex-wrap: nowrap; padding-left: 6px; }
    .lib-detail-title {
      min-width: 0; flex: 1 1 auto;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 15px; font-weight: 600; color: var(--text);
    }
    /* ALWAYS OPEN, AND NARROW (Daniel, 2026-11-15).
       The magnifier used to be a button that revealed the field, so searching
       cost a click and then a keystroke. It is one keystroke now, and the
       magnifier is part of the field rather than a control in front of it.
       flex: none, DELIBERATELY. The old field was `flex: 1` and filled the
       row, which reads as the row's subject; this one is a tool at the end of
       it. 180px fits "Search name or sound" comfortably at 12px without
       taking the line.
       The wrapper carries the border so the glyph sits INSIDE the field. */
    .lib-search-wrap {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      width: 180px; max-width: 46%;
      background: var(--bg-panel); color: var(--text-dim);
      border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px;
    }
    .lib-search-wrap:focus-within { outline: 1px solid var(--amber); outline-offset: 1px; }
    .lib-search-mag { flex: none; }
    .lib-search {
      flex: 1; min-width: 0; font: inherit; font-size: 12px;
      background: none; color: var(--text); border: 0; padding: 0;
    }
    .lib-search:focus { outline: none; }
    /* The native search clear button is a grey X that does not follow either
       palette; the field is narrow and Escape already clears it. */
    .lib-search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    /* OPEN LIBRARY FOLDER, at the right end of the line. It was a text link in
       the foot; the foot goes away on these three tabs, and an icon here is
       where you already are. Icon-only, so the accessible name and the tooltip
       are the only thing naming it — both are on the button in library-view.js
       and a scenario asserts them, because an unlabelled icon button is
       invisible to anyone not using a mouse and eyes. */
    .lib-folder {
      flex: none; margin-left: auto;
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 26px; padding: 0; cursor: pointer;
      color: var(--text-dim); background: none;
      border: 1px solid transparent; border-radius: 5px;
    }
    .lib-folder:hover { color: var(--text); border-color: var(--line); }
    .lib-folder:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
    /* The list is the internal scroller — fixed max height so the bank rows
       above never leave the viewport. The scrollbar is ALWAYS visible
       (custom-drawn, so macOS overlay hiding doesn't apply): without it, a
       320px viewport over 32 rows silently reads as "11 patches, the end". */
    .lib-list { max-height: 320px; overflow-y: auto; scrollbar-gutter: stable; }
    /* THE LIST TAKES THE HEIGHT on the three list tabs (Daniel, 2026-11-15).
       The 320px cap exists so the BANK ROWS above the list never leave the
       viewport — and on these tabs there are no bank rows above it, just the
       one top line. With the foot gone too, the cap was the only thing left
       holding the list at six rows while the panel below it sat empty.
       #library-body is already a flex column with min-height: 0, so removing
       the cap lets the list fill what is actually there and scroll inside it.
       The Seven tab keeps the cap, and keeps its reason with it. */
    #library:not([data-view="seven"]) .lib-list { max-height: none; }
    .lib-list::-webkit-scrollbar { width: 10px; }
    .lib-list::-webkit-scrollbar-track { background: transparent; }
    .lib-list::-webkit-scrollbar-thumb {
      background: var(--bar); border-radius: 5px;
      border: 2px solid var(--bg); background-clip: padding-box;
    }
    .lib-list::-webkit-scrollbar-thumb:hover { background: var(--bar-fill); }
    .lib-row {
      display: grid; grid-template-columns: 1fr 1fr auto auto;
      gap: 10px; align-items: center;
      width: 100%; padding: 7px 6px;
      background: none; border: none; border-bottom: 1px solid var(--line);
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    /* The same hover the BANK rows use — a lit row under the pointer, in the
       raised panel colour, so every list in the app answers a hover the same
       way (Daniel, 2026-08-13). The library's rows are buttons and wrappers
       both, so the setlist and backup rows need it named explicitly: their
       clickable part is a child, and hovering the row never reached it. */
    .lib-row:hover,
    .lib-setlist-row:hover,
    .lib-setlist-row:hover .lib-setlist { background: var(--shade-hard); }
    .lib-setlist-row { cursor: pointer; }
    /* Selected library patch wears the same red edge marker as a selected
       bank row — one vocabulary for "selected patch" (docs/DESIGN.md). */
    .lib-row.selected, .lib-slot-patch.selected { background: var(--bg-panel); box-shadow: inset 3px 0 0 var(--accent); }
    .lib-row-invalid { opacity: .55; cursor: default; }
    .lib-rename-input {
      font: inherit; font-weight: 600; color: var(--text);
      background: var(--bg); border: 1px solid var(--amber); border-radius: 3px;
      padding: 1px 5px; min-width: 0;
    }
    .lib-empty { color: var(--text-dim); padding: 18px 8px; text-align: center; }
    /* Stacked name + origin line in library rows. */
    /* Patch rows read as two lines: the name and its badge on top, then the
       provenance and the sound it uses beneath — related facts paired, and
       the name free to run the width of the row (sound names reach 22 chars,
       e.g. "Venice Upright U1 Felt", which crowded a side-by-side layout). */
    /* One line per patch, grouped by bank: slot number, name, then the sound
       and its badge on the right — the same right-hand pairing the bank rows
       use. Bank and capture date sit in the group header, not on every row. */
    .lib-row.lib-patch {
      grid-template-columns: 22px 1fr auto auto auto;
      row-gap: 0; align-items: center;
      /* Room for the trash icon, which is positioned over the row's right
         edge rather than laid out in it — the date ran right up against it
         (Daniel, 2026-08-14). Reserved whether or not the icon is showing, so
         the date does not shift under the pointer on hover. */
      padding-right: 34px;
    }
    .lib-row.lib-patch .patch-num {
      color: var(--text-dim); font-size: 12px; font-variant-numeric: tabular-nums;
    }
    .lib-group + .lib-group { margin-top: 4px; }
    /* A group heading that carries an action sits on one line with it. */
    .lib-group-title-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .lib-group-title {
      position: sticky; top: 0; z-index: 1;
      background: var(--bg); padding: 7px 6px 5px;
      font-size: 12px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text-muted);
      border-bottom: 1px solid var(--line);
    }
    /* Slot rows stack name over provenance in one cell (they keep the
       single-line grid the slot controls need). */
    .name-cell { display: flex; flex-direction: column; min-width: 0; }
    .name-cell .patch-name { min-width: 0; }
    .lib-row.lib-patch .patch-sound,
    .lib-row.lib-patch .lib-origin,
    .lib-row.lib-patch .lib-badges { text-align: right; }
    .lib-origin {
      font-size: 12px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* The list fills whatever height the window leaves. There is no cap any
       more: the divider that set one is gone with the two-tray layout, and so
       is the persisted split it wrote. */
    .lib-list { flex: 1 1 auto; }
    /* A setlist row is a button plus its own delete control, so the row is a
       container rather than one button. */
    .lib-setlist-row { display: flex; align-items: center; gap: 6px; padding: 0; }
    /* Three columns where a row is numbered — the number, the name, the
       count. Two columns wrapped the count onto its own line as soon as the
       number arrived (Daniel, 2026-08-13). */
    .lib-setlist-row .lib-setlist {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
      flex: 1; min-width: 0; padding: 7px 6px;
      background: none; border: none; color: var(--text); font: inherit;
      text-align: left; cursor: pointer;
    }
    .lib-setlist-row .lib-setlist:has(.patch-num) {
      grid-template-columns: 1.9rem 1fr auto;
    }
    .setlist-send {
      font: inherit; font-size: 12px; font-weight: 600; color: var(--text-muted);
      background: none; border: 1px solid var(--line); border-radius: 4px;
      padding: 3px 9px; cursor: pointer; flex: none;
      opacity: 0; transition: opacity .12s;
    }
    .lib-setlist-row:hover .setlist-send { opacity: 1; }
    .setlist-send:hover { color: var(--action-text); border-color: var(--action); }
    .setlist-send:focus-visible { opacity: 1; }
    .setlist-delete {
      display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; flex: none;
      background: none; border: none; border-radius: 4px;
      color: var(--text-dim); cursor: pointer; opacity: 0; transition: opacity .12s;
    }
    .lib-setlist-row:hover .setlist-delete { opacity: 1; }
    .setlist-delete:hover { color: var(--warn-text, #c0392b); background: var(--shade-hard); }
    .setlist-delete:focus-visible { opacity: 1; }
    .lib-setlist-chev { color: var(--text-dim); font-size: 15px; padding-right: 6px; }
    /* THE SAME GUTTER THE ROWS USE. A list view indents its content 6px — the
       row number of every .lib-row and .lib-slot sits at x6 — and the detail
       views did not: the head was 2px, so the back button's box and the title
       beneath it sat on the panel's left edge while the numbered rows below
       them were indented (Daniel, 2026-11-15). 6px, measured off .lib-row and
       .lib-slot rather than chosen, so the three left edges line up.
       The BOX, not the text: .lib-back is a bordered button, so its border is
       what the eye reads as its left edge, and that is what matches a row's
       number. Aligning its TEXT instead would hang the border outside the
       gutter by its own 8px padding. */
    .lib-setlist-head {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 6px 8px; color: var(--text-muted);
    }
    /* In the header it is a permanent control, not a hover affordance: the
       rule above hides .setlist-send until its ROW is hovered, and there is no
       row here to hover — so it was present and invisible. */
    /* AN ACTION LINE, flushed right. The back button used to live here with
       `margin-right: auto` pushing the icons and Send to the far end; it is in
       the bar now, so the row aligns its own contents instead.
       EMPTY DRAWS NOTHING: a backup run with no Send (the bank-tab branch
       passes '') would otherwise leave a padded, ruled strip behind. */
    .lib-setlist-head { justify-content: flex-end; }
    .lib-setlist-head:empty { display: none; }
    /* The centred date is GONE from this line, with the rule that positioned
       it. It was absolute so it would centre on the header rather than on the
       leftover space, which kept it still as the Send button's bank number
       changed width (Daniel, 2026-08-20) — and the same absoluteness is why it
       could overlap that button by 6px at this pane width. It is a laid-out
       flex child of .lib-bar now (.lib-detail-title), where it cannot.
       Removed rather than left behind: a rule with no element is the same
       zero-consumer shape as the Notes strip. */
    .lib-setlist-head .setlist-send { opacity: 1; }
    /* Drawn on the same grid as .slot-clear (the trash can on a slot row):
       no fill, hairline stroke, round joins — and the same colour and the same
       colour-only hover, so they read as one family rather than two. */
    .setlist-icon {
      display: flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; flex: none;
      background: none; border: none; border-radius: 5px;
      color: var(--text-dim); cursor: pointer;
    }
    /* THE GLYPH BRIGHTENS, AND NOTHING ELSE HAPPENS — the same hover the trash
       can on a slot row has (.slot-clear:hover, colour only). A filled halo
       behind the icon is a second shape appearing on hover, and next to a
       panel of hairlines it reads as a button growing rather than an icon
       waking up (Daniel, 2026-08-19). */
    .setlist-icon:hover { color: var(--text); }
    .setlist-icon:focus-visible { color: var(--text); }
    /* An empty setlist exports eight dashes and a timestamp, which is no use
       to anybody. Dimmed, unclickable, and the tooltip says why. */
    .setlist-icon[disabled] { opacity: .35; cursor: default; }
    .setlist-icon[disabled]:hover { color: var(--text-dim); }
    /* .lib-setlist-title is gone too. The setlist's name had a line of its own
       because a long user-written one could not share a row with three
       controls; it shares the bar with the back button now, and truncates
       there, so the line it needed no longer exists. */
    /* Same reason inside a backup: a bank heading is not a hoverable row, so
       its Send would have stayed invisible (Daniel, 2026-08-13). */
    .lib-group-title-row .setlist-send { opacity: 1; }
    .lib-back {
      font: inherit; font-size: 12px; color: var(--text-muted);
      background: transparent; border: 1px solid var(--line); border-radius: 4px;
      padding: 2px 8px; cursor: pointer;
    }
    .lib-back:hover { color: var(--text); border-color: var(--text-muted); }
    .lib-setlist-name { font-weight: 600; color: var(--text); }
    /* Same hierarchy as a library row — name + badge, then provenance +
       sound — with the slot controls in their own column so both text rows
       stop short of the ✕. */
    /* Feedback, centred in the window rather than parked at the bottom edge.
       Down there it was missed: the eye is on the library or the panel, and a
       message that appears outside where you are looking may as well not have
       appeared (Daniel, 2026-08-12 — "I'm still seeing a modal in the lower
       portion flash by"). Everything the app says now arrives in the same
       place the modals do. */
    /* The Notes strip: one quiet line, the width of the window. Nothing on it
       but the sentence and a way to make it go away. */
    #notes-strip {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px;
